<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="900" viewBox="0 0 1360 900" role="img" aria-labelledby="title desc"><title id="title">Продолжать текст и помогать — разные задачи.</title><desc id="desc">Почему базовая модель может продолжить вопрос вместо полезного ответа? Post-training добавляет примеры выполнения инструкций и другие сигналы: предпочтения или проверяемые результаты. Меняется поведение помощника. Но понравившийся человеку ответ и фактически правильный ответ — разные критерии. Нужна достаточно способная базовая модель и обучающий сигнал. RLHF — один из подходов, а не вся история post-training.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 z" fill="#bbabff"/></marker></defs><rect x="1" y="1" width="1358" height="898" rx="28" fill="#11141c" stroke="#343a48"/><text x="64" y="42" fill="#a6adbd" font-size="14" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="750"><tspan x="64" dy="0">UNKNOWN TALKS / INIT-RU</tspan></text><text x="64" y="77" fill="#bbabff" font-size="17" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1100"><tspan x="64" dy="0">03 · Что происходит внутри</tspan></text><text x="1230" y="77" fill="#bbabff" font-size="24" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="70"><tspan x="1230" dy="0">14</tspan></text><text x="64" y="137" fill="#f4f4f8" font-size="43" font-weight="700" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Продолжать текст и помогать — разные задачи.</tspan></text><text x="64" y="205" fill="#bbabff" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1100"><tspan x="64" dy="0">ПРОБЛЕМА</tspan></text><text x="64" y="238" fill="#f4f4f8" font-size="25" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Почему базовая модель может продолжить вопрос вместо полезного ответа?</tspan></text><rect x="65" y="331" width="550" height="220" rx="18" fill="#1c202a" stroke="#343a48"/><text x="89" y="376" fill="#a6adbd" font-size="26" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="502"><tspan x="89" dy="0">Базовая модель</tspan></text><text x="89" y="422" fill="#a6adbd" font-size="20" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="502"><tspan x="89" dy="0">учится продолжать последовательности</tspan></text><path d="M632,440 L705,440" fill="none" stroke="#bbabff" stroke-width="3" marker-end="url(#arrow)"/><rect x="730" y="331" width="550" height="220" rx="18" fill="#1c202a" stroke="#343a48"/><text x="754" y="376" fill="#bbabff" font-size="26" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="502"><tspan x="754" dy="0">Поведение помощника</tspan></text><text x="754" y="422" fill="#a6adbd" font-size="20" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="502"><tspan x="754" dy="0">учится выполнять запросы по дополнительным</tspan><tspan x="754" dy="27">сигналам</tspan></text><path d="M64,588 L1296,588" fill="none" stroke="#343a48" stroke-width="3" /><text x="64" y="618" fill="#bbabff" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="540"><tspan x="64" dy="0">ИДЕЯ</tspan></text><text x="64" y="652" fill="#f4f4f8" font-size="23" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="575"><tspan x="64" dy="0">Post-training добавляет примеры выполнения</tspan><tspan x="64" dy="29.900000000000002">инструкций и другие сигналы: предпочтения</tspan><tspan x="64" dy="29.900000000000002">или проверяемые результаты.</tspan></text><text x="710" y="618" fill="#bbabff" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="580"><tspan x="710" dy="0">ЧТО ПОЛУЧИЛОСЬ</tspan></text><text x="710" y="652" fill="#f4f4f8" font-size="23" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="580"><tspan x="710" dy="0">Меняется поведение помощника. Но</tspan><tspan x="710" dy="29.900000000000002">понравившийся человеку ответ и фактически</tspan><tspan x="710" dy="29.900000000000002">правильный ответ — разные критерии.</tspan></text><text x="64" y="795" fill="#a6adbd" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">ЧТО МЕШАЛО РАНЬШЕ / ЧТО БЫЛО ДО ЭТОГО</tspan></text><text x="64" y="829" fill="#a6adbd" font-size="21" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Нужна достаточно способная базовая модель и обучающий сигнал. RLHF — один из подходов, а не вся история</tspan><tspan x="64" dy="27.3">post-training.</tspan></text></svg>
