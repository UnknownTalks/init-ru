<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="900" viewBox="0 0 1360 900" role="img" aria-labelledby="title"><title id="title">Обучение — менять модель по ошибке. — объяснение</title><rect x="1" y="1" width="1358" height="898" rx="28" fill="#11141c" stroke="#343a48"/><text x="64" y="42" fill="#a6adbd" font-size="14" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="750"><tspan x="64" dy="0">UNKNOWN TALKS / INIT-RU</tspan></text><text x="64" y="77" fill="#bbabff" font-size="17" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1160"><tspan x="64" dy="0">03 · Обучение / Пример / основы / пояснение</tspan></text><text x="64" y="137" fill="#f4f4f8" font-size="40" font-weight="700" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Обучение — менять модель по ошибке.</tspan></text><text x="64" y="200" fill="#bbabff" font-size="17" font-weight="500" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Источник · GPT-3: 300 млрд токенов в процессе обучения. Токены — фрагменты текста, не гигабайты.</tspan></text><text x="64" y="272" fill="#bbabff" font-size="14" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">ЧТО ЭТО ЗНАЧИТ И КАК СВЯЗАНО С ПРИМЕРОМ</tspan></text><text x="64" y="326" fill="#f4f4f8" font-size="26" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Модель — программа с настраиваемыми числами, которые называют параметрами или</tspan><tspan x="64" dy="39">весами. До обучения её предсказания обычно плохи. В языковом обучении можно</tspan><tspan x="64" dy="39">показать начало текста и проверить продолжение по самому исходному тексту.</tspan><tspan x="64" dy="39">Математический алгоритм использует ошибку для изменения параметров. Повторяя</tspan><tspan x="64" dy="39">процесс на разных примерах, получаем полезные закономерности. Не нужно вручную</tspan><tspan x="64" dy="39">объяснять каждое правило языка или кодирования. На этом этапе меняются параметры.</tspan><tspan x="64" dy="39">Когда готовая модель отвечает пользователю, обычно меняется только её вход, а не</tspan><tspan x="64" dy="39">параметры.</tspan></text><path d="M64,756 L1296,756" fill="none" stroke="#343a48" stroke-width="3" /><text x="64" y="795" fill="#a6adbd" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">СЛЕДУЮЩИЙ ВОПРОС</tspan></text><text x="64" y="829" fill="#a6adbd" font-size="21" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Обучение завершили. Как теперь использовать готовую модель для своего запроса?</tspan></text></svg>
