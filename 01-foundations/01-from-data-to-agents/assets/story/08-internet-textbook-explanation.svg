<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="900" viewBox="0 0 1360 900" role="img" aria-labelledby="title"><title id="title">Корпус — отобранная коллекция данных. — объяснение</title><rect x="1" y="1" width="1358" height="898" rx="28" fill="#11141c" stroke="#343a48"/><text x="64" y="42" fill="#a6adbd" font-size="14" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="750"><tspan x="64" dy="0">UNKNOWN TALKS / INIT-RU</tspan></text><text x="64" y="77" fill="#6de4d2" font-size="17" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1160"><tspan x="64" dy="0">01 · Данные / Детали реализации / пояснение</tspan></text><text x="64" y="137" fill="#f4f4f8" font-size="40" font-weight="700" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Корпус — отобранная коллекция данных.</tspan></text><text x="64" y="200" fill="#6de4d2" font-size="17" font-weight="500" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Источник · The Pile · 825,18 GiB исходного текста · 22 компонента · публикация 2020 года.</tspan></text><text x="64" y="272" fill="#6de4d2" font-size="14" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">ЧТО ЭТО ЗНАЧИТ И КАК СВЯЗАНО С ПРИМЕРОМ</tspan></text><text x="64" y="326" fill="#f4f4f8" font-size="26" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Корпус — коллекция примеров, отобранных для обучения или исследования. The Pile даёт</tspan><tspan x="64" dy="39">проверяемый пример масштаба: 825,18 GiB и 22 разных компонента. Программный код и</tspan><tspan x="64" dy="39">вопросы с ответами там соседствуют, но выполняют разные роли. GiB означает 2^30 байт;</tspan><tspan x="64" dy="39">это объём представления текста, а не количество параметров модели. Авторы также</tspan><tspan x="64" dy="39">задают частоту использования компонентов. Поэтому размер коллекции, доля</tspan><tspan x="64" dy="39">компонента в обучении и количество фактически прочитанных примеров — разные</tspan><tspan x="64" dy="39">величины.</tspan></text><path d="M64,756 L1296,756" fill="none" stroke="#343a48" stroke-width="3" /><text x="64" y="795" fill="#a6adbd" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">СЛЕДУЮЩИЙ ВОПРОС</tspan></text><text x="64" y="829" fill="#a6adbd" font-size="21" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Большой корпус ещё нужно обработать и превратить в повторяемые учебные задачи.</tspan></text></svg>
