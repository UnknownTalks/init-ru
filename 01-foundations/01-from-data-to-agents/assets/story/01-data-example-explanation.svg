<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="900" viewBox="0 0 1360 900" role="img" aria-labelledby="title"><title id="title">Данные — сохранённые примеры. — объяснение</title><rect x="1" y="1" width="1358" height="898" rx="28" fill="#11141c" stroke="#343a48"/><text x="64" y="42" fill="#a6adbd" font-size="14" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="750"><tspan x="64" dy="0">UNKNOWN TALKS / INIT-RU</tspan></text><text x="64" y="77" fill="#6de4d2" font-size="17" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1160"><tspan x="64" dy="0">01 · Данные / Пример / основы / пояснение</tspan></text><text x="64" y="137" fill="#f4f4f8" font-size="40" font-weight="700" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Данные — сохранённые примеры.</tspan></text><text x="64" y="200" fill="#6de4d2" font-size="17" font-weight="500" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Источник · 26 января 2009 · реальный вопрос о повторах и порядке, Stack Overflow №480214.</tspan></text><text x="64" y="272" fill="#6de4d2" font-size="14" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">ЧТО ЭТО ЗНАЧИТ И КАК СВЯЗАНО С ПРИМЕРОМ</tspan></text><text x="64" y="326" fill="#f4f4f8" font-size="26" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Данные — это информация, которую удалось сохранить: текст, программа, таблица,</tspan><tspan x="64" dy="39">изображение или запись действия. В нашем примере человек описал не просто «убери</tspan><tspan x="64" dy="39">повторы», но и важное условие — сохрани порядок. Другой человек написал решение.</tspan><tspan x="64" dy="39">Обсуждение добавило объяснения и ограничения. Такие следы позволяют связать</tspan><tspan x="64" dy="39">человеческое намерение с программой. Пока мы только собрали примеры: никакой модели</tspan><tspan x="64" dy="39">ещё нет. Следующий шаг — решить, какие части этих страниц полезны и в каком виде</tspan><tspan x="64" dy="39">передавать их обучению.</tspan></text><path d="M64,756 L1296,756" fill="none" stroke="#343a48" stroke-width="3" /><text x="64" y="795" fill="#a6adbd" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">СЛЕДУЮЩИЙ ВОПРОС</tspan></text><text x="64" y="829" fill="#a6adbd" font-size="21" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Сначала у нас есть страницы и файлы. Как превратить их в подходящий материал для обучения?</tspan></text></svg>
