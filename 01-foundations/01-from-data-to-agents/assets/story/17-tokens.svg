<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="900" viewBox="0 0 1360 900" role="img" aria-labelledby="title desc"><title id="title">Для модели здесь не два слова.</title><desc id="desc">Как превратить язык, имена, пробелы и код в ограниченный набор единиц? Токенизатор кодирует текст ID из своего словаря. Подсловные и байтовые подходы позволяют работать с новыми строками. «Привет, мир!» здесь — 6 токенов. ID выбирает embedding; сам ID ещё не вектор и не единица смысла. После кодирования у нас последовательность ID. Как она проходит через модель?</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 z" fill="#a0e39b"/></marker></defs><rect x="1" y="1" width="1358" height="898" rx="28" fill="#11141c" stroke="#343a48"/><text x="64" y="42" fill="#a6adbd" font-size="14" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="750"><tspan x="64" dy="0">UNKNOWN TALKS / INIT-RU</tspan></text><text x="64" y="77" fill="#a0e39b" font-size="17" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1160"><tspan x="64" dy="0">04 · Модель  /  Детали реализации</tspan></text><text x="1230" y="77" fill="#a0e39b" font-size="22" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="70"><tspan x="1230" dy="0">L3</tspan></text><text x="64" y="137" fill="#f4f4f8" font-size="40" font-weight="700" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Для модели здесь не два слова.</tspan></text><text x="64" y="200" fill="#a0e39b" font-size="17" font-weight="500" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Проверенный пример · 12 кодовых точек Unicode в «Привет, мир!» → 6 токенов выбранного токенизатора.</tspan></text><text x="64" y="245" fill="#f4f4f8" font-size="24" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Как превратить язык, имена, пробелы и код в ограниченный набор единиц?</tspan></text><text x="65" y="333" fill="#f4f4f8" font-size="37" font-weight="600" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1100"><tspan x="65" dy="0">Привет, мир!</tspan></text><rect x="65" y="370" width="182" height="135" rx="18" fill="#1a1d27" stroke="#a0e39b"/><text x="89" y="421" fill="#a0e39b" font-size="33" font-weight="600" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="135"><tspan x="89" dy="0">Пр</tspan></text><text x="89" y="476" fill="#a6adbd" font-size="19" font-weight="400" font-family="'SFMono-Regular',Consolas,monospace" xml:space="preserve" data-max-width="145"><tspan x="89" dy="0">ID 53645</tspan></text><rect x="272" y="370" width="182" height="135" rx="18" fill="#1a1d27" stroke="#6de4d2"/><text x="296" y="421" fill="#6de4d2" font-size="33" font-weight="600" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="135"><tspan x="296" dy="0">ив</tspan></text><text x="296" y="476" fill="#a6adbd" font-size="19" font-weight="400" font-family="'SFMono-Regular',Consolas,monospace" xml:space="preserve" data-max-width="145"><tspan x="296" dy="0">ID 26991</tspan></text><rect x="479" y="370" width="182" height="135" rx="18" fill="#1a1d27" stroke="#a0e39b"/><text x="503" y="421" fill="#a0e39b" font-size="33" font-weight="600" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="135"><tspan x="503" dy="0">ет</tspan></text><text x="503" y="476" fill="#a6adbd" font-size="19" font-weight="400" font-family="'SFMono-Regular',Consolas,monospace" xml:space="preserve" data-max-width="145"><tspan x="503" dy="0">ID 8178</tspan></text><rect x="686" y="370" width="182" height="135" rx="18" fill="#1a1d27" stroke="#6de4d2"/><text x="710" y="421" fill="#6de4d2" font-size="33" font-weight="600" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="135"><tspan x="710" dy="0">,</tspan></text><text x="710" y="476" fill="#a6adbd" font-size="19" font-weight="400" font-family="'SFMono-Regular',Consolas,monospace" xml:space="preserve" data-max-width="145"><tspan x="710" dy="0">ID 11</tspan></text><rect x="893" y="370" width="182" height="135" rx="18" fill="#1a1d27" stroke="#a0e39b"/><text x="917" y="421" fill="#a0e39b" font-size="33" font-weight="600" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="135"><tspan x="917" dy="0">␠мир</tspan></text><text x="917" y="476" fill="#a6adbd" font-size="19" font-weight="400" font-family="'SFMono-Regular',Consolas,monospace" xml:space="preserve" data-max-width="145"><tspan x="917" dy="0">ID 137144</tspan></text><rect x="1100" y="370" width="182" height="135" rx="18" fill="#1a1d27" stroke="#6de4d2"/><text x="1124" y="421" fill="#6de4d2" font-size="33" font-weight="600" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="135"><tspan x="1124" dy="0">!</tspan></text><text x="1124" y="476" fill="#a6adbd" font-size="19" font-weight="400" font-family="'SFMono-Regular',Consolas,monospace" xml:space="preserve" data-max-width="145"><tspan x="1124" dy="0">ID 0</tspan></text><text x="65" y="558" fill="#a6adbd" font-size="23" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1230"><tspan x="65" dy="0">ID → обученный вектор → дальнейшие преобразования модели</tspan></text><path d="M64,588 L1296,588" fill="none" stroke="#343a48" stroke-width="3" /><text x="64" y="618" fill="#a0e39b" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="570"><tspan x="64" dy="0">КАК ЭТО РАБОТАЕТ</tspan></text><text x="64" y="652" fill="#f4f4f8" font-size="23" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="575"><tspan x="64" dy="0">Токенизатор кодирует текст ID из своего</tspan><tspan x="64" dy="29.900000000000002">словаря. Подсловные и байтовые подходы</tspan><tspan x="64" dy="29.900000000000002">позволяют работать с новыми строками.</tspan></text><text x="710" y="618" fill="#a0e39b" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="580"><tspan x="710" dy="0">РАЗБОР ПРИМЕРА / РЕЗУЛЬТАТ</tspan></text><text x="710" y="652" fill="#f4f4f8" font-size="23" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="580"><tspan x="710" dy="0">«Привет, мир!» здесь — 6 токенов. ID выбирает</tspan><tspan x="710" dy="29.900000000000002">embedding; сам ID ещё не вектор и не единица</tspan><tspan x="710" dy="29.900000000000002">смысла.</tspan></text><text x="64" y="795" fill="#a6adbd" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">СЛЕДУЮЩИЙ ВОПРОС</tspan></text><text x="64" y="829" fill="#a6adbd" font-size="21" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">После кодирования у нас последовательность ID. Как она проходит через модель?</tspan></text></svg>
