<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="900" viewBox="0 0 1360 900" role="img" aria-labelledby="title"><title id="title">Attention — взвешенная смесь представлений. — объяснение</title><rect x="1" y="1" width="1358" height="898" rx="28" fill="#11141c" stroke="#343a48"/><text x="64" y="42" fill="#a6adbd" font-size="14" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="750"><tspan x="64" dy="0">UNKNOWN TALKS / INIT-RU</tspan></text><text x="64" y="77" fill="#a0e39b" font-size="17" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1160"><tspan x="64" dy="0">04 · Модель / Разбор вычисления / пояснение</tspan></text><text x="64" y="137" fill="#f4f4f8" font-size="40" font-weight="700" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Attention — взвешенная смесь представлений.</tspan></text><text x="64" y="200" fill="#a0e39b" font-size="17" font-weight="500" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Расчёт · softmax([2, 0, 0]) ≈ [0,787; 0,107; 0,107]; округление, сумма ≈ 1.</tspan></text><text x="64" y="272" fill="#a0e39b" font-size="14" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">ЧТО ЭТО ЗНАЧИТ И КАК СВЯЗАНО С ПРИМЕРОМ</tspan></text><text x="64" y="326" fill="#f4f4f8" font-size="26" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Из представлений получают запросы Q, ключи K и содержимое V с помощью обученных</tspan><tspan x="64" dy="39">преобразований. Скалярные произведения Q и K дают оценки совместимости, которые</tspan><tspan x="64" dy="39">масштабируют. Softmax применяет экспоненту и нормирует результат. В нашем числовом</tspan><tspan x="64" dy="39">примере e² делится на e²+1+1, что даёт примерно 0,787. Остальные два веса — примерно</tspan><tspan x="64" dy="39">0,107. Выход — сумма векторов V с этими весами. Числа выбраны для расчёта, поэтому не</tspan><tspan x="64" dy="39">показывают, какие слова реально «важны» для какой-либо модели.</tspan></text><path d="M64,756 L1296,756" fill="none" stroke="#343a48" stroke-width="3" /><text x="64" y="795" fill="#a6adbd" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">СЛЕДУЮЩИЙ ВОПРОС</tspan></text><text x="64" y="829" fill="#a6adbd" font-size="21" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">На этом уровне видно вычисление. Несколько голов и повторяющиеся блоки строят более богатую обработку.</tspan></text></svg>
