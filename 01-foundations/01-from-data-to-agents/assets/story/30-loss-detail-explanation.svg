<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="900" viewBox="0 0 1360 900" role="img" aria-labelledby="title"><title id="title">Как ошибка превращается в обновление весов? — объяснение</title><rect x="1" y="1" width="1358" height="898" rx="28" fill="#11141c" stroke="#343a48"/><text x="64" y="42" fill="#a6adbd" font-size="14" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="750"><tspan x="64" dy="0">UNKNOWN TALKS / INIT-RU</tspan></text><text x="64" y="77" fill="#bbabff" font-size="17" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1160"><tspan x="64" dy="0">03 · Обучение / Детали реализации / пояснение</tspan></text><text x="64" y="137" fill="#f4f4f8" font-size="40" font-weight="700" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Как ошибка превращается в обновление весов?</tspan></text><text x="64" y="200" fill="#bbabff" font-size="17" font-weight="500" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Расчёт · −ln(0,1)≈2,303; −ln(0,8)≈0,223.</tspan></text><text x="64" y="272" fill="#bbabff" font-size="14" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">ЧТО ЭТО ЗНАЧИТ И КАК СВЯЗАНО С ПРИМЕРОМ</tspan></text><text x="64" y="326" fill="#f4f4f8" font-size="26" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Потеря — число, которое оптимизируют при обучении. В примере правильный токен</tspan><tspan x="64" dy="39">сначала получает вероятность 0,1. Его потеря равна примерно 2,303. Если вероятность</tspan><tspan x="64" dy="39">повысить до 0,8, потеря уменьшится примерно до 0,223. Обратное распространение</tspan><tspan x="64" dy="39">вычисляет производные по параметрам, а оптимизатор использует их для обновления.</tspan><tspan x="64" dy="39">Один шаг не гарантирует улучшения любой задачи: обучение оптимизирует выбранную</tspan><tspan x="64" dy="39">цель на множестве данных. Так мы связываем предсказание текста с математическим</tspan><tspan x="64" dy="39">изменением модели.</tspan></text><path d="M64,756 L1296,756" fill="none" stroke="#343a48" stroke-width="3" /><text x="64" y="795" fill="#a6adbd" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">СЛЕДУЮЩИЙ ВОПРОС</tspan></text><text x="64" y="829" fill="#a6adbd" font-size="21" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Тот же принцип повторяется по многим позициям и примерам. Размеры модели и данных определяют масштаб</tspan><tspan x="64" dy="27.3">вычислений.</tspan></text></svg>
