<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="900" viewBox="0 0 1360 900" role="img" aria-labelledby="title desc"><title id="title">Одной архитектуры оказалось мало.</title><desc id="desc">Почему похожие идеи раньше не давали сегодняшних возможностей? Соединить подходящую архитектуру, качественные данные, параметры, вычисления и устойчивое обучение. Масштабирование расширило возможности. Появились сильные модели, способные учитывать примеры задачи прямо во входе. Это совпадение нескольких условий, а не одна волшебная формула. Большая модель без подходящих данных тоже ограничена.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 z" fill="#f6ce77"/></marker></defs><rect x="1" y="1" width="1358" height="898" rx="28" fill="#11141c" stroke="#343a48"/><text x="64" y="42" fill="#a6adbd" font-size="14" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="750"><tspan x="64" dy="0">UNKNOWN TALKS / INIT-RU</tspan></text><text x="64" y="77" fill="#f6ce77" font-size="17" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1100"><tspan x="64" dy="0">02 · Как научить машину</tspan></text><text x="1230" y="77" fill="#f6ce77" font-size="24" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="70"><tspan x="1230" dy="0">09</tspan></text><text x="64" y="137" fill="#f4f4f8" font-size="43" font-weight="700" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Одной архитектуры оказалось мало.</tspan></text><text x="64" y="205" fill="#f6ce77" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1100"><tspan x="64" dy="0">ПРОБЛЕМА</tspan></text><text x="64" y="238" fill="#f4f4f8" font-size="25" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Почему похожие идеи раньше не давали сегодняшних возможностей?</tspan></text><rect x="65" y="340" width="370" height="200" rx="18" fill="#1a1d27" stroke="#f6ce77"/><text x="90" y="391" fill="#f6ce77" font-size="22" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="325"><tspan x="90" dy="0">ДАННЫЕ</tspan></text><text x="90" y="445" fill="#f4f4f8" font-size="26" font-weight="500" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="310"><tspan x="90" dy="0">что можно выучить</tspan></text><rect x="495" y="340" width="370" height="200" rx="18" fill="#1a1d27" stroke="#f6ce77"/><text x="520" y="391" fill="#f6ce77" font-size="22" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="325"><tspan x="520" dy="0">ПАРАМЕТРЫ</tspan></text><text x="520" y="445" fill="#f4f4f8" font-size="26" font-weight="500" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="310"><tspan x="520" dy="0">чем представить</tspan><tspan x="520" dy="35.1">связи</tspan></text><rect x="925" y="340" width="370" height="200" rx="18" fill="#1a1d27" stroke="#f6ce77"/><text x="950" y="391" fill="#f6ce77" font-size="22" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="325"><tspan x="950" dy="0">ВЫЧИСЛЕНИЯ</tspan></text><text x="950" y="445" fill="#f4f4f8" font-size="26" font-weight="500" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="310"><tspan x="950" dy="0">сколько можно</tspan><tspan x="950" dy="35.1">обучить</tspan></text><text x="65" y="575" fill="#a6adbd" font-size="23" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1230"><tspan x="65" dy="0">Нужна совместная работа компонентов, а не один рекордный размер.</tspan></text><path d="M64,588 L1296,588" fill="none" stroke="#343a48" stroke-width="3" /><text x="64" y="618" fill="#f6ce77" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="540"><tspan x="64" dy="0">ИДЕЯ</tspan></text><text x="64" y="652" fill="#f4f4f8" font-size="23" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="575"><tspan x="64" dy="0">Соединить подходящую архитектуру,</tspan><tspan x="64" dy="29.900000000000002">качественные данные, параметры, вычисления и</tspan><tspan x="64" dy="29.900000000000002">устойчивое обучение.</tspan></text><text x="710" y="618" fill="#f6ce77" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="580"><tspan x="710" dy="0">ЧТО ПОЛУЧИЛОСЬ</tspan></text><text x="710" y="652" fill="#f4f4f8" font-size="23" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="580"><tspan x="710" dy="0">Масштабирование расширило возможности.</tspan><tspan x="710" dy="29.900000000000002">Появились сильные модели, способные</tspan><tspan x="710" dy="29.900000000000002">учитывать примеры задачи прямо во входе.</tspan></text><text x="64" y="795" fill="#a6adbd" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">ЧТО МЕШАЛО РАНЬШЕ / ЧТО БЫЛО ДО ЭТОГО</tspan></text><text x="64" y="829" fill="#a6adbd" font-size="21" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Это совпадение нескольких условий, а не одна волшебная формула. Большая модель без подходящих данных</tspan><tspan x="64" dy="27.3">тоже ограничена.</tspan></text></svg>
