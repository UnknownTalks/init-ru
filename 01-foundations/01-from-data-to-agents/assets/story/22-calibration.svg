<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="900" viewBox="0 0 1360 900" role="img" aria-labelledby="title desc"><title id="title">Вероятность — обещание о серии случаев.</title><desc id="desc">Что должно означать «вероятность 80%», если модель умеет ошибаться? При хорошей калибровке среди многих сопоставимых прогнозов около 0,8 примерно 80% оказываются верными. Можно рассуждать о порогах и цене ошибки. Для одного решения 0,8 не гарантирует правильность; распределение и confidence различаются. Калибровку изучали задолго до LLM. Для новой задачи её нужно проверять на данных; точный формат оценки зависит от системы.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 z" fill="#ffa5c8"/></marker></defs><rect x="1" y="1" width="1358" height="898" rx="28" fill="#11141c" stroke="#343a48"/><text x="64" y="42" fill="#a6adbd" font-size="14" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="750"><tspan x="64" dy="0">UNKNOWN TALKS / INIT-RU</tspan></text><text x="64" y="77" fill="#ffa5c8" font-size="17" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1100"><tspan x="64" dy="0">06 · А если нужен только выбор?</tspan></text><text x="1230" y="77" fill="#ffa5c8" font-size="24" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="70"><tspan x="1230" dy="0">22</tspan></text><text x="64" y="137" fill="#f4f4f8" font-size="43" font-weight="700" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Вероятность — обещание о серии случаев.</tspan></text><text x="64" y="205" fill="#ffa5c8" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1100"><tspan x="64" dy="0">ПРОБЛЕМА</tspan></text><text x="64" y="238" fill="#f4f4f8" font-size="25" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Что должно означать «вероятность 80%», если модель умеет ошибаться?</tspan></text><text x="65" y="350" fill="#ffa5c8" font-size="95" font-weight="750" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="400"><tspan x="65" dy="0">80%</tspan></text><text x="65" y="416" fill="#a6adbd" font-size="26" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="465"><tspan x="65" dy="0">не означает «точно верно»</tspan></text><circle cx="670" cy="365" r="20" fill="#ffa5c8"/><circle cx="731" cy="365" r="20" fill="#ffa5c8"/><circle cx="792" cy="365" r="20" fill="#ffa5c8"/><circle cx="853" cy="365" r="20" fill="#ffa5c8"/><circle cx="914" cy="365" r="20" fill="#ffa5c8"/><circle cx="975" cy="365" r="20" fill="#ffa5c8"/><circle cx="1036" cy="365" r="20" fill="#ffa5c8"/><circle cx="1097" cy="365" r="20" fill="#ffa5c8"/><circle cx="1158" cy="365" r="20" fill="#ffa5c8"/><circle cx="1219" cy="365" r="20" fill="#ffa5c8"/><circle cx="670" cy="451" r="20" fill="#ffa5c8"/><circle cx="731" cy="451" r="20" fill="#ffa5c8"/><circle cx="792" cy="451" r="20" fill="#ffa5c8"/><circle cx="853" cy="451" r="20" fill="#ffa5c8"/><circle cx="914" cy="451" r="20" fill="#ffa5c8"/><circle cx="975" cy="451" r="20" fill="#ffa5c8"/><circle cx="1036" cy="451" r="20" fill="#343a48"/><circle cx="1097" cy="451" r="20" fill="#343a48"/><circle cx="1158" cy="451" r="20" fill="#343a48"/><circle cx="1219" cy="451" r="20" fill="#343a48"/><text x="660" y="529" fill="#f4f4f8" font-size="24" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="620"><tspan x="660" dy="0">Иллюстрация: 16 из 20 в большой серии</tspan></text><text x="65" y="565" fill="#a6adbd" font-size="23" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1230"><tspan x="65" dy="0">Оценка распределения ответов и confidence могут обозначать разные вещи.</tspan></text><path d="M64,588 L1296,588" fill="none" stroke="#343a48" stroke-width="3" /><text x="64" y="618" fill="#ffa5c8" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="540"><tspan x="64" dy="0">ИДЕЯ</tspan></text><text x="64" y="652" fill="#f4f4f8" font-size="23" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="575"><tspan x="64" dy="0">При хорошей калибровке среди многих</tspan><tspan x="64" dy="29.900000000000002">сопоставимых прогнозов около 0,8 примерно</tspan><tspan x="64" dy="29.900000000000002">80% оказываются верными.</tspan></text><text x="710" y="618" fill="#ffa5c8" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="580"><tspan x="710" dy="0">ЧТО ПОЛУЧИЛОСЬ</tspan></text><text x="710" y="652" fill="#f4f4f8" font-size="23" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="580"><tspan x="710" dy="0">Можно рассуждать о порогах и цене ошибки. Для</tspan><tspan x="710" dy="29.900000000000002">одного решения 0,8 не гарантирует</tspan><tspan x="710" dy="29.900000000000002">правильность; распределение и confidence</tspan><tspan x="710" dy="29.900000000000002">различаются.</tspan></text><text x="64" y="795" fill="#a6adbd" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">ЧТО МЕШАЛО РАНЬШЕ / ЧТО БЫЛО ДО ЭТОГО</tspan></text><text x="64" y="829" fill="#a6adbd" font-size="21" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Калибровку изучали задолго до LLM. Для новой задачи её нужно проверять на данных; точный формат оценки</tspan><tspan x="64" dy="27.3">зависит от системы.</tspan></text></svg>
