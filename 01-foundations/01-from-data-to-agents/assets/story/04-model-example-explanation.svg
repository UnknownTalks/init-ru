<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="900" viewBox="0 0 1360 900" role="img" aria-labelledby="title"><title id="title">Запрос использует готовую модель. — объяснение</title><rect x="1" y="1" width="1358" height="898" rx="28" fill="#11141c" stroke="#343a48"/><text x="64" y="42" fill="#a6adbd" font-size="14" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="750"><tspan x="64" dy="0">UNKNOWN TALKS / INIT-RU</tspan></text><text x="64" y="77" fill="#a0e39b" font-size="17" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1160"><tspan x="64" dy="0">04 · Модель / Пример / основы / пояснение</tspan></text><text x="64" y="137" fill="#f4f4f8" font-size="40" font-weight="700" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Запрос использует готовую модель.</tspan></text><text x="64" y="200" fill="#a0e39b" font-size="17" font-weight="500" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Пример · Учебный пример: запрос → возможный код. В этом шаге модель ещё ничего не исполняет.</tspan></text><text x="64" y="272" fill="#a0e39b" font-size="14" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">ЧТО ЭТО ЗНАЧИТ И КАК СВЯЗАНО С ПРИМЕРОМ</tspan></text><text x="64" y="326" fill="#f4f4f8" font-size="26" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">LLM — большая языковая модель, обученная обрабатывать и продолжать текст. В этом</tspan><tspan x="64" dy="39">примере вход содержит требования, а выход — программу. Во время ответа модель обычно</tspan><tspan x="64" dy="39">не переобучается: она применяет выученные параметры к текущему контексту. Ответ</tspan><tspan x="64" dy="39">собирается небольшими фрагментами, которые называют токенами. Для одного запроса</tspan><tspan x="64" dy="39">вероятны разные продолжения, поэтому одинаковое пожелание может дать разные</tspan><tspan x="64" dy="39">реализации. Здесь показан возможный пример, а не запись настоящего вызова модели.</tspan><tspan x="64" dy="39">Связный код ещё не доказывает правильность: это проверим следующим шагом.</tspan></text><path d="M64,756 L1296,756" fill="none" stroke="#343a48" stroke-width="3" /><text x="64" y="795" fill="#a6adbd" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">СЛЕДУЮЩИЙ ВОПРОС</tspan></text><text x="64" y="829" fill="#a6adbd" font-size="21" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Получили программу. Почему она может работать и как проверить, что она решает нашу задачу?</tspan></text></svg>
