<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="900" viewBox="0 0 1360 900" role="img" aria-labelledby="title desc"><title id="title">Поворот: измерять результат исполнения.</title><desc id="desc">Достаточно ли сравнить с эталонным текстом программы? Проверять функциональность. Разные программы могут решать одну задачу; несколько кандидатов дают пространство поиска. В работе Codex 2021: 28,8% pass@1 и 70,2% pass@100 на HumanEval. Это исторический опыт, не оценка нынешних агентов. Pass@100 — шанс найти рабочий вариант среди 100 попыток, а не надёжность одного ответа. Нужны ресурсы и способ проверки.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 z" fill="#a0e39b"/></marker></defs><rect x="1" y="1" width="1358" height="898" rx="28" fill="#11141c" stroke="#343a48"/><text x="64" y="42" fill="#a6adbd" font-size="14" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="750"><tspan x="64" dy="0">UNKNOWN TALKS / INIT-RU</tspan></text><text x="64" y="77" fill="#a0e39b" font-size="17" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1100"><tspan x="64" dy="0">04 · Почему получается код</tspan></text><text x="1230" y="77" fill="#a0e39b" font-size="24" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="70"><tspan x="1230" dy="0">17</tspan></text><text x="64" y="137" fill="#f4f4f8" font-size="43" font-weight="700" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Поворот: измерять результат исполнения.</tspan></text><text x="64" y="205" fill="#a0e39b" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1100"><tspan x="64" dy="0">ПРОБЛЕМА</tspan></text><text x="64" y="238" fill="#f4f4f8" font-size="25" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Достаточно ли сравнить с эталонным текстом программы?</tspan></text><text x="70" y="331" fill="#a6adbd" font-size="17" font-weight="600" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1200"><tspan x="70" dy="0">HUMANEVAL · ИСТОРИЧЕСКИЙ ЭКСПЕРИМЕНТ 2021</tspan></text><text x="65" y="455" fill="#a0e39b" font-size="94" font-weight="750" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="560"><tspan x="65" dy="0">28,8%</tspan></text><text x="745" y="455" fill="#f4f4f8" font-size="94" font-weight="750" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="560"><tspan x="745" dy="0">70,2%</tspan></text><text x="70" y="514" fill="#a6adbd" font-size="27" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="560"><tspan x="70" dy="0">pass@1 · одна попытка</tspan></text><text x="750" y="514" fill="#a6adbd" font-size="25" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="540"><tspan x="750" dy="0">pass@100 · среди 100 попыток</tspan></text><text x="65" y="568" fill="#a6adbd" font-size="23" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1230"><tspan x="65" dy="0">Это разные бюджеты поиска. Не «70% надёжности одного ответа».</tspan></text><path d="M64,588 L1296,588" fill="none" stroke="#343a48" stroke-width="3" /><text x="64" y="618" fill="#a0e39b" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="540"><tspan x="64" dy="0">ИДЕЯ</tspan></text><text x="64" y="652" fill="#f4f4f8" font-size="23" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="575"><tspan x="64" dy="0">Проверять функциональность. Разные</tspan><tspan x="64" dy="29.900000000000002">программы могут решать одну задачу;</tspan><tspan x="64" dy="29.900000000000002">несколько кандидатов дают пространство</tspan><tspan x="64" dy="29.900000000000002">поиска.</tspan></text><text x="710" y="618" fill="#a0e39b" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="580"><tspan x="710" dy="0">ЧТО ПОЛУЧИЛОСЬ</tspan></text><text x="710" y="652" fill="#f4f4f8" font-size="23" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="580"><tspan x="710" dy="0">В работе Codex 2021: 28,8% pass@1 и 70,2%</tspan><tspan x="710" dy="29.900000000000002">pass@100 на HumanEval. Это исторический опыт,</tspan><tspan x="710" dy="29.900000000000002">не оценка нынешних агентов.</tspan></text><text x="64" y="795" fill="#a6adbd" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">ЧТО МЕШАЛО РАНЬШЕ / ЧТО БЫЛО ДО ЭТОГО</tspan></text><text x="64" y="829" fill="#a6adbd" font-size="21" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Pass@100 — шанс найти рабочий вариант среди 100 попыток, а не надёжность одного ответа. Нужны ресурсы и</tspan><tspan x="64" dy="27.3">способ проверки.</tspan></text></svg>
