<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="900" viewBox="0 0 1360 900" role="img" aria-labelledby="title desc"><title id="title">А если правила спрятаны в примерах?</title><desc id="desc">Нужно ли вручную описывать каждое допустимое продолжение языка? Можно оценивать продолжения по наблюдавшимся сочетаниям. N-граммы используют короткую историю. Модель продолжает знакомые конструкции. Редкие комбинации и далёкие связи остаются трудными. Статистические языковые модели были задолго до современных LLM. Узким местом оставались обобщение и контекст.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 z" fill="#f6ce77"/></marker></defs><rect x="1" y="1" width="1358" height="898" rx="28" fill="#11141c" stroke="#343a48"/><text x="64" y="42" fill="#a6adbd" font-size="14" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="750"><tspan x="64" dy="0">UNKNOWN TALKS / INIT-RU</tspan></text><text x="64" y="77" fill="#f6ce77" font-size="17" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1100"><tspan x="64" dy="0">02 · Как научить машину</tspan></text><text x="1230" y="77" fill="#f6ce77" font-size="24" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="70"><tspan x="1230" dy="0">05</tspan></text><text x="64" y="137" fill="#f4f4f8" font-size="43" font-weight="700" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">А если правила спрятаны в примерах?</tspan></text><text x="64" y="205" fill="#f6ce77" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1100"><tspan x="64" dy="0">ПРОБЛЕМА</tspan></text><text x="64" y="238" fill="#f4f4f8" font-size="25" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Нужно ли вручную описывать каждое допустимое продолжение языка?</tspan></text><text x="64" y="331" fill="#a6adbd" font-size="21" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="900"><tspan x="64" dy="0">Окно короткой истории</tspan></text><rect x="64" y="365" width="280" height="143" rx="18" fill="#1c202a" stroke="#343a48"/><text x="88" y="410" fill="#687184" font-size="26" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="232"><tspan x="88" dy="0">… сохранить</tspan><tspan x="88" dy="35.1">порядок …</tspan></text><text x="88" y="456" fill="#a6adbd" font-size="20" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="232"><tspan x="88" dy="0">за пределами окна</tspan></text><rect x="377" y="365" width="280" height="143" rx="18" fill="#1c202a" stroke="#343a48"/><text x="401" y="410" fill="#f6ce77" font-size="26" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="232"><tspan x="401" dy="0">return</tspan></text><text x="401" y="456" fill="#a6adbd" font-size="20" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="232"><tspan x="401" dy="0">продолжение</tspan></text><rect x="690" y="365" width="280" height="143" rx="18" fill="#1c202a" stroke="#343a48"/><text x="714" y="410" fill="#f6ce77" font-size="26" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="232"><tspan x="714" dy="0">list</tspan></text><text x="714" y="456" fill="#a6adbd" font-size="20" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="232"><tspan x="714" dy="0">продолжение</tspan></text><rect x="1003" y="365" width="280" height="143" rx="18" fill="#1c202a" stroke="#343a48"/><text x="1027" y="410" fill="#f6ce77" font-size="26" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="232"><tspan x="1027" dy="0">(</tspan></text><text x="1027" y="456" fill="#a6adbd" font-size="20" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="232"><tspan x="1027" dy="0">продолжение</tspan></text><text x="64" y="555" fill="#a6adbd" font-size="24" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1230"><tspan x="64" dy="0">Знакомые соседства помогают. Далёкое условие может потеряться.</tspan></text><path d="M64,588 L1296,588" fill="none" stroke="#343a48" stroke-width="3" /><text x="64" y="618" fill="#f6ce77" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="540"><tspan x="64" dy="0">ИДЕЯ</tspan></text><text x="64" y="652" fill="#f4f4f8" font-size="23" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="575"><tspan x="64" dy="0">Можно оценивать продолжения по</tspan><tspan x="64" dy="29.900000000000002">наблюдавшимся сочетаниям. N-граммы</tspan><tspan x="64" dy="29.900000000000002">используют короткую историю.</tspan></text><text x="710" y="618" fill="#f6ce77" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="580"><tspan x="710" dy="0">ЧТО ПОЛУЧИЛОСЬ</tspan></text><text x="710" y="652" fill="#f4f4f8" font-size="23" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="580"><tspan x="710" dy="0">Модель продолжает знакомые конструкции.</tspan><tspan x="710" dy="29.900000000000002">Редкие комбинации и далёкие связи остаются</tspan><tspan x="710" dy="29.900000000000002">трудными.</tspan></text><text x="64" y="795" fill="#a6adbd" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">ЧТО МЕШАЛО РАНЬШЕ / ЧТО БЫЛО ДО ЭТОГО</tspan></text><text x="64" y="829" fill="#a6adbd" font-size="21" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Статистические языковые модели были задолго до современных LLM. Узким местом оставались обобщение и</tspan><tspan x="64" dy="27.3">контекст.</tspan></text></svg>
