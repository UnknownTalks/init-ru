<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="900" viewBox="0 0 1360 900" role="img" aria-labelledby="title desc"><title id="title">У кода есть преимущество: его можно запустить.</title><desc id="desc">Как отличить правдоподобный текст программы от работающего поведения? Зафиксировать ожидаемое поведение, выполнить программу и сравнить результаты. Проверки дают внешний сигнал. Для строк list(dict.fromkeys(xs)) сохраняет первые вхождения. Объекты другого типа могут потребовать другого решения. Тестирование существовало давно. LLM позволила включить генерацию кандидата и исправление по результату в общий цикл.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 z" fill="#a0e39b"/></marker></defs><rect x="1" y="1" width="1358" height="898" rx="28" fill="#11141c" stroke="#343a48"/><text x="64" y="42" fill="#a6adbd" font-size="14" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="750"><tspan x="64" dy="0">UNKNOWN TALKS / INIT-RU</tspan></text><text x="64" y="77" fill="#a0e39b" font-size="17" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1100"><tspan x="64" dy="0">04 · Почему получается код</tspan></text><text x="1230" y="77" fill="#a0e39b" font-size="24" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="70"><tspan x="1230" dy="0">16</tspan></text><text x="64" y="137" fill="#f4f4f8" font-size="43" font-weight="700" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">У кода есть преимущество: его можно запустить.</tspan></text><text x="64" y="205" fill="#a0e39b" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1100"><tspan x="64" dy="0">ПРОБЛЕМА</tspan></text><text x="64" y="238" fill="#f4f4f8" font-size="25" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Как отличить правдоподобный текст программы от работающего поведения?</tspan></text><rect x="65" y="302" width="1230" height="72" rx="18" fill="#1c202a" stroke="#343a48"/><text x="90" y="349" fill="#f4f4f8" font-size="27" font-weight="400" font-family="'SFMono-Regular',Consolas,monospace" xml:space="preserve" data-max-width="500"><tspan x="90" dy="0">[&quot;b&quot;, &quot;a&quot;, &quot;b&quot;]</tspan></text><path d="M650,337 L750,337" fill="none" stroke="#a0e39b" stroke-width="3" marker-end="url(#arrow)"/><text x="810" y="349" fill="#a0e39b" font-size="27" font-weight="400" font-family="'SFMono-Regular',Consolas,monospace" xml:space="preserve" data-max-width="440"><tspan x="810" dy="0">[&quot;b&quot;, &quot;a&quot;]</tspan></text><rect x="65" y="389" width="1230" height="72" rx="18" fill="#1c202a" stroke="#343a48"/><text x="90" y="436" fill="#f4f4f8" font-size="27" font-weight="400" font-family="'SFMono-Regular',Consolas,monospace" xml:space="preserve" data-max-width="500"><tspan x="90" dy="0">[]</tspan></text><path d="M650,424 L750,424" fill="none" stroke="#a0e39b" stroke-width="3" marker-end="url(#arrow)"/><text x="810" y="436" fill="#a0e39b" font-size="27" font-weight="400" font-family="'SFMono-Regular',Consolas,monospace" xml:space="preserve" data-max-width="440"><tspan x="810" dy="0">[]</tspan></text><rect x="65" y="476" width="1230" height="72" rx="18" fill="#1c202a" stroke="#343a48"/><text x="90" y="523" fill="#f4f4f8" font-size="27" font-weight="400" font-family="'SFMono-Regular',Consolas,monospace" xml:space="preserve" data-max-width="500"><tspan x="90" dy="0">[&quot;x&quot;, &quot;x&quot;]</tspan></text><path d="M650,511 L750,511" fill="none" stroke="#a0e39b" stroke-width="3" marker-end="url(#arrow)"/><text x="810" y="523" fill="#a0e39b" font-size="27" font-weight="400" font-family="'SFMono-Regular',Consolas,monospace" xml:space="preserve" data-max-width="440"><tspan x="810" dy="0">[&quot;x&quot;]</tspan></text><path d="M64,588 L1296,588" fill="none" stroke="#343a48" stroke-width="3" /><text x="64" y="618" fill="#a0e39b" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="540"><tspan x="64" dy="0">ИДЕЯ</tspan></text><text x="64" y="652" fill="#f4f4f8" font-size="23" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="575"><tspan x="64" dy="0">Зафиксировать ожидаемое поведение,</tspan><tspan x="64" dy="29.900000000000002">выполнить программу и сравнить результаты.</tspan><tspan x="64" dy="29.900000000000002">Проверки дают внешний сигнал.</tspan></text><text x="710" y="618" fill="#a0e39b" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="580"><tspan x="710" dy="0">ЧТО ПОЛУЧИЛОСЬ</tspan></text><text x="710" y="652" fill="#f4f4f8" font-size="23" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="580"><tspan x="710" dy="0">Для строк list(dict.fromkeys(xs)) сохраняет</tspan><tspan x="710" dy="29.900000000000002">первые вхождения. Объекты другого типа могут</tspan><tspan x="710" dy="29.900000000000002">потребовать другого решения.</tspan></text><text x="64" y="795" fill="#a6adbd" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">ЧТО МЕШАЛО РАНЬШЕ / ЧТО БЫЛО ДО ЭТОГО</tspan></text><text x="64" y="829" fill="#a6adbd" font-size="21" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Тестирование существовало давно. LLM позволила включить генерацию кандидата и исправление по</tspan><tspan x="64" dy="27.3">результату в общий цикл.</tspan></text></svg>
