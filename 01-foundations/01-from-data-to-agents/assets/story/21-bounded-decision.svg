<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="900" viewBox="0 0 1360 900" role="img" aria-labelledby="title desc"><title id="title">Генерировать строку — только один выход.</title><desc id="desc">Как использовать языковые представления для ограниченного выбора? Состояние и вопрос → представление → оценки допустимых ответов → распределение → решение для программы. Генератор выбирает следующий токен из словаря; решатель работает с заданным пространством ответов. Цели и интерфейсы различаются. Это общая концептуальная схема. Она не раскрывает закрытую архитектуру Jev и не означает, что две реализации одинаковы.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 z" fill="#ffa5c8"/></marker></defs><rect x="1" y="1" width="1358" height="898" rx="28" fill="#11141c" stroke="#343a48"/><text x="64" y="42" fill="#a6adbd" font-size="14" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="750"><tspan x="64" dy="0">UNKNOWN TALKS / INIT-RU</tspan></text><text x="64" y="77" fill="#ffa5c8" font-size="17" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1100"><tspan x="64" dy="0">06 · А если нужен только выбор?</tspan></text><text x="1230" y="77" fill="#ffa5c8" font-size="24" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="70"><tspan x="1230" dy="0">21</tspan></text><text x="64" y="137" fill="#f4f4f8" font-size="43" font-weight="700" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Генерировать строку — только один выход.</tspan></text><text x="64" y="205" fill="#ffa5c8" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1100"><tspan x="64" dy="0">ПРОБЛЕМА</tspan></text><text x="64" y="238" fill="#f4f4f8" font-size="25" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Как использовать языковые представления для ограниченного выбора?</tspan></text><rect x="64" y="350" width="279.5" height="150" rx="18" fill="#1c202a" stroke="#343a48"/><text x="88" y="395" fill="#ffa5c8" font-size="26" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="231.5"><tspan x="88" dy="0">Состояние</tspan></text><text x="88" y="441" fill="#a6adbd" font-size="20" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="231.5"><tspan x="88" dy="0">вход и вопрос</tspan></text><path d="M348.5,425 L374.5,425" fill="none" stroke="#ffa5c8" stroke-width="3" marker-end="url(#arrow)"/><rect x="381.5" y="350" width="279.5" height="150" rx="18" fill="#1c202a" stroke="#343a48"/><text x="405.5" y="395" fill="#ffa5c8" font-size="26" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="231.5"><tspan x="405.5" dy="0">Представление</tspan></text><text x="405.5" y="441" fill="#a6adbd" font-size="20" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="231.5"><tspan x="405.5" dy="0">полезные признаки</tspan></text><path d="M666,425 L692,425" fill="none" stroke="#ffa5c8" stroke-width="3" marker-end="url(#arrow)"/><rect x="699" y="350" width="279.5" height="150" rx="18" fill="#1c202a" stroke="#343a48"/><text x="723" y="395" fill="#ffa5c8" font-size="26" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="231.5"><tspan x="723" dy="0">Оценки</tspan></text><text x="723" y="441" fill="#a6adbd" font-size="20" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="231.5"><tspan x="723" dy="0">заданные варианты</tspan></text><path d="M983.5,425 L1009.5,425" fill="none" stroke="#ffa5c8" stroke-width="3" marker-end="url(#arrow)"/><rect x="1016.5" y="350" width="279.5" height="150" rx="18" fill="#1c202a" stroke="#343a48"/><text x="1040.5" y="395" fill="#ffa5c8" font-size="26" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="231.5"><tspan x="1040.5" dy="0">Выбор</tspan></text><text x="1040.5" y="441" fill="#a6adbd" font-size="20" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="231.5"><tspan x="1040.5" dy="0">результат для кода</tspan></text><text x="65" y="556" fill="#a6adbd" font-size="23" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1230"><tspan x="65" dy="0">Общая схема класса подходов, а не реконструкция закрытой архитектуры.</tspan></text><path d="M64,588 L1296,588" fill="none" stroke="#343a48" stroke-width="3" /><text x="64" y="618" fill="#ffa5c8" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="540"><tspan x="64" dy="0">ИДЕЯ</tspan></text><text x="64" y="652" fill="#f4f4f8" font-size="23" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="575"><tspan x="64" dy="0">Состояние и вопрос → представление → оценки</tspan><tspan x="64" dy="29.900000000000002">допустимых ответов → распределение →</tspan><tspan x="64" dy="29.900000000000002">решение для программы.</tspan></text><text x="710" y="618" fill="#ffa5c8" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="580"><tspan x="710" dy="0">ЧТО ПОЛУЧИЛОСЬ</tspan></text><text x="710" y="652" fill="#f4f4f8" font-size="23" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="580"><tspan x="710" dy="0">Генератор выбирает следующий токен из</tspan><tspan x="710" dy="29.900000000000002">словаря; решатель работает с заданным</tspan><tspan x="710" dy="29.900000000000002">пространством ответов. Цели и интерфейсы</tspan><tspan x="710" dy="29.900000000000002">различаются.</tspan></text><text x="64" y="795" fill="#a6adbd" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">ЧТО МЕШАЛО РАНЬШЕ / ЧТО БЫЛО ДО ЭТОГО</tspan></text><text x="64" y="829" fill="#a6adbd" font-size="21" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Это общая концептуальная схема. Она не раскрывает закрытую архитектуру Jev и не означает, что две</tspan><tspan x="64" dy="27.3">реализации одинаковы.</tspan></text></svg>
