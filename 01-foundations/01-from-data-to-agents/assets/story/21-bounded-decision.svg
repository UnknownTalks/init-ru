<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="900" viewBox="0 0 1360 900" role="img" aria-labelledby="title desc"><title id="title">Выход может быть выбором, а не текстом.</title><desc id="desc">Что делать, если нужен ответ только из заданных вариантов? Задаём варианты: «продолжить», «повторить», «спросить». Модель оценивает их по состоянию задачи; программа использует результат. Закрытый набор упрощает форму выхода. Ошибочный выбор всё ещё возможен, даже если его тип и формат допустимы. Отдельно разберём историю классификации, смысл вероятностей и современные реализации этой идеи.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 z" fill="#a0e39b"/></marker></defs><rect x="1" y="1" width="1358" height="898" rx="28" fill="#11141c" stroke="#343a48"/><text x="64" y="42" fill="#a6adbd" font-size="14" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="750"><tspan x="64" dy="0">UNKNOWN TALKS / INIT-RU</tspan></text><text x="64" y="77" fill="#a0e39b" font-size="17" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1160"><tspan x="64" dy="0">04 · Модель  /  Принцип</tspan></text><text x="1230" y="77" fill="#a0e39b" font-size="22" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="70"><tspan x="1230" dy="0">L2</tspan></text><text x="64" y="137" fill="#f4f4f8" font-size="40" font-weight="700" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Выход может быть выбором, а не текстом.</tspan></text><text x="64" y="200" fill="#a0e39b" font-size="17" font-weight="500" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Пример · Пример: 3 допустимых действия вместо произвольной строки ответа.</tspan></text><text x="64" y="245" fill="#f4f4f8" font-size="24" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Что делать, если нужен ответ только из заданных вариантов?</tspan></text><rect x="64" y="350" width="385.3333333333333" height="150" rx="18" fill="#1c202a" stroke="#343a48"/><text x="88" y="395" fill="#a0e39b" font-size="26" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="337.3333333333333"><tspan x="88" dy="0">Состояние задачи</tspan></text><text x="88" y="441" fill="#a6adbd" font-size="20" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="337.3333333333333"><tspan x="88" dy="0">что уже известно</tspan></text><path d="M454.3333333333333,425 L480.3333333333333,425" fill="none" stroke="#a0e39b" stroke-width="3" marker-end="url(#arrow)"/><rect x="487.3333333333333" y="350" width="385.3333333333333" height="150" rx="18" fill="#1c202a" stroke="#343a48"/><text x="511.3333333333333" y="395" fill="#a0e39b" font-size="26" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="337.3333333333333"><tspan x="511.3333333333333" dy="0">Оценить 3 варианта</tspan></text><text x="511.3333333333333" y="441" fill="#a6adbd" font-size="20" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="337.3333333333333"><tspan x="511.3333333333333" dy="0">продолжить / повторить /</tspan><tspan x="511.3333333333333" dy="27">спросить</tspan></text><path d="M877.6666666666666,425 L903.6666666666666,425" fill="none" stroke="#a0e39b" stroke-width="3" marker-end="url(#arrow)"/><rect x="910.6666666666666" y="350" width="385.3333333333333" height="150" rx="18" fill="#1c202a" stroke="#343a48"/><text x="934.6666666666666" y="395" fill="#a0e39b" font-size="26" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="337.3333333333333"><tspan x="934.6666666666666" dy="0">Выбрать действие</tspan></text><text x="934.6666666666666" y="441" fill="#a6adbd" font-size="20" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="337.3333333333333"><tspan x="934.6666666666666" dy="0">ветвление в программе</tspan></text><path d="M64,588 L1296,588" fill="none" stroke="#343a48" stroke-width="3" /><text x="64" y="618" fill="#a0e39b" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="570"><tspan x="64" dy="0">КАК ЭТО РАБОТАЕТ</tspan></text><text x="64" y="652" fill="#f4f4f8" font-size="23" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="575"><tspan x="64" dy="0">Задаём варианты: «продолжить», «повторить»,</tspan><tspan x="64" dy="29.900000000000002">«спросить». Модель оценивает их по состоянию</tspan><tspan x="64" dy="29.900000000000002">задачи; программа использует результат.</tspan></text><text x="710" y="618" fill="#a0e39b" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="580"><tspan x="710" dy="0">РАЗБОР ПРИМЕРА / РЕЗУЛЬТАТ</tspan></text><text x="710" y="652" fill="#f4f4f8" font-size="23" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="580"><tspan x="710" dy="0">Закрытый набор упрощает форму выхода.</tspan><tspan x="710" dy="29.900000000000002">Ошибочный выбор всё ещё возможен, даже если</tspan><tspan x="710" dy="29.900000000000002">его тип и формат допустимы.</tspan></text><text x="64" y="795" fill="#a6adbd" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">СЛЕДУЮЩИЙ ВОПРОС</tspan></text><text x="64" y="829" fill="#a6adbd" font-size="21" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Отдельно разберём историю классификации, смысл вероятностей и современные реализации этой идеи.</tspan></text></svg>
