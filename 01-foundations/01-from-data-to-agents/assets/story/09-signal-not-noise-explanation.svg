<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="900" viewBox="0 0 1360 900" role="img" aria-labelledby="title"><title id="title">Очистка меняет то, чему модель учится. — объяснение</title><rect x="1" y="1" width="1358" height="898" rx="28" fill="#11141c" stroke="#343a48"/><text x="64" y="42" fill="#a6adbd" font-size="14" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="750"><tspan x="64" dy="0">UNKNOWN TALKS / INIT-RU</tspan></text><text x="64" y="77" fill="#f6ce77" font-size="17" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1160"><tspan x="64" dy="0">02 · Подготовка / Принцип / пояснение</tspan></text><text x="64" y="137" fill="#f4f4f8" font-size="40" font-weight="700" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Очистка меняет то, чему модель учится.</tspan></text><text x="64" y="200" fill="#f6ce77" font-size="17" font-weight="500" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Источник · Одна фраза длиной 61 слово встречалась в C4 более 60 000 раз (Lee et al.).</tspan></text><text x="64" y="272" fill="#f6ce77" font-size="14" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">ЧТО ЭТО ЗНАЧИТ И КАК СВЯЗАНО С ПРИМЕРОМ</tspan></text><text x="64" y="326" fill="#f4f4f8" font-size="26" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Удаление повторов меняет частоты, которые видит модель. Если одна фраза повторена</tspan><tspan x="64" dy="39">60 тысяч раз, она получает гораздо больше веса, чем один уникальный документ. Это</tspan><tspan x="64" dy="39">реальный пример из исследования C4. Авторы получили модели, выдававшие запомненный</tspan><tspan x="64" dy="39">текст в десять раз реже после удаления повторов; результат относится к их опытам.</tspan><tspan x="64" dy="39">Другая задача — разделить обучение и оценку, чтобы не выдавать запоминание за</tspan><tspan x="64" dy="39">обобщение. Подготовка не гарантирует истину: ошибочный ответ тоже может остаться в</tspan><tspan x="64" dy="39">тексте.</tspan></text><path d="M64,756 L1296,756" fill="none" stroke="#343a48" stroke-width="3" /><text x="64" y="795" fill="#a6adbd" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">СЛЕДУЮЩИЙ ВОПРОС</tspan></text><text x="64" y="829" fill="#a6adbd" font-size="21" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">После подготовки остаётся главный вопрос: какой сигнал сообщает модели, что она ошиблась?</tspan></text></svg>
