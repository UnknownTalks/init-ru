<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="900" viewBox="0 0 1360 900" role="img" aria-labelledby="title desc"><title id="title">Transformer: обучение на параллельных вычислениях.</title><desc id="desc">Как связи между позициями перестали требовать только последовательного прохода? Self-attention связывает позиции; блоки преобразований работают с их представлениями. При обучении это удобнее распараллеливать. В работе 2017 года: 8 GPU P100; base обучали 12 часов, big — 3,5 дня. Это разные конфигурации одной работы. В обучении многие позиции считаются параллельно. При обычной генерации следующий токен зависит от уже выбранных.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 z" fill="#bbabff"/></marker></defs><rect x="1" y="1" width="1358" height="898" rx="28" fill="#11141c" stroke="#343a48"/><text x="64" y="42" fill="#a6adbd" font-size="14" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="750"><tspan x="64" dy="0">UNKNOWN TALKS / INIT-RU</tspan></text><text x="64" y="77" fill="#bbabff" font-size="17" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1160"><tspan x="64" dy="0">03 · Обучение  /  Детали реализации</tspan></text><text x="1230" y="77" fill="#bbabff" font-size="22" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="70"><tspan x="1230" dy="0">L3</tspan></text><text x="64" y="137" fill="#f4f4f8" font-size="40" font-weight="700" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Transformer: обучение на параллельных вычислениях.</tspan></text><text x="64" y="200" fill="#bbabff" font-size="17" font-weight="500" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Источник · 2017 · 8 NVIDIA P100 · base: 12 часов · big: 3,5 дня (Vaswani et al., §5.2).</tspan></text><text x="64" y="245" fill="#f4f4f8" font-size="24" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Как связи между позициями перестали требовать только последовательного прохода?</tspan></text><rect x="64" y="310" width="386" height="250" rx="18" fill="#1c202a" stroke="#343a48"/><text x="89" y="390" fill="#bbabff" font-size="62" font-weight="700" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="336"><tspan x="89" dy="0">8 × P100</tspan></text><text x="89" y="488" fill="#f4f4f8" font-size="22" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="336"><tspan x="89" dy="0">одна обучающая машина</tspan></text><rect x="488" y="310" width="386" height="250" rx="18" fill="#1c202a" stroke="#343a48"/><text x="513" y="390" fill="#bbabff" font-size="62" font-weight="700" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="336"><tspan x="513" dy="0">12 часов</tspan></text><text x="513" y="488" fill="#f4f4f8" font-size="22" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="336"><tspan x="513" dy="0">модель base</tspan></text><rect x="912" y="310" width="386" height="250" rx="18" fill="#1c202a" stroke="#343a48"/><text x="937" y="390" fill="#bbabff" font-size="62" font-weight="700" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="336"><tspan x="937" dy="0">3,5 дня</tspan></text><text x="937" y="488" fill="#f4f4f8" font-size="22" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="336"><tspan x="937" dy="0">модель big</tspan></text><path d="M64,588 L1296,588" fill="none" stroke="#343a48" stroke-width="3" /><text x="64" y="618" fill="#bbabff" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="570"><tspan x="64" dy="0">КАК ЭТО РАБОТАЕТ</tspan></text><text x="64" y="652" fill="#f4f4f8" font-size="23" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="575"><tspan x="64" dy="0">Self-attention связывает позиции; блоки</tspan><tspan x="64" dy="29.900000000000002">преобразований работают с их</tspan><tspan x="64" dy="29.900000000000002">представлениями. При обучении это удобнее</tspan><tspan x="64" dy="29.900000000000002">распараллеливать.</tspan></text><text x="710" y="618" fill="#bbabff" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="580"><tspan x="710" dy="0">РАЗБОР ПРИМЕРА / РЕЗУЛЬТАТ</tspan></text><text x="710" y="652" fill="#f4f4f8" font-size="23" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="580"><tspan x="710" dy="0">В работе 2017 года: 8 GPU P100; base обучали</tspan><tspan x="710" dy="29.900000000000002">12 часов, big — 3,5 дня. Это разные</tspan><tspan x="710" dy="29.900000000000002">конфигурации одной работы.</tspan></text><text x="64" y="795" fill="#a6adbd" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">СЛЕДУЮЩИЙ ВОПРОС</tspan></text><text x="64" y="829" fill="#a6adbd" font-size="21" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">В обучении многие позиции считаются параллельно. При обычной генерации следующий токен зависит от уже</tspan><tspan x="64" dy="27.3">выбранных.</tspan></text></svg>
