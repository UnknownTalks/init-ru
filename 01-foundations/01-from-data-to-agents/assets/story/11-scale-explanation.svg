<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="900" viewBox="0 0 1360 900" role="img" aria-labelledby="title"><title id="title">Масштаб: данные, параметры и обучение. — объяснение</title><rect x="1" y="1" width="1358" height="898" rx="28" fill="#11141c" stroke="#343a48"/><text x="64" y="42" fill="#a6adbd" font-size="14" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="750"><tspan x="64" dy="0">UNKNOWN TALKS / INIT-RU</tspan></text><text x="64" y="77" fill="#bbabff" font-size="17" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1160"><tspan x="64" dy="0">03 · Обучение / Детали реализации / пояснение</tspan></text><text x="64" y="137" fill="#f4f4f8" font-size="40" font-weight="700" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Масштаб: данные, параметры и обучение.</tspan></text><text x="64" y="200" fill="#bbabff" font-size="17" font-weight="500" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Источник · GPT-2 · 2019; GPT-3 · 2020. В работах описаны данные, размеры моделей и объём обучения.</tspan></text><text x="64" y="272" fill="#bbabff" font-size="14" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">ЧТО ЭТО ЗНАЧИТ И КАК СВЯЗАНО С ПРИМЕРОМ</tspan></text><text x="64" y="326" fill="#f4f4f8" font-size="26" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Важны три разных вопроса: сколько исходного материала собрано, насколько велика</tspan><tspan x="64" dy="39">модель и сколько примеров прошло через обучение. GPT-2 использовала очищенный</tspan><tspan x="64" dy="39">WebText объёмом 40 GB. В GPT-3 авторы описали смесь примерно из 499 млрд доступных</tspan><tspan x="64" dy="39">токенов, но обучение провели на 300 млрд токенов, выбирая компоненты с разными</tspan><tspan x="64" dy="39">частотами. Часть данных показывалась повторно, часть — не полностью. Параметры —</tspan><tspan x="64" dy="39">отдельные обученные числа. Поэтому гигабайты, токены и параметры нельзя ставить на</tspan><tspan x="64" dy="39">одну шкалу.</tspan></text><path d="M64,756 L1296,756" fill="none" stroke="#343a48" stroke-width="3" /><text x="64" y="795" fill="#a6adbd" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">СЛЕДУЮЩИЙ ВОПРОС</tspan></text><text x="64" y="829" fill="#a6adbd" font-size="21" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Масштаб объясняет часть прогресса. Какие архитектурные идеи позволили его использовать?</tspan></text></svg>
