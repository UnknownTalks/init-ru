<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="900" viewBox="0 0 1360 900" role="img" aria-labelledby="title desc"><title id="title">Вектор — обученное представление элемента.</title><desc id="desc">Как хранить признаки, общие для похожих контекстов? ID выбирает строку таблицы чисел. Эти числа обучаются вместе с моделью, поэтому закономерности могут переноситься между контекстами. В учебном словаре из 10 000 элементов по 64 числа на элемент таблица содержит 640 000 параметров. Представления — ещё не обработка контекста. Как модель связывает разные позиции?</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 z" fill="#bbabff"/></marker></defs><rect x="1" y="1" width="1358" height="898" rx="28" fill="#11141c" stroke="#343a48"/><text x="64" y="42" fill="#a6adbd" font-size="14" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="750"><tspan x="64" dy="0">UNKNOWN TALKS / INIT-RU</tspan></text><text x="64" y="77" fill="#bbabff" font-size="17" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1160"><tspan x="64" dy="0">03 · Обучение  /  Детали реализации</tspan></text><text x="1230" y="77" fill="#bbabff" font-size="22" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="70"><tspan x="1230" dy="0">L3</tspan></text><text x="64" y="137" fill="#f4f4f8" font-size="40" font-weight="700" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Вектор — обученное представление элемента.</tspan></text><text x="64" y="200" fill="#bbabff" font-size="17" font-weight="500" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Расчёт · 10 000 × 64 = 640 000 чисел в учебной embedding-таблице. Размеры выбраны для примера.</tspan></text><text x="64" y="245" fill="#f4f4f8" font-size="24" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Как хранить признаки, общие для похожих контекстов?</tspan></text><rect x="64" y="327" width="430" height="210" rx="18" fill="#1c202a" stroke="#343a48"/><text x="88" y="372" fill="#bbabff" font-size="26" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="382"><tspan x="88" dy="0">Слова → векторы</tspan></text><text x="88" y="418" fill="#a6adbd" font-size="20" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="382"><tspan x="88" dy="0">Похожие контексты дают общие</tspan><tspan x="88" dy="27">признаки.</tspan></text><path d="M510,430 L616,430" fill="none" stroke="#bbabff" stroke-width="3" marker-end="url(#arrow)"/><rect x="640" y="304" width="620" height="260" rx="18" fill="#1c202a" stroke="#343a48"/><text x="670" y="340" fill="#a6adbd" font-size="17" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="560"><tspan x="670" dy="0">Условная проекция представлений</tspan></text><circle cx="760" cy="420" r="7" fill="#bbabff"/><text x="777" y="427" fill="#f4f4f8" font-size="22" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="330"><tspan x="777" dy="0">список</tspan></text><circle cx="920" cy="390" r="7" fill="#bbabff"/><text x="937" y="397" fill="#f4f4f8" font-size="22" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="330"><tspan x="937" dy="0">массив</tspan></text><circle cx="810" cy="490" r="7" fill="#bbabff"/><text x="827" y="497" fill="#f4f4f8" font-size="22" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="330"><tspan x="827" dy="0">последовательность</tspan></text><path d="M64,588 L1296,588" fill="none" stroke="#343a48" stroke-width="3" /><text x="64" y="618" fill="#bbabff" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="570"><tspan x="64" dy="0">КАК ЭТО РАБОТАЕТ</tspan></text><text x="64" y="652" fill="#f4f4f8" font-size="23" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="575"><tspan x="64" dy="0">ID выбирает строку таблицы чисел. Эти числа</tspan><tspan x="64" dy="29.900000000000002">обучаются вместе с моделью, поэтому</tspan><tspan x="64" dy="29.900000000000002">закономерности могут переноситься между</tspan><tspan x="64" dy="29.900000000000002">контекстами.</tspan></text><text x="710" y="618" fill="#bbabff" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="580"><tspan x="710" dy="0">РАЗБОР ПРИМЕРА / РЕЗУЛЬТАТ</tspan></text><text x="710" y="652" fill="#f4f4f8" font-size="23" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="580"><tspan x="710" dy="0">В учебном словаре из 10 000 элементов по 64</tspan><tspan x="710" dy="29.900000000000002">числа на элемент таблица содержит 640 000</tspan><tspan x="710" dy="29.900000000000002">параметров.</tspan></text><text x="64" y="795" fill="#a6adbd" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">СЛЕДУЮЩИЙ ВОПРОС</tspan></text><text x="64" y="829" fill="#a6adbd" font-size="21" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Представления — ещё не обработка контекста. Как модель связывает разные позиции?</tspan></text></svg>
