<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="900" viewBox="0 0 1360 900" role="img" aria-labelledby="title desc"><title id="title">Корпус — отобранная коллекция данных.</title><desc id="desc">Какой реальный масштаб имели такие коллекции? The Pile объединяет 22 компонента: в том числе код GitHub, вопросы и ответы Stack Exchange, книги и статьи. В таблице корпуса: GitHub 95,16 GiB; Stack Exchange 32,20 GiB. Это компоненты конкретного набора, не состав всех LLM. Большой корпус ещё нужно обработать и превратить в повторяемые учебные задачи.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 z" fill="#6de4d2"/></marker></defs><rect x="1" y="1" width="1358" height="898" rx="28" fill="#11141c" stroke="#343a48"/><text x="64" y="42" fill="#a6adbd" font-size="14" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="750"><tspan x="64" dy="0">UNKNOWN TALKS / INIT-RU</tspan></text><text x="64" y="77" fill="#6de4d2" font-size="17" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1160"><tspan x="64" dy="0">01 · Данные  /  Детали реализации</tspan></text><text x="1230" y="77" fill="#6de4d2" font-size="22" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="70"><tspan x="1230" dy="0">L3</tspan></text><text x="64" y="137" fill="#f4f4f8" font-size="40" font-weight="700" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Корпус — отобранная коллекция данных.</tspan></text><text x="64" y="200" fill="#6de4d2" font-size="17" font-weight="500" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Источник · The Pile · 825,18 GiB исходного текста · 22 компонента · публикация 2020 года.</tspan></text><text x="64" y="245" fill="#f4f4f8" font-size="24" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Какой реальный масштаб имели такие коллекции?</tspan></text><rect x="64" y="310" width="386" height="250" rx="18" fill="#1c202a" stroke="#343a48"/><text x="89" y="390" fill="#6de4d2" font-size="43" font-weight="700" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="336"><tspan x="89" dy="0">825,18 GiB</tspan></text><text x="89" y="488" fill="#f4f4f8" font-size="22" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="336"><tspan x="89" dy="0">весь корпус</tspan></text><rect x="488" y="310" width="386" height="250" rx="18" fill="#1c202a" stroke="#343a48"/><text x="513" y="390" fill="#6de4d2" font-size="62" font-weight="700" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="336"><tspan x="513" dy="0">95,16 GiB</tspan></text><text x="513" y="488" fill="#f4f4f8" font-size="22" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="336"><tspan x="513" dy="0">компонент GitHub</tspan></text><rect x="912" y="310" width="386" height="250" rx="18" fill="#1c202a" stroke="#343a48"/><text x="937" y="390" fill="#6de4d2" font-size="62" font-weight="700" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="336"><tspan x="937" dy="0">32,20 GiB</tspan></text><text x="937" y="488" fill="#f4f4f8" font-size="22" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="336"><tspan x="937" dy="0">Stack Exchange</tspan></text><path d="M64,588 L1296,588" fill="none" stroke="#343a48" stroke-width="3" /><text x="64" y="618" fill="#6de4d2" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="570"><tspan x="64" dy="0">КАК ЭТО РАБОТАЕТ</tspan></text><text x="64" y="652" fill="#f4f4f8" font-size="23" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="575"><tspan x="64" dy="0">The Pile объединяет 22 компонента: в том числе</tspan><tspan x="64" dy="29.900000000000002">код GitHub, вопросы и ответы Stack Exchange,</tspan><tspan x="64" dy="29.900000000000002">книги и статьи.</tspan></text><text x="710" y="618" fill="#6de4d2" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="580"><tspan x="710" dy="0">РАЗБОР ПРИМЕРА / РЕЗУЛЬТАТ</tspan></text><text x="710" y="652" fill="#f4f4f8" font-size="23" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="580"><tspan x="710" dy="0">В таблице корпуса: GitHub 95,16 GiB; Stack</tspan><tspan x="710" dy="29.900000000000002">Exchange 32,20 GiB. Это компоненты</tspan><tspan x="710" dy="29.900000000000002">конкретного набора, не состав всех LLM.</tspan></text><text x="64" y="795" fill="#a6adbd" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">СЛЕДУЮЩИЙ ВОПРОС</tspan></text><text x="64" y="829" fill="#a6adbd" font-size="21" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Большой корпус ещё нужно обработать и превратить в повторяемые учебные задачи.</tspan></text></svg>
