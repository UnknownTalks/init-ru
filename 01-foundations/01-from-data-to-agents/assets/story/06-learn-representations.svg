<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="900" viewBox="0 0 1360 900" role="img" aria-labelledby="title desc"><title id="title">Похожие задачи могут делиться опытом.</title><desc id="desc">Как обработать сочетание слов, которого не было в обучении в точности? Обучать числовые представления вместе с моделью. Общие признаки помогают переносить закономерности. Можно обобщать на новые сочетания. Рекуррентные модели добавляют обработку последовательностей через состояние. Представления не появились внезапно в 2017-м. Длинные зависимости и последовательные вычисления оставались сложными.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 z" fill="#f6ce77"/></marker></defs><rect x="1" y="1" width="1358" height="898" rx="28" fill="#11141c" stroke="#343a48"/><text x="64" y="42" fill="#a6adbd" font-size="14" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="750"><tspan x="64" dy="0">UNKNOWN TALKS / INIT-RU</tspan></text><text x="64" y="77" fill="#f6ce77" font-size="17" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1100"><tspan x="64" dy="0">02 · Как научить машину</tspan></text><text x="1230" y="77" fill="#f6ce77" font-size="24" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="70"><tspan x="1230" dy="0">06</tspan></text><text x="64" y="137" fill="#f4f4f8" font-size="43" font-weight="700" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Похожие задачи могут делиться опытом.</tspan></text><text x="64" y="205" fill="#f6ce77" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1100"><tspan x="64" dy="0">ПРОБЛЕМА</tspan></text><text x="64" y="238" fill="#f4f4f8" font-size="25" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Как обработать сочетание слов, которого не было в обучении в точности?</tspan></text><rect x="64" y="327" width="430" height="210" rx="18" fill="#1c202a" stroke="#343a48"/><text x="88" y="372" fill="#f6ce77" font-size="26" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="382"><tspan x="88" dy="0">Слова → векторы</tspan></text><text x="88" y="418" fill="#a6adbd" font-size="20" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="382"><tspan x="88" dy="0">Похожие контексты дают общие</tspan><tspan x="88" dy="27">признаки.</tspan></text><path d="M510,430 L616,430" fill="none" stroke="#f6ce77" stroke-width="3" marker-end="url(#arrow)"/><rect x="640" y="304" width="620" height="260" rx="18" fill="#1c202a" stroke="#343a48"/><text x="670" y="340" fill="#a6adbd" font-size="17" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="560"><tspan x="670" dy="0">Условная проекция представлений</tspan></text><circle cx="760" cy="420" r="7" fill="#f6ce77"/><text x="777" y="427" fill="#f4f4f8" font-size="22" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="330"><tspan x="777" dy="0">список</tspan></text><circle cx="920" cy="390" r="7" fill="#f6ce77"/><text x="937" y="397" fill="#f4f4f8" font-size="22" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="330"><tspan x="937" dy="0">массив</tspan></text><circle cx="810" cy="490" r="7" fill="#f6ce77"/><text x="827" y="497" fill="#f4f4f8" font-size="22" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="330"><tspan x="827" dy="0">последовательность</tspan></text><path d="M64,588 L1296,588" fill="none" stroke="#343a48" stroke-width="3" /><text x="64" y="618" fill="#f6ce77" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="540"><tspan x="64" dy="0">ИДЕЯ</tspan></text><text x="64" y="652" fill="#f4f4f8" font-size="23" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="575"><tspan x="64" dy="0">Обучать числовые представления вместе с</tspan><tspan x="64" dy="29.900000000000002">моделью. Общие признаки помогают переносить</tspan><tspan x="64" dy="29.900000000000002">закономерности.</tspan></text><text x="710" y="618" fill="#f6ce77" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="580"><tspan x="710" dy="0">ЧТО ПОЛУЧИЛОСЬ</tspan></text><text x="710" y="652" fill="#f4f4f8" font-size="23" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="580"><tspan x="710" dy="0">Можно обобщать на новые сочетания.</tspan><tspan x="710" dy="29.900000000000002">Рекуррентные модели добавляют обработку</tspan><tspan x="710" dy="29.900000000000002">последовательностей через состояние.</tspan></text><text x="64" y="795" fill="#a6adbd" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">ЧТО МЕШАЛО РАНЬШЕ / ЧТО БЫЛО ДО ЭТОГО</tspan></text><text x="64" y="829" fill="#a6adbd" font-size="21" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Представления не появились внезапно в 2017-м. Длинные зависимости и последовательные вычисления</tspan><tspan x="64" dy="27.3">оставались сложными.</tspan></text></svg>
