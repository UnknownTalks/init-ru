<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="900" viewBox="0 0 1360 900" role="img" aria-labelledby="title"><title id="title">Подготовка — выбрать, что учить. — объяснение</title><rect x="1" y="1" width="1358" height="898" rx="28" fill="#11141c" stroke="#343a48"/><text x="64" y="42" fill="#a6adbd" font-size="14" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="750"><tspan x="64" dy="0">UNKNOWN TALKS / INIT-RU</tspan></text><text x="64" y="77" fill="#f6ce77" font-size="17" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1160"><tspan x="64" dy="0">02 · Подготовка / Пример / основы / пояснение</tspan></text><text x="64" y="137" fill="#f4f4f8" font-size="40" font-weight="700" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Подготовка — выбрать, что учить.</tspan></text><text x="64" y="200" fill="#f6ce77" font-size="17" font-weight="500" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Источник · В C4 обнаружили одну 61-словную фразу более 60 000 раз; это наблюдение авторов работы.</tspan></text><text x="64" y="272" fill="#f6ce77" font-size="14" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">ЧТО ЭТО ЗНАЧИТ И КАК СВЯЗАНО С ПРИМЕРОМ</tspan></text><text x="64" y="326" fill="#f4f4f8" font-size="26" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Исходная страница — смесь полезного содержания и оформления. Удаляя меню, нельзя</tspan><tspan x="64" dy="39">случайно удалить отступы из Python-кода. Кроме того, тысяча копий одного ответа не</tspan><tspan x="64" dy="39">даёт тысячу разных идей: она меняет частоту этого ответа. Поэтому подготовка — это</tspan><tspan x="64" dy="39">выбор содержания, структуры и повторов. Проверочные примеры откладывают отдельно.</tspan><tspan x="64" dy="39">Если правильный ответ уже был в обучении, высокий результат проверки может говорить</tspan><tspan x="64" dy="39">о запоминании. Мы подготовили материал; теперь нужна повторяемая учебная задача.</tspan></text><path d="M64,756 L1296,756" fill="none" stroke="#343a48" stroke-width="3" /><text x="64" y="795" fill="#a6adbd" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">СЛЕДУЮЩИЙ ВОПРОС</tspan></text><text x="64" y="829" fill="#a6adbd" font-size="21" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Материал подготовлен. Что именно должна делать модель, чтобы научиться на этих примерах?</tspan></text></svg>
