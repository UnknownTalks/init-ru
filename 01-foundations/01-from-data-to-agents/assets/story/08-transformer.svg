<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="900" viewBox="0 0 1360 900" role="img" aria-labelledby="title desc"><title id="title">2017. Изменили способ считать.</title><desc id="desc">Как учить связи в последовательности, не проходя её только рекуррентно? Transformer строит обработку вокруг attention и блоков преобразования представлений. Обучение удобнее распараллеливать. В авторегрессионной генерации зависимость следующего токена от предыдущих остаётся. Нужны были предыдущие идеи, GPU и инженерия обучения. Исходный Transformer был моделью перевода, не чат-ботом.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 z" fill="#f6ce77"/></marker></defs><rect x="1" y="1" width="1358" height="898" rx="28" fill="#11141c" stroke="#343a48"/><text x="64" y="42" fill="#a6adbd" font-size="14" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="750"><tspan x="64" dy="0">UNKNOWN TALKS / INIT-RU</tspan></text><text x="64" y="77" fill="#f6ce77" font-size="17" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1100"><tspan x="64" dy="0">02 · Как научить машину</tspan></text><text x="1230" y="77" fill="#f6ce77" font-size="24" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="70"><tspan x="1230" dy="0">08</tspan></text><text x="64" y="137" fill="#f4f4f8" font-size="43" font-weight="700" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">2017. Изменили способ считать.</tspan></text><text x="64" y="205" fill="#f6ce77" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1100"><tspan x="64" dy="0">ПРОБЛЕМА</tspan></text><text x="64" y="238" fill="#f4f4f8" font-size="25" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Как учить связи в последовательности, не проходя её только рекуррентно?</tspan></text><text x="65" y="332" fill="#a6adbd" font-size="22" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="530"><tspan x="65" dy="0">Рекуррентная обработка</tspan></text><rect x="65" y="378" width="86" height="84" rx="18" fill="#1c202a" stroke="#343a48"/><text x="89" y="430" fill="#a6adbd" font-size="26" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="66"><tspan x="89" dy="0">x1</tspan></text><path d="M157,420 L183,420" fill="none" stroke="#687184" stroke-width="3" marker-end="url(#arrow)"/><rect x="190" y="378" width="86" height="84" rx="18" fill="#1c202a" stroke="#343a48"/><text x="214" y="430" fill="#a6adbd" font-size="26" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="66"><tspan x="214" dy="0">x2</tspan></text><path d="M282,420 L308,420" fill="none" stroke="#687184" stroke-width="3" marker-end="url(#arrow)"/><rect x="315" y="378" width="86" height="84" rx="18" fill="#1c202a" stroke="#343a48"/><text x="339" y="430" fill="#a6adbd" font-size="26" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="66"><tspan x="339" dy="0">x3</tspan></text><path d="M407,420 L433,420" fill="none" stroke="#687184" stroke-width="3" marker-end="url(#arrow)"/><rect x="440" y="378" width="86" height="84" rx="18" fill="#1c202a" stroke="#343a48"/><text x="464" y="430" fill="#a6adbd" font-size="26" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="66"><tspan x="464" dy="0">x4</tspan></text><text x="770" y="332" fill="#f6ce77" font-size="22" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="520"><tspan x="770" dy="0">Параллельно при обучении</tspan></text><rect x="770" y="378" width="86" height="84" rx="18" fill="#1c202a" stroke="#343a48"/><text x="794" y="430" fill="#f6ce77" font-size="26" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="66"><tspan x="794" dy="0">x1</tspan></text><path d="M813,477 L813,532" fill="none" stroke="#f6ce77" stroke-width="3" marker-end="url(#arrow)"/><rect x="895" y="378" width="86" height="84" rx="18" fill="#1c202a" stroke="#343a48"/><text x="919" y="430" fill="#f6ce77" font-size="26" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="66"><tspan x="919" dy="0">x2</tspan></text><path d="M938,477 L938,532" fill="none" stroke="#f6ce77" stroke-width="3" marker-end="url(#arrow)"/><rect x="1020" y="378" width="86" height="84" rx="18" fill="#1c202a" stroke="#343a48"/><text x="1044" y="430" fill="#f6ce77" font-size="26" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="66"><tspan x="1044" dy="0">x3</tspan></text><path d="M1063,477 L1063,532" fill="none" stroke="#f6ce77" stroke-width="3" marker-end="url(#arrow)"/><rect x="1145" y="378" width="86" height="84" rx="18" fill="#1c202a" stroke="#343a48"/><text x="1169" y="430" fill="#f6ce77" font-size="26" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="66"><tspan x="1169" dy="0">x4</tspan></text><path d="M1188,477 L1188,532" fill="none" stroke="#f6ce77" stroke-width="3" marker-end="url(#arrow)"/><text x="65" y="556" fill="#a6adbd" font-size="23" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1230"><tspan x="65" dy="0">Генерация следующего токена всё ещё зависит от предыдущих.</tspan></text><path d="M64,588 L1296,588" fill="none" stroke="#343a48" stroke-width="3" /><text x="64" y="618" fill="#f6ce77" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="540"><tspan x="64" dy="0">ИДЕЯ</tspan></text><text x="64" y="652" fill="#f4f4f8" font-size="23" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="575"><tspan x="64" dy="0">Transformer строит обработку вокруг</tspan><tspan x="64" dy="29.900000000000002">attention и блоков преобразования</tspan><tspan x="64" dy="29.900000000000002">представлений.</tspan></text><text x="710" y="618" fill="#f6ce77" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="580"><tspan x="710" dy="0">ЧТО ПОЛУЧИЛОСЬ</tspan></text><text x="710" y="652" fill="#f4f4f8" font-size="23" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="580"><tspan x="710" dy="0">Обучение удобнее распараллеливать. В</tspan><tspan x="710" dy="29.900000000000002">авторегрессионной генерации зависимость</tspan><tspan x="710" dy="29.900000000000002">следующего токена от предыдущих остаётся.</tspan></text><text x="64" y="795" fill="#a6adbd" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">ЧТО МЕШАЛО РАНЬШЕ / ЧТО БЫЛО ДО ЭТОГО</tspan></text><text x="64" y="829" fill="#a6adbd" font-size="21" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Нужны были предыдущие идеи, GPU и инженерия обучения. Исходный Transformer был моделью перевода, не</tspan><tspan x="64" dy="27.3">чат-ботом.</tspan></text></svg>
