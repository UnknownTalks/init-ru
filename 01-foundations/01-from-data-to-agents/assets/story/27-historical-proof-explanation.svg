<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="900" viewBox="0 0 1360 900" role="img" aria-labelledby="title"><title id="title">Поворот: измерять результат исполнения. — объяснение</title><rect x="1" y="1" width="1358" height="898" rx="28" fill="#11141c" stroke="#343a48"/><text x="64" y="42" fill="#a6adbd" font-size="14" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="750"><tspan x="64" dy="0">UNKNOWN TALKS / INIT-RU</tspan></text><text x="64" y="77" fill="#ffb27c" font-size="17" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1160"><tspan x="64" dy="0">05 · Проверка / Детали реализации / пояснение</tspan></text><text x="64" y="137" fill="#f4f4f8" font-size="40" font-weight="700" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Поворот: измерять результат исполнения.</tspan></text><text x="64" y="200" fill="#ffb27c" font-size="17" font-weight="500" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Источник · HumanEval · 164 задачи · исторический Codex 2021: 28,8% pass@1; 70,2% pass@100.</tspan></text><text x="64" y="272" fill="#ffb27c" font-size="14" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">ЧТО ЭТО ЗНАЧИТ И КАК СВЯЗАНО С ПРИМЕРОМ</tspan></text><text x="64" y="326" fill="#f4f4f8" font-size="26" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">HumanEval содержит 164 задачи с описанием функции и проверками поведения. В работе</tspan><tspan x="64" dy="39">2021 года Codex получил 28,8% pass@1, а pass@100 составил 70,2%. Второе число</tspan><tspan x="64" dy="39">оценивает шанс иметь хотя бы одну проходящую программу среди ста сгенерированных</tspan><tspan x="64" dy="39">кандидатов. Это не гарантия, что система без внешней проверки выберет её, и не</tspan><tspan x="64" dy="39">надёжность одного ответа. Сравнивая генераторы, нужно фиксировать набор задач,</tspan><tspan x="64" dy="39">число попыток и способ проверки. Пример объясняет роль поиска и обратной связи, а не</tspan><tspan x="64" dy="39">состояние нынешних моделей.</tspan></text><path d="M64,756 L1296,756" fill="none" stroke="#343a48" stroke-width="3" /><text x="64" y="795" fill="#a6adbd" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">СЛЕДУЮЩИЙ ВОПРОС</tspan></text><text x="64" y="829" fill="#a6adbd" font-size="21" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Несколько попыток полезны, если есть обратная связь. Агентный цикл связывает такие шаги с действиями.</tspan></text></svg>
