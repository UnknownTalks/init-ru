<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="900" viewBox="0 0 1360 900" role="img" aria-labelledby="title desc"><title id="title">Первая мысль: запишем все правила.</title><desc id="desc">Как сделать умную систему, пока она не умеет учиться на огромных корпусах? Человек задаёт правила, представление знаний и способы поиска. В узкой области это может работать отлично. Новая формулировка или исключение требуют новых правил. Разнообразие мира трудно перечислить вручную. AI существовал до массового интернета. Уже в 1955 обсуждали язык, обучение и нейронные сети.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 z" fill="#f6ce77"/></marker></defs><rect x="1" y="1" width="1358" height="898" rx="28" fill="#11141c" stroke="#343a48"/><text x="64" y="42" fill="#a6adbd" font-size="14" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="750"><tspan x="64" dy="0">UNKNOWN TALKS / INIT-RU</tspan></text><text x="64" y="77" fill="#f6ce77" font-size="17" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1100"><tspan x="64" dy="0">02 · Как научить машину</tspan></text><text x="1230" y="77" fill="#f6ce77" font-size="24" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="70"><tspan x="1230" dy="0">04</tspan></text><text x="64" y="137" fill="#f4f4f8" font-size="43" font-weight="700" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Первая мысль: запишем все правила.</tspan></text><text x="64" y="205" fill="#f6ce77" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1100"><tspan x="64" dy="0">ПРОБЛЕМА</tspan></text><text x="64" y="238" fill="#f4f4f8" font-size="25" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Как сделать умную систему, пока она не умеет учиться на огромных корпусах?</tspan></text><rect x="64" y="312" width="610" height="155" rx="18" fill="#0b0e14" stroke="#343a48"/><text x="89" y="343" fill="#a6adbd" font-size="13" font-weight="600" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="560"><tspan x="89" dy="0">ПРАВИЛО, НАПИСАННОЕ ЧЕЛОВЕКОМ</tspan></text><text x="89" y="384" fill="#c3b5ff" font-size="24" font-weight="400" font-family="'SFMono-Regular',Consolas,monospace" xml:space="preserve" data-max-width="560"><tspan x="89" dy="0">if text == &quot;удали повторы&quot;:</tspan></text><text x="89" y="417.6" fill="#c3b5ff" font-size="24" font-weight="400" font-family="'SFMono-Regular',Consolas,monospace" xml:space="preserve" data-max-width="560"><tspan x="89" dy="0">    return known_answer</tspan></text><text x="760" y="349" fill="#a6adbd" font-size="24" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="530"><tspan x="760" dy="0">А теперь скажи иначе:</tspan></text><text x="760" y="405" fill="#f6ce77" font-size="29" font-weight="600" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="500"><tspan x="760" dy="0">«Оставь только первые</tspan><tspan x="760" dy="39.150000000000006">вхождения»</tspan></text><text x="760" y="514" fill="#f4f4f8" font-size="31" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="500"><tspan x="760" dy="0">Ещё одно правило?</tspan></text><path d="M64,588 L1296,588" fill="none" stroke="#343a48" stroke-width="3" /><text x="64" y="618" fill="#f6ce77" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="540"><tspan x="64" dy="0">ИДЕЯ</tspan></text><text x="64" y="652" fill="#f4f4f8" font-size="23" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="575"><tspan x="64" dy="0">Человек задаёт правила, представление</tspan><tspan x="64" dy="29.900000000000002">знаний и способы поиска. В узкой области это</tspan><tspan x="64" dy="29.900000000000002">может работать отлично.</tspan></text><text x="710" y="618" fill="#f6ce77" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="580"><tspan x="710" dy="0">ЧТО ПОЛУЧИЛОСЬ</tspan></text><text x="710" y="652" fill="#f4f4f8" font-size="23" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="580"><tspan x="710" dy="0">Новая формулировка или исключение требуют</tspan><tspan x="710" dy="29.900000000000002">новых правил. Разнообразие мира трудно</tspan><tspan x="710" dy="29.900000000000002">перечислить вручную.</tspan></text><text x="64" y="795" fill="#a6adbd" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">ЧТО МЕШАЛО РАНЬШЕ / ЧТО БЫЛО ДО ЭТОГО</tspan></text><text x="64" y="829" fill="#a6adbd" font-size="21" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">AI существовал до массового интернета. Уже в 1955 обсуждали язык, обучение и нейронные сети.</tspan></text></svg>
