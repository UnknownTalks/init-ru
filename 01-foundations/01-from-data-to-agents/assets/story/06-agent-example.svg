<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="900" viewBox="0 0 1360 900" role="img" aria-labelledby="title desc"><title id="title">Агент связывает ответы с действиями.</title><desc id="desc">«Исправь функцию в проекте и проверь, что повторы удаляются правильно». Модель предлагает шаг. Приложение выполняет доступный инструмент и возвращает результат модели. Цикл продолжается до остановки. Прочитать файл → изменить функцию → запустить тест → увидеть ошибку → исправить. Получается работа с обратной связью. Основной путь пройден. Вглубь: кто выполняет инструменты, как устроен контекст и как проверяется остановка?</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 z" fill="#ffa5c8"/></marker></defs><rect x="1" y="1" width="1358" height="898" rx="28" fill="#11141c" stroke="#343a48"/><text x="64" y="42" fill="#a6adbd" font-size="14" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="750"><tspan x="64" dy="0">UNKNOWN TALKS / INIT-RU</tspan></text><text x="64" y="77" fill="#ffa5c8" font-size="17" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1160"><tspan x="64" dy="0">06 · Агенты  /  Пример / основы</tspan></text><text x="1230" y="77" fill="#ffa5c8" font-size="22" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="70"><tspan x="1230" dy="0">L1</tspan></text><text x="64" y="137" fill="#f4f4f8" font-size="40" font-weight="700" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Агент связывает ответы с действиями.</tspan></text><text x="64" y="200" fill="#ffa5c8" font-size="17" font-weight="500" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Источник · 2022 · ReAct исследует чередование предложений действий и наблюдений среды.</tspan></text><text x="64" y="245" fill="#f4f4f8" font-size="24" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">«Исправь функцию в проекте и проверь, что повторы удаляются правильно».</tspan></text><rect x="64" y="350" width="385.3333333333333" height="150" rx="18" fill="#1c202a" stroke="#343a48"/><text x="88" y="395" fill="#ffa5c8" font-size="26" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="337.3333333333333"><tspan x="88" dy="0">Предложить</tspan></text><text x="88" y="441" fill="#a6adbd" font-size="20" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="337.3333333333333"><tspan x="88" dy="0">модель выбирает шаг</tspan></text><path d="M454.3333333333333,425 L480.3333333333333,425" fill="none" stroke="#ffa5c8" stroke-width="3" marker-end="url(#arrow)"/><rect x="487.3333333333333" y="350" width="385.3333333333333" height="150" rx="18" fill="#1c202a" stroke="#343a48"/><text x="511.3333333333333" y="395" fill="#ffa5c8" font-size="26" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="337.3333333333333"><tspan x="511.3333333333333" dy="0">Выполнить</tspan></text><text x="511.3333333333333" y="441" fill="#a6adbd" font-size="20" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="337.3333333333333"><tspan x="511.3333333333333" dy="0">приложение и инструмент</tspan></text><path d="M877.6666666666666,425 L903.6666666666666,425" fill="none" stroke="#ffa5c8" stroke-width="3" marker-end="url(#arrow)"/><rect x="910.6666666666666" y="350" width="385.3333333333333" height="150" rx="18" fill="#1c202a" stroke="#343a48"/><text x="934.6666666666666" y="395" fill="#ffa5c8" font-size="26" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="337.3333333333333"><tspan x="934.6666666666666" dy="0">Наблюдать</tspan></text><text x="934.6666666666666" y="441" fill="#a6adbd" font-size="20" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="337.3333333333333"><tspan x="934.6666666666666" dy="0">получить результат</tspan></text><path d="M1130,516 V560 H220 V516" fill="none" stroke="#ffa5c8" stroke-width="3" marker-end="url(#arrow)"/><text x="525" y="556" fill="#ffa5c8" font-size="20" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="600"><tspan x="525" dy="0">повторить или остановиться</tspan></text><path d="M64,588 L1296,588" fill="none" stroke="#343a48" stroke-width="3" /><text x="64" y="618" fill="#ffa5c8" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="570"><tspan x="64" dy="0">КАК ЭТО РАБОТАЕТ</tspan></text><text x="64" y="652" fill="#f4f4f8" font-size="23" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="575"><tspan x="64" dy="0">Модель предлагает шаг. Приложение выполняет</tspan><tspan x="64" dy="29.900000000000002">доступный инструмент и возвращает результат</tspan><tspan x="64" dy="29.900000000000002">модели. Цикл продолжается до остановки.</tspan></text><text x="710" y="618" fill="#ffa5c8" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="580"><tspan x="710" dy="0">РАЗБОР ПРИМЕРА / РЕЗУЛЬТАТ</tspan></text><text x="710" y="652" fill="#f4f4f8" font-size="23" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="580"><tspan x="710" dy="0">Прочитать файл → изменить функцию →</tspan><tspan x="710" dy="29.900000000000002">запустить тест → увидеть ошибку → исправить.</tspan><tspan x="710" dy="29.900000000000002">Получается работа с обратной связью.</tspan></text><text x="64" y="795" fill="#a6adbd" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">СЛЕДУЮЩИЙ ВОПРОС</tspan></text><text x="64" y="829" fill="#a6adbd" font-size="21" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Основной путь пройден. Вглубь: кто выполняет инструменты, как устроен контекст и как проверяется</tspan><tspan x="64" dy="27.3">остановка?</tspan></text></svg>
