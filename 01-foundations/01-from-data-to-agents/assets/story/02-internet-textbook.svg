<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="900" viewBox="0 0 1360 900" role="img" aria-labelledby="title desc"><title id="title">Мы написали учебник. Не договариваясь.</title><desc id="desc">Где взять достаточно примеров языка, знаний и кода? Вопросы связывают намерение с кодом. Документация объясняет API. Репозитории показывают программы целиком. Разные источники дают разные закономерности. Stack Overflow — часть этой истории, а не единственная причина. Интернет дал масштаб. Но конкретная модель учится на отобранном наборе, а не на всём интернете.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 z" fill="#6de4d2"/></marker></defs><rect x="1" y="1" width="1358" height="898" rx="28" fill="#11141c" stroke="#343a48"/><text x="64" y="42" fill="#a6adbd" font-size="14" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="750"><tspan x="64" dy="0">UNKNOWN TALKS / INIT-RU</tspan></text><text x="64" y="77" fill="#6de4d2" font-size="17" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1100"><tspan x="64" dy="0">01 · Мы оставили следы</tspan></text><text x="1230" y="77" fill="#6de4d2" font-size="24" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="70"><tspan x="1230" dy="0">02</tspan></text><text x="64" y="137" fill="#f4f4f8" font-size="43" font-weight="700" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Мы написали учебник. Не договариваясь.</tspan></text><text x="64" y="205" fill="#6de4d2" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1100"><tspan x="64" dy="0">ПРОБЛЕМА</tspan></text><text x="64" y="238" fill="#f4f4f8" font-size="25" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Где взять достаточно примеров языка, знаний и кода?</tspan></text><rect x="64" y="350" width="385.3333333333333" height="150" rx="18" fill="#1c202a" stroke="#343a48"/><text x="88" y="395" fill="#6de4d2" font-size="26" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="337.3333333333333"><tspan x="88" dy="0">Вопрос</tspan></text><text x="88" y="441" fill="#a6adbd" font-size="20" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="337.3333333333333"><tspan x="88" dy="0">«убрать повторы»</tspan></text><path d="M454.3333333333333,425 L480.3333333333333,425" fill="none" stroke="#6de4d2" stroke-width="3" marker-end="url(#arrow)"/><rect x="487.3333333333333" y="350" width="385.3333333333333" height="150" rx="18" fill="#1c202a" stroke="#343a48"/><text x="511.3333333333333" y="395" fill="#6de4d2" font-size="26" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="337.3333333333333"><tspan x="511.3333333333333" dy="0">Реализация</tspan></text><text x="511.3333333333333" y="441" fill="#a6adbd" font-size="20" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="337.3333333333333"><tspan x="511.3333333333333" dy="0">dict.fromkeys(xs)</tspan></text><path d="M877.6666666666666,425 L903.6666666666666,425" fill="none" stroke="#6de4d2" stroke-width="3" marker-end="url(#arrow)"/><rect x="910.6666666666666" y="350" width="385.3333333333333" height="150" rx="18" fill="#1c202a" stroke="#343a48"/><text x="934.6666666666666" y="395" fill="#6de4d2" font-size="26" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="337.3333333333333"><tspan x="934.6666666666666" dy="0">Объяснение</tspan></text><text x="934.6666666666666" y="441" fill="#a6adbd" font-size="20" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="337.3333333333333"><tspan x="934.6666666666666" dy="0">порядок первых вхождений</tspan></text><text x="65" y="558" fill="#a6adbd" font-size="24" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1230"><tspan x="65" dy="0">Связь «что хотели → что сделали → почему это работает».</tspan></text><path d="M64,588 L1296,588" fill="none" stroke="#343a48" stroke-width="3" /><text x="64" y="618" fill="#6de4d2" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="540"><tspan x="64" dy="0">ИДЕЯ</tspan></text><text x="64" y="652" fill="#f4f4f8" font-size="23" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="575"><tspan x="64" dy="0">Вопросы связывают намерение с кодом.</tspan><tspan x="64" dy="29.900000000000002">Документация объясняет API. Репозитории</tspan><tspan x="64" dy="29.900000000000002">показывают программы целиком.</tspan></text><text x="710" y="618" fill="#6de4d2" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="580"><tspan x="710" dy="0">ЧТО ПОЛУЧИЛОСЬ</tspan></text><text x="710" y="652" fill="#f4f4f8" font-size="23" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="580"><tspan x="710" dy="0">Разные источники дают разные</tspan><tspan x="710" dy="29.900000000000002">закономерности. Stack Overflow — часть этой</tspan><tspan x="710" dy="29.900000000000002">истории, а не единственная причина.</tspan></text><text x="64" y="795" fill="#a6adbd" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">ЧТО МЕШАЛО РАНЬШЕ / ЧТО БЫЛО ДО ЭТОГО</tspan></text><text x="64" y="829" fill="#a6adbd" font-size="21" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Интернет дал масштаб. Но конкретная модель учится на отобранном наборе, а не на всём интернете.</tspan></text></svg>
