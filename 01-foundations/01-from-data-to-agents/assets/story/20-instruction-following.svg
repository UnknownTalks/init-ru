<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="900" viewBox="0 0 1360 900" role="img" aria-labelledby="title desc"><title id="title">Способ обучения меняет поведение помощника.</title><desc id="desc">Почему базовая модель может продолжить вопрос вместо полезного ответа? Post-training добавляет примеры выполнения инструкций и другие сигналы: предпочтения или проверяемые результаты. Меняется поведение помощника. Но понравившийся человеку ответ и фактически правильный ответ — разные критерии. Итак, полезность ответа зависит не только от размера. Но правильный формат ещё нужно отделить от правильного содержания.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 z" fill="#a0e39b"/></marker></defs><rect x="1" y="1" width="1358" height="898" rx="28" fill="#11141c" stroke="#343a48"/><text x="64" y="42" fill="#a6adbd" font-size="14" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="750"><tspan x="64" dy="0">UNKNOWN TALKS / INIT-RU</tspan></text><text x="64" y="77" fill="#a0e39b" font-size="17" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1160"><tspan x="64" dy="0">04 · Модель  /  Детали реализации</tspan></text><text x="1230" y="77" fill="#a0e39b" font-size="22" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="70"><tspan x="1230" dy="0">L3</tspan></text><text x="64" y="137" fill="#f4f4f8" font-size="40" font-weight="700" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Способ обучения меняет поведение помощника.</tspan></text><text x="64" y="200" fill="#a0e39b" font-size="17" font-weight="500" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Источник · 2022 · ответы InstructGPT 1,3B предпочитали GPT-3 175B на запросах и оценке авторов.</tspan></text><text x="64" y="245" fill="#f4f4f8" font-size="24" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Почему базовая модель может продолжить вопрос вместо полезного ответа?</tspan></text><rect x="64" y="310" width="386" height="250" rx="18" fill="#1c202a" stroke="#343a48"/><text x="89" y="390" fill="#a0e39b" font-size="62" font-weight="700" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="336"><tspan x="89" dy="0">1,3 млрд</tspan></text><text x="89" y="488" fill="#f4f4f8" font-size="22" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="336"><tspan x="89" dy="0">параметров InstructGPT</tspan></text><rect x="488" y="310" width="386" height="250" rx="18" fill="#1c202a" stroke="#343a48"/><text x="513" y="390" fill="#a0e39b" font-size="62" font-weight="700" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="336"><tspan x="513" dy="0">175 млрд</tspan></text><text x="513" y="488" fill="#f4f4f8" font-size="22" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="336"><tspan x="513" dy="0">параметров GPT-3</tspan></text><rect x="912" y="310" width="386" height="250" rx="18" fill="#1c202a" stroke="#343a48"/><text x="937" y="390" fill="#a0e39b" font-size="28" font-weight="700" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="336"><tspan x="937" dy="0">Предпочтение людей</tspan></text><text x="937" y="488" fill="#f4f4f8" font-size="22" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="336"><tspan x="937" dy="0">метрика именно этого</tspan><tspan x="937" dy="29.700000000000003">сравнения</tspan></text><path d="M64,588 L1296,588" fill="none" stroke="#343a48" stroke-width="3" /><text x="64" y="618" fill="#a0e39b" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="570"><tspan x="64" dy="0">КАК ЭТО РАБОТАЕТ</tspan></text><text x="64" y="652" fill="#f4f4f8" font-size="23" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="575"><tspan x="64" dy="0">Post-training добавляет примеры выполнения</tspan><tspan x="64" dy="29.900000000000002">инструкций и другие сигналы: предпочтения</tspan><tspan x="64" dy="29.900000000000002">или проверяемые результаты.</tspan></text><text x="710" y="618" fill="#a0e39b" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="580"><tspan x="710" dy="0">РАЗБОР ПРИМЕРА / РЕЗУЛЬТАТ</tspan></text><text x="710" y="652" fill="#f4f4f8" font-size="23" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="580"><tspan x="710" dy="0">Меняется поведение помощника. Но</tspan><tspan x="710" dy="29.900000000000002">понравившийся человеку ответ и фактически</tspan><tspan x="710" dy="29.900000000000002">правильный ответ — разные критерии.</tspan></text><text x="64" y="795" fill="#a6adbd" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">СЛЕДУЮЩИЙ ВОПРОС</tspan></text><text x="64" y="829" fill="#a6adbd" font-size="21" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Итак, полезность ответа зависит не только от размера. Но правильный формат ещё нужно отделить от</tspan><tspan x="64" dy="27.3">правильного содержания.</tspan></text></svg>
