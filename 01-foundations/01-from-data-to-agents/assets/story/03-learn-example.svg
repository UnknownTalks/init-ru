<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="900" viewBox="0 0 1360 900" role="img" aria-labelledby="title desc"><title id="title">Обучение — менять модель по ошибке.</title><desc id="desc">Как текст становится способностью отвечать на новый запрос? Скрываем следующий фрагмент текста. Модель предлагает продолжение, сравниваем его с исходным и корректируем её числовые настройки. После множества таких шагов получаем обученную модель. Её параметры — выученные числа; они отличаются от исходных документов. Обучение завершили. Как теперь использовать готовую модель для своего запроса?</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 z" fill="#bbabff"/></marker></defs><rect x="1" y="1" width="1358" height="898" rx="28" fill="#11141c" stroke="#343a48"/><text x="64" y="42" fill="#a6adbd" font-size="14" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="750"><tspan x="64" dy="0">UNKNOWN TALKS / INIT-RU</tspan></text><text x="64" y="77" fill="#bbabff" font-size="17" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1160"><tspan x="64" dy="0">03 · Обучение  /  Пример / основы</tspan></text><text x="1230" y="77" fill="#bbabff" font-size="22" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="70"><tspan x="1230" dy="0">L1</tspan></text><text x="64" y="137" fill="#f4f4f8" font-size="40" font-weight="700" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Обучение — менять модель по ошибке.</tspan></text><text x="64" y="200" fill="#bbabff" font-size="17" font-weight="500" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Источник · GPT-3: 300 млрд токенов в процессе обучения. Токены — фрагменты текста, не гигабайты.</tspan></text><text x="64" y="245" fill="#f4f4f8" font-size="24" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Как текст становится способностью отвечать на новый запрос?</tspan></text><rect x="64" y="350" width="385.3333333333333" height="150" rx="18" fill="#1c202a" stroke="#343a48"/><text x="88" y="395" fill="#bbabff" font-size="26" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="337.3333333333333"><tspan x="88" dy="0">Показать начало</tspan></text><text x="88" y="441" fill="#a6adbd" font-size="20" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="337.3333333333333"><tspan x="88" dy="0">пример из данных</tspan></text><path d="M454.3333333333333,425 L480.3333333333333,425" fill="none" stroke="#bbabff" stroke-width="3" marker-end="url(#arrow)"/><rect x="487.3333333333333" y="350" width="385.3333333333333" height="150" rx="18" fill="#1c202a" stroke="#343a48"/><text x="511.3333333333333" y="395" fill="#bbabff" font-size="26" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="337.3333333333333"><tspan x="511.3333333333333" dy="0">Предложить</tspan><tspan x="511.3333333333333" dy="35.1">продолжение</tspan></text><text x="511.3333333333333" y="441" fill="#a6adbd" font-size="20" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="337.3333333333333"><tspan x="511.3333333333333" dy="0">ответ модели</tspan></text><path d="M877.6666666666666,425 L903.6666666666666,425" fill="none" stroke="#bbabff" stroke-width="3" marker-end="url(#arrow)"/><rect x="910.6666666666666" y="350" width="385.3333333333333" height="150" rx="18" fill="#1c202a" stroke="#343a48"/><text x="934.6666666666666" y="395" fill="#bbabff" font-size="26" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="337.3333333333333"><tspan x="934.6666666666666" dy="0">Сравнить</tspan></text><text x="934.6666666666666" y="441" fill="#a6adbd" font-size="20" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="337.3333333333333"><tspan x="934.6666666666666" dy="0">изменить параметры</tspan></text><path d="M64,588 L1296,588" fill="none" stroke="#343a48" stroke-width="3" /><text x="64" y="618" fill="#bbabff" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="570"><tspan x="64" dy="0">КАК ЭТО РАБОТАЕТ</tspan></text><text x="64" y="652" fill="#f4f4f8" font-size="23" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="575"><tspan x="64" dy="0">Скрываем следующий фрагмент текста. Модель</tspan><tspan x="64" dy="29.900000000000002">предлагает продолжение, сравниваем его с</tspan><tspan x="64" dy="29.900000000000002">исходным и корректируем её числовые</tspan><tspan x="64" dy="29.900000000000002">настройки.</tspan></text><text x="710" y="618" fill="#bbabff" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="580"><tspan x="710" dy="0">РАЗБОР ПРИМЕРА / РЕЗУЛЬТАТ</tspan></text><text x="710" y="652" fill="#f4f4f8" font-size="23" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="580"><tspan x="710" dy="0">После множества таких шагов получаем</tspan><tspan x="710" dy="29.900000000000002">обученную модель. Её параметры — выученные</tspan><tspan x="710" dy="29.900000000000002">числа; они отличаются от исходных документов.</tspan></text><text x="64" y="795" fill="#a6adbd" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">СЛЕДУЮЩИЙ ВОПРОС</tspan></text><text x="64" y="829" fill="#a6adbd" font-size="21" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Обучение завершили. Как теперь использовать готовую модель для своего запроса?</tspan></text></svg>
