<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="900" viewBox="0 0 1360 900" role="img" aria-labelledby="title desc"><title id="title">Масштаб: данные, параметры и обучение.</title><desc id="desc">Что означают числа в описаниях GPT-2 и GPT-3? GPT-2: 40 GB очищенного WebText, более 8 млн документов. Крупнейший вариант — около 1,5 млрд параметров. GPT-3: 175 млрд параметров и 300 млрд токенов в обучении. Это разные единицы; 300 млрд токенов не означают 300 GB. Масштаб объясняет часть прогресса. Какие архитектурные идеи позволили его использовать?</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 z" fill="#bbabff"/></marker></defs><rect x="1" y="1" width="1358" height="898" rx="28" fill="#11141c" stroke="#343a48"/><text x="64" y="42" fill="#a6adbd" font-size="14" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="750"><tspan x="64" dy="0">UNKNOWN TALKS / INIT-RU</tspan></text><text x="64" y="77" fill="#bbabff" font-size="17" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1160"><tspan x="64" dy="0">03 · Обучение  /  Детали реализации</tspan></text><text x="1230" y="77" fill="#bbabff" font-size="22" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="70"><tspan x="1230" dy="0">L3</tspan></text><text x="64" y="137" fill="#f4f4f8" font-size="40" font-weight="700" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Масштаб: данные, параметры и обучение.</tspan></text><text x="64" y="200" fill="#bbabff" font-size="17" font-weight="500" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Источник · GPT-2 · 2019; GPT-3 · 2020. В работах описаны данные, размеры моделей и объём обучения.</tspan></text><text x="64" y="245" fill="#f4f4f8" font-size="24" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Что означают числа в описаниях GPT-2 и GPT-3?</tspan></text><rect x="64" y="302" width="1232" height="260" rx="18" fill="#1c202a" stroke="#343a48"/><text x="82" y="335" fill="#bbabff" font-size="19" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="294"><tspan x="82" dy="0">Исследование</tspan></text><text x="412" y="335" fill="#bbabff" font-size="19" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="484"><tspan x="412" dy="0">Данные / обучение</tspan></text><text x="932" y="335" fill="#bbabff" font-size="19" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="346"><tspan x="932" dy="0">Параметры</tspan></text><path d="M80,359 L1280,359" fill="none" stroke="#343a48" stroke-width="3" /><text x="82" y="391" fill="#f4f4f8" font-size="20" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="294"><tspan x="82" dy="0">GPT-2 · 2019</tspan></text><text x="412" y="391" fill="#f4f4f8" font-size="20" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="484"><tspan x="412" dy="0">40 GB WebText; &gt;8 млн документов</tspan></text><text x="932" y="391" fill="#f4f4f8" font-size="20" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="346"><tspan x="932" dy="0">≈1,5 млрд</tspan></text><path d="M80,426 L1280,426" fill="none" stroke="#343a48" stroke-width="3" /><text x="82" y="458" fill="#f4f4f8" font-size="20" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="294"><tspan x="82" dy="0">GPT-3 · 2020</tspan></text><text x="412" y="458" fill="#f4f4f8" font-size="20" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="484"><tspan x="412" dy="0">300 млрд обучающих токенов</tspan></text><text x="932" y="458" fill="#f4f4f8" font-size="20" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="346"><tspan x="932" dy="0">175 млрд</tspan></text><path d="M64,588 L1296,588" fill="none" stroke="#343a48" stroke-width="3" /><text x="64" y="618" fill="#bbabff" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="570"><tspan x="64" dy="0">КАК ЭТО РАБОТАЕТ</tspan></text><text x="64" y="652" fill="#f4f4f8" font-size="23" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="575"><tspan x="64" dy="0">GPT-2: 40 GB очищенного WebText, более 8 млн</tspan><tspan x="64" dy="29.900000000000002">документов. Крупнейший вариант — около 1,5</tspan><tspan x="64" dy="29.900000000000002">млрд параметров.</tspan></text><text x="710" y="618" fill="#bbabff" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="580"><tspan x="710" dy="0">РАЗБОР ПРИМЕРА / РЕЗУЛЬТАТ</tspan></text><text x="710" y="652" fill="#f4f4f8" font-size="23" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="580"><tspan x="710" dy="0">GPT-3: 175 млрд параметров и 300 млрд токенов</tspan><tspan x="710" dy="29.900000000000002">в обучении. Это разные единицы; 300 млрд</tspan><tspan x="710" dy="29.900000000000002">токенов не означают 300 GB.</tspan></text><text x="64" y="795" fill="#a6adbd" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">СЛЕДУЮЩИЙ ВОПРОС</tspan></text><text x="64" y="829" fill="#a6adbd" font-size="21" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Масштаб объясняет часть прогресса. Какие архитектурные идеи позволили его использовать?</tspan></text></svg>
