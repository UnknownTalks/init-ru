<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="900" viewBox="0 0 1360 900" role="img" aria-labelledby="title desc"><title id="title">Правильность подтверждает исполнение.</title><desc id="desc">Функция выглядит убедительно. Что она реально делает? Запускаем её на примерах с известным результатом и сравниваем поведение с требованиями. Для [&quot;b&quot;, &quot;a&quot;, &quot;b&quot;] получаем [&quot;b&quot;, &quot;a&quot;]. Для [] — []. Проверены эти случаи; остальные требуют других проверок. Если проверка дала ошибку, её можно вернуть модели. Кто будет повторять этот процесс вместо человека?</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 z" fill="#ffb27c"/></marker></defs><rect x="1" y="1" width="1358" height="898" rx="28" fill="#11141c" stroke="#343a48"/><text x="64" y="42" fill="#a6adbd" font-size="14" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="750"><tspan x="64" dy="0">UNKNOWN TALKS / INIT-RU</tspan></text><text x="64" y="77" fill="#ffb27c" font-size="17" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1160"><tspan x="64" dy="0">05 · Проверка  /  Пример / основы</tspan></text><text x="1230" y="77" fill="#ffb27c" font-size="22" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="70"><tspan x="1230" dy="0">L1</tspan></text><text x="64" y="137" fill="#f4f4f8" font-size="40" font-weight="700" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Правильность подтверждает исполнение.</tspan></text><text x="64" y="200" fill="#ffb27c" font-size="17" font-weight="500" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Проверенный пример · 3 показанных входа и результата проверен