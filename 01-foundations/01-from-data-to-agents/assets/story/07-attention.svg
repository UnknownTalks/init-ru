<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="900" viewBox="0 0 1360 900" role="img" aria-labelledby="title desc"><title id="title">Не сжимать всё в одну подсказку.</title><desc id="desc">Как выбрать нужную часть длинной последовательности для следующего шага? Attention вычисляет веса связей между представлениями. Для разных позиций полезны разные части входа. При переводе модель может обращаться к нужным словам исходной фразы, а не только к одному итоговому вектору. Работа 2014 года выявляла узкое место encoder–decoder. Attention возник до Transformer.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 z" fill="#f6ce77"/></marker></defs><rect x="1" y="1" width="1358" height="898" rx="28" fill="#11141c" stroke="#343a48"/><text x="64" y="42" fill="#a6adbd" font-size="14" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="750"><tspan x="64" dy="0">UNKNOWN TALKS / INIT-RU</tspan></text><text x="64" y="77" fill="#f6ce77" font-size="17" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1100"><tspan x="64" dy="0">02 · Как научить машину</tspan></text><text x="1230" y="77" fill="#f6ce77" font-size="24" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="70"><tspan x="1230" dy="0">07</tspan></text><text x="64" y="137" fill="#f4f4f8" font-size="43" font-weight="700" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Не сжимать всё в одну подсказку.</tspan></text><text x="64" y="205" fill="#f6ce77" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1100"><tspan x="64" dy="0">ПРОБЛЕМА</tspan></text><text x="64" y="238" fill="#f4f4f8" font-size="25" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Как выбрать нужную часть длинной последовательности для следующего шага?</tspan></text><text x="65" y="333" fill="#a6adbd" font-size="25" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1200"><tspan x="65" dy="0">Перевести фразу — выбрать полезные связи</tspan></text><rect x="65" y="360" width="260" height="85" rx="18" fill="#1c202a" stroke="#343a48"/><text x="89" y="405" fill="#f4f4f8" font-size="26" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="212"><tspan x="89" dy="0">The</tspan></text><rect x="375" y="360" width="260" height="85" rx="18" fill="#1c202a" stroke="#343a48"/><text x="399" y="405" fill="#f4f4f8" font-size="26" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="212"><tspan x="399" dy="0">black</tspan></text><rect x="685" y="360" width="260" height="85" rx="18" fill="#1c202a" stroke="#343a48"/><text x="709" y="405" fill="#f6ce77" font-size="26" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="212"><tspan x="709" dy="0">cat</tspan></text><rect x="995" y="360" width="260" height="85" rx="18" fill="#1c202a" stroke="#343a48"/><text x="1019" y="405" fill="#f4f4f8" font-size="26" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="212"><tspan x="1019" dy="0">slept</tspan></text><text x="650" y="546" fill="#f6ce77" font-size="45" font-weight="700" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="270"><tspan x="650" dy="0">кот</tspan></text><path d="M195,456 L690,493" fill="none" stroke="#687184" stroke-width="3" marker-end="url(#arrow)"/><path d="M505,456 L690,493" fill="none" stroke="#687184" stroke-width="3" marker-end="url(#arrow)"/><path d="M815,456 L690,493" fill="none" stroke="#f6ce77" stroke-width="3" marker-end="url(#arrow)"/><path d="M1125,456 L690,493" fill="none" stroke="#687184" stroke-width="3" marker-end="url(#arrow)"/><path d="M64,588 L1296,588" fill="none" stroke="#343a48" stroke-width="3" /><text x="64" y="618" fill="#f6ce77" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="540"><tspan x="64" dy="0">ИДЕЯ</tspan></text><text x="64" y="652" fill="#f4f4f8" font-size="23" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="575"><tspan x="64" dy="0">Attention вычисляет веса связей между</tspan><tspan x="64" dy="29.900000000000002">представлениями. Для разных позиций полезны</tspan><tspan x="64" dy="29.900000000000002">разные части входа.</tspan></text><text x="710" y="618" fill="#f6ce77" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="580"><tspan x="710" dy="0">ЧТО ПОЛУЧИЛОСЬ</tspan></text><text x="710" y="652" fill="#f4f4f8" font-size="23" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="580"><tspan x="710" dy="0">При переводе модель может обращаться к</tspan><tspan x="710" dy="29.900000000000002">нужным словам исходной фразы, а не только к</tspan><tspan x="710" dy="29.900000000000002">одному итоговому вектору.</tspan></text><text x="64" y="795" fill="#a6adbd" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">ЧТО МЕШАЛО РАНЬШЕ / ЧТО БЫЛО ДО ЭТОГО</tspan></text><text x="64" y="829" fill="#a6adbd" font-size="21" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Работа 2014 года выявляла узкое место encoder–decoder. Attention возник до Transformer.</tspan></text></svg>
