<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="900" viewBox="0 0 1360 900" role="img" aria-labelledby="title desc"><title id="title">Из вопроса получается описание задачи.</title><desc id="desc">Что именно ценно в «простом» вопросе? «Удалить повторы» не равно «сохранить порядок». Данные содержат условие, код и обсуждение ограничений. list(set(xs)) убирает повторы, но не даёт обещания нужного порядка. В задаче важна семантика, а не только похожие слова. Где ещё сохранены подобные связи между задачей, кодом и объяснением?</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 z" fill="#6de4d2"/></marker></defs><rect x="1" y="1" width="1358" height="898" rx="28" fill="#11141c" stroke="#343a48"/><text x="64" y="42" fill="#a6adbd" font-size="14" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="750"><tspan x="64" dy="0">UNKNOWN TALKS / INIT-RU</tspan></text><text x="64" y="77" fill="#6de4d2" font-size="17" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1160"><tspan x="64" dy="0">01 · Данные  /  Принцип</tspan></text><text x="1230" y="77" fill="#6de4d2" font-size="22" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="70"><tspan x="1230" dy="0">L2</tspan></text><text x="64" y="137" fill="#f4f4f8" font-size="40" font-weight="700" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Из вопроса получается описание задачи.</tspan></text><text x="64" y="200" fill="#6de4d2" font-size="17" font-weight="500" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Источник · 26 января 2009 · исходный вопрос сохраняет требование порядка.</tspan></text><text x="64" y="245" fill="#f4f4f8" font-size="24" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Что именно ценно в «простом» вопросе?</tspan></text><text x="80" y="335" fill="#6de4d2" font-size="22" font-weight="700" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="220"><tspan x="80" dy="0">2009</tspan></text><text x="80" y="390" fill="#f4f4f8" font-size="47" font-weight="700" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="700"><tspan x="80" dy="0">Один вопрос.</tspan></text><text x="80" y="453" fill="#a6adbd" font-size="37" font-weight="500" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="720"><tspan x="80" dy="0">А в нём — спецификация.</tspan></text><rect x="820" y="317" width="450" height="115" rx="18" fill="#1c202a" stroke="#343a48"/><text x="844" y="362" fill="#6de4d2" font-size="26" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="402"><tspan x="844" dy="0">[&quot;b&quot;, &quot;a&quot;, &quot;b&quot;]</tspan></text><text x="844" y="408" fill="#a6adbd" font-size="20" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="402"><tspan x="844" dy="0">вход</tspan></text><path d="M1040,446 L1040,467" fill="none" stroke="#6de4d2" stroke-width="3" marker-end="url(#arrow)"/><rect x="820" y="478" width="450" height="95" rx="18" fill="#1c202a" stroke="#343a48"/><text x="844" y="523" fill="#6de4d2" font-size="26" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="402"><tspan x="844" dy="0">[&quot;b&quot;, &quot;a&quot;]</tspan></text><path d="M64,588 L1296,588" fill="none" stroke="#343a48" stroke-width="3" /><text x="64" y="618" fill="#6de4d2" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="570"><tspan x="64" dy="0">КАК ЭТО РАБОТАЕТ</tspan></text><text x="64" y="652" fill="#f4f4f8" font-size="23" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="575"><tspan x="64" dy="0">«Удалить повторы» не равно «сохранить</tspan><tspan x="64" dy="29.900000000000002">порядок». Данные содержат условие, код и</tspan><tspan x="64" dy="29.900000000000002">обсуждение ограничений.</tspan></text><text x="710" y="618" fill="#6de4d2" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="580"><tspan x="710" dy="0">РАЗБОР ПРИМЕРА / РЕЗУЛЬТАТ</tspan></text><text x="710" y="652" fill="#f4f4f8" font-size="23" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="580"><tspan x="710" dy="0">list(set(xs)) убирает повторы, но не даёт</tspan><tspan x="710" dy="29.900000000000002">обещания нужного порядка. В задаче важна</tspan><tspan x="710" dy="29.900000000000002">семантика, а не только похожие слова.</tspan></text><text x="64" y="795" fill="#a6adbd" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">СЛЕДУЮЩИЙ ВОПРОС</tspan></text><text x="64" y="829" fill="#a6adbd" font-size="21" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Где ещё сохранены подобные связи между задачей, кодом и объяснением?</tspan></text></svg>
