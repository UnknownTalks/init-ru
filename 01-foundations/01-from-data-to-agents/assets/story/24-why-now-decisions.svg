<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="900" viewBox="0 0 1360 900" role="img" aria-labelledby="title desc"><title id="title">Почему эта ветка стала заметна сейчас?</title><desc id="desc">Что нового, если классификация, вероятности и выбор уже существовали? Сильные представления и специализация выхода позволяют ставить больше задач через контекст и описание допустимых ответов. OpenAI Decisions API и Jev — примеры этой ветки. TypeSafe заявляет RLCD и параллельные ответы; детали обучения раскрыты частично. Вернёмся к общей схеме: выбранное действие всё равно должно исполнить и проверить приложение.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 z" fill="#a0e39b"/></marker></defs><rect x="1" y="1" width="1358" height="898" rx="28" fill="#11141c" stroke="#343a48"/><text x="64" y="42" fill="#a6adbd" font-size="14" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="750"><tspan x="64" dy="0">UNKNOWN TALKS / INIT-RU</tspan></text><text x="64" y="77" fill="#a0e39b" font-size="17" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1160"><tspan x="64" dy="0">04 · Модель  /  Детали реализации</tspan></text><text x="1230" y="77" fill="#a0e39b" font-size="22" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="70"><tspan x="1230" dy="0">L3</tspan></text><text x="64" y="137" fill="#f4f4f8" font-size="40" font-weight="700" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Почему эта ветка стала заметна сейчас?</tspan></text><text x="64" y="200" fill="#a0e39b" font-size="17" font-weight="500" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Источник · 15 сентября 2026 · объявление Jev; OpenAI документирует отдельный интерфейс Decisions API.</tspan></text><text x="64" y="245" fill="#f4f4f8" font-size="24" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Что нового, если классификация, вероятности и выбор уже существовали?</tspan></text><rect x="65" y="368" width="405" height="150" rx="18" fill="#1c202a" stroke="#343a48"/><text x="89" y="413" fill="#a0e39b" font-size="26" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="357"><tspan x="89" dy="0">Состояние</tspan></text><text x="89" y="459" fill="#a6adbd" font-size="20" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="357"><tspan x="89" dy="0">вопрос и контекст</tspan></text><path d="M490,442 L690,354" fill="none" stroke="#a0e39b" stroke-width="3" marker-end="url(#arrow)"/><path d="M490,442 L690,522" fill="none" stroke="#a0e39b" stroke-width="3" marker-end="url(#arrow)"/><rect x="710" y="300" width="570" height="120" rx="18" fill="#1c202a" stroke="#343a48"/><text x="734" y="345" fill="#f4f4f8" font-size="26" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="522"><tspan x="734" dy="0">Генерировать</tspan></text><text x="734" y="391" fill="#a6adbd" font-size="20" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="522"><tspan x="734" dy="0">последовательность текста или кода</tspan></text><rect x="710" y="466" width="570" height="120" rx="18" fill="#1c202a" stroke="#343a48"/><text x="734" y="511" fill="#a0e39b" font-size="26" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="522"><tspan x="734" dy="0">Выбирать</tspan></text><text x="734" y="557" fill="#a6adbd" font-size="20" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="522"><tspan x="734" dy="0">допустимый ответ с оценкой</tspan></text><path d="M64,588 L1296,588" fill="none" stroke="#343a48" stroke-width="3" /><text x="64" y="618" fill="#a0e39b" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="570"><tspan x="64" dy="0">КАК ЭТО РАБОТАЕТ</tspan></text><text x="64" y="652" fill="#f4f4f8" font-size="23" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="575"><tspan x="64" dy="0">Сильные представления и специализация</tspan><tspan x="64" dy="29.900000000000002">выхода позволяют ставить больше задач через</tspan><tspan x="64" dy="29.900000000000002">контекст и описание допустимых ответов.</tspan></text><text x="710" y="618" fill="#a0e39b" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="580"><tspan x="710" dy="0">РАЗБОР ПРИМЕРА / РЕЗУЛЬТАТ</tspan></text><text x="710" y="652" fill="#f4f4f8" font-size="23" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="580"><tspan x="710" dy="0">OpenAI Decisions API и Jev — примеры этой</tspan><tspan x="710" dy="29.900000000000002">ветки. TypeSafe заявляет RLCD и</tspan><tspan x="710" dy="29.900000000000002">параллельные ответы; детали обучения</tspan><tspan x="710" dy="29.900000000000002">раскрыты частично.</tspan></text><text x="64" y="795" fill="#a6adbd" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">СЛЕДУЮЩИЙ ВОПРОС</tspan></text><text x="64" y="829" fill="#a6adbd" font-size="21" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Вернёмся к общей схеме: выбранное действие всё равно должно исполнить и проверить приложение.</tspan></text></svg>
