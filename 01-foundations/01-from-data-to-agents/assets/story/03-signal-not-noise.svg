<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="900" viewBox="0 0 1360 900" role="img" aria-labelledby="title desc"><title id="title">Но повторить интернет — ещё не научиться.</title><desc id="desc">Как отделить полезные закономерности от повторов, шума и ошибочной оценки? Извлечь содержание, сохранить структуру, убрать дубликаты и отделить обучение от проверки. Получается обучающий сигнал. Утечка ответа в проверочную выборку даёт красивый балл вместо честной оценки. Данных было меньше; подготовка и измерение качества тоже требовали развития. Объём сам по себе не решает всё.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 z" fill="#6de4d2"/></marker></defs><rect x="1" y="1" width="1358" height="898" rx="28" fill="#11141c" stroke="#343a48"/><text x="64" y="42" fill="#a6adbd" font-size="14" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="750"><tspan x="64" dy="0">UNKNOWN TALKS / INIT-RU</tspan></text><text x="64" y="77" fill="#6de4d2" font-size="17" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1100"><tspan x="64" dy="0">01 · Мы оставили следы</tspan></text><text x="1230" y="77" fill="#6de4d2" font-size="24" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="70"><tspan x="1230" dy="0">03</tspan></text><text x="64" y="137" fill="#f4f4f8" font-size="43" font-weight="700" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Но повторить интернет — ещё не научиться.</tspan></text><text x="64" y="205" fill="#6de4d2" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1100"><tspan x="64" dy="0">ПРОБЛЕМА</tspan></text><text x="64" y="238" fill="#f4f4f8" font-size="25" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Как отделить полезные закономерности от повторов, шума и ошибочной оценки?</tspan></text><rect x="64" y="350" width="279.5" height="150" rx="18" fill="#1c202a" stroke="#343a48"/><text x="88" y="395" fill="#6de4d2" font-size="26" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="231.5"><tspan x="88" dy="0">Извлечь</tspan></text><text x="88" y="441" fill="#a6adbd" font-size="20" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="231.5"><tspan x="88" dy="0">текст и структуру</tspan></text><path d="M348.5,425 L374.5,425" fill="none" stroke="#6de4d2" stroke-width="3" marker-end="url(#arrow)"/><rect x="381.5" y="350" width="279.5" height="150" rx="18" fill="#1c202a" stroke="#343a48"/><text x="405.5" y="395" fill="#6de4d2" font-size="26" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="231.5"><tspan x="405.5" dy="0">Отобрать</tspan></text><text x="405.5" y="441" fill="#a6adbd" font-size="20" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="231.5"><tspan x="405.5" dy="0">повторы и шум</tspan></text><path d="M666,425 L692,425" fill="none" stroke="#6de4d2" stroke-width="3" marker-end="url(#arrow)"/><rect x="699" y="350" width="279.5" height="150" rx="18" fill="#1c202a" stroke="#343a48"/><text x="723" y="395" fill="#6de4d2" font-size="26" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="231.5"><tspan x="723" dy="0">Разделить</tspan></text><text x="723" y="441" fill="#a6adbd" font-size="20" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="231.5"><tspan x="723" dy="0">train / evaluation</tspan></text><path d="M983.5,425 L1009.5,425" fill="none" stroke="#6de4d2" stroke-width="3" marker-end="url(#arrow)"/><rect x="1016.5" y="350" width="279.5" height="150" rx="18" fill="#1c202a" stroke="#343a48"/><text x="1040.5" y="395" fill="#6de4d2" font-size="26" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="231.5"><tspan x="1040.5" dy="0">Обучить</tspan></text><text x="1040.5" y="441" fill="#a6adbd" font-size="20" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="231.5"><tspan x="1040.5" dy="0">проверить перенос</tspan></text><text x="65" y="556" fill="#a6adbd" font-size="24" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1230"><tspan x="65" dy="0">Вопрос из проверки не должен незаметно стать учебным ответом.</tspan></text><path d="M64,588 L1296,588" fill="none" stroke="#343a48" stroke-width="3" /><text x="64" y="618" fill="#6de4d2" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="540"><tspan x="64" dy="0">ИДЕЯ</tspan></text><text x="64" y="652" fill="#f4f4f8" font-size="23" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="575"><tspan x="64" dy="0">Извлечь содержание, сохранить структуру,</tspan><tspan x="64" dy="29.900000000000002">убрать дубликаты и отделить обучение от</tspan><tspan x="64" dy="29.900000000000002">проверки.</tspan></text><text x="710" y="618" fill="#6de4d2" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="580"><tspan x="710" dy="0">ЧТО ПОЛУЧИЛОСЬ</tspan></text><text x="710" y="652" fill="#f4f4f8" font-size="23" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="580"><tspan x="710" dy="0">Получается обучающий сигнал. Утечка ответа в</tspan><tspan x="710" dy="29.900000000000002">проверочную выборку даёт красивый балл</tspan><tspan x="710" dy="29.900000000000002">вместо честной оценки.</tspan></text><text x="64" y="795" fill="#a6adbd" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">ЧТО МЕШАЛО РАНЬШЕ / ЧТО БЫЛО ДО ЭТОГО</tspan></text><text x="64" y="829" fill="#a6adbd" font-size="21" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Данных было меньше; подготовка и измерение качества тоже требовали развития. Объём сам по себе не решает</tspan><tspan x="64" dy="27.3">всё.</tspan></text></svg>
