<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="900" viewBox="0 0 1360 900" role="img" aria-labelledby="title"><title id="title">Агент связывает ответы с действиями. — объяснение</title><rect x="1" y="1" width="1358" height="898" rx="28" fill="#11141c" stroke="#343a48"/><text x="64" y="42" fill="#a6adbd" font-size="14" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="750"><tspan x="64" dy="0">UNKNOWN TALKS / INIT-RU</tspan></text><text x="64" y="77" fill="#ffa5c8" font-size="17" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1160"><tspan x="64" dy="0">06 · Агенты / Пример / основы / пояснение</tspan></text><text x="64" y="137" fill="#f4f4f8" font-size="40" font-weight="700" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Агент связывает ответы с действиями.</tspan></text><text x="64" y="200" fill="#ffa5c8" font-size="17" font-weight="500" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Источник · 2022 · ReAct исследует чередование предложений действий и наблюдений среды.</tspan></text><text x="64" y="272" fill="#ffa5c8" font-size="14" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">ЧТО ЭТО ЗНАЧИТ И КАК СВЯЗАНО С ПРИМЕРОМ</tspan></text><text x="64" y="326" fill="#f4f4f8" font-size="26" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Агентная система соединяет модель, инструменты и управляющую программу. Модель</tspan><tspan x="64" dy="39">может предложить прочитать файл или запустить тест, но само действие выполняет</tspan><tspan x="64" dy="39">приложение. Результат действия добавляют в следующий запрос. Поэтому модель может</tspan><tspan x="64" dy="39">исправить решение после ошибки, не меняя свои обученные параметры. Тот же принцип</tspan><tspan x="64" dy="39">применим к поиску, документам и таблицам. Свобода действий зависит от устройства</tspan><tspan x="64" dy="39">программы: иногда порядок задан заранее, иногда следующий шаг выбирает модель. Сам</tspan><tspan x="64" dy="39">факт запуска инструментов не доказывает достижения цели — нужен проверяемый</tspan><tspan x="64" dy="39">результат.</tspan></text><path d="M64,756 L1296,756" fill="none" stroke="#343a48" stroke-width="3" /><text x="64" y="795" fill="#a6adbd" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">СЛЕДУЮЩИЙ ВОПРОС</tspan></text><text x="64" y="829" fill="#a6adbd" font-size="21" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Основной путь пройден. Вглубь: кто выполняет инструменты, как устроен контекст и как проверяется</tspan><tspan x="64" dy="27.3">остановка?</tspan></text></svg>
