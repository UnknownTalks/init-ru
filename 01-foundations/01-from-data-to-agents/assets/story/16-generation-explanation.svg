<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="900" viewBox="0 0 1360 900" role="img" aria-labelledby="title"><title id="title">Ответ строится последовательностью токенов. — объяснение</title><rect x="1" y="1" width="1358" height="898" rx="28" fill="#11141c" stroke="#343a48"/><text x="64" y="42" fill="#a6adbd" font-size="14" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="750"><tspan x="64" dy="0">UNKNOWN TALKS / INIT-RU</tspan></text><text x="64" y="77" fill="#a0e39b" font-size="17" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1160"><tspan x="64" dy="0">04 · Модель / Принцип / пояснение</tspan></text><text x="64" y="137" fill="#f4f4f8" font-size="40" font-weight="700" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Ответ строится последовательностью токенов.</tspan></text><text x="64" y="200" fill="#a0e39b" font-size="17" font-weight="500" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Проверенный пример · Показанная двухстрочная программа → 12 токенов Qwen2.5-0.5B без специальных токенов.</tspan></text><text x="64" y="272" fill="#a0e39b" font-size="14" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">ЧТО ЭТО ЗНАЧИТ И КАК СВЯЗАНО С ПРИМЕРОМ</tspan></text><text x="64" y="326" fill="#f4f4f8" font-size="26" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Контекст — вся последовательность, доступная модели в текущем обращении: запрос,</tspan><tspan x="64" dy="39">добавленные сведения и уже выбранные токены ответа. Модель вычисляет оценки</tspan><tspan x="64" dy="39">вариантов следующего токена. Процедура генерации выбирает один вариант, после чего</tspan><tspan x="64" dy="39">последовательность удлиняется. Веса модели при этом обычно фиксированы. Программа</tspan><tspan x="64" dy="39">на рисунке служит примером результата. Её разбиение на 12 токенов получено</tspan><tspan x="64" dy="39">настоящим токенизатором; для этого не нужны веса языковой модели. Чтобы узнать</tspan><tspan x="64" dy="39">вероятности продолжений, нужна уже сама модель.</tspan></text><path d="M64,756 L1296,756" fill="none" stroke="#343a48" stroke-width="3" /><text x="64" y="795" fill="#a6adbd" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">СЛЕДУЮЩИЙ ВОПРОС</tspan></text><text x="64" y="829" fill="#a6adbd" font-size="21" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Можно углубиться в токенизацию, устройство модели или обучение поведению помощника.</tspan></text></svg>
