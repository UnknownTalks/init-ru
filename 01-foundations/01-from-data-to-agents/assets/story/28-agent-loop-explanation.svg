<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="900" viewBox="0 0 1360 900" role="img" aria-labelledby="title"><title id="title">Инструмент выполняет приложение, не текст ответа. — объяснение</title><rect x="1" y="1" width="1358" height="898" rx="28" fill="#11141c" stroke="#343a48"/><text x="64" y="42" fill="#a6adbd" font-size="14" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="750"><tspan x="64" dy="0">UNKNOWN TALKS / INIT-RU</tspan></text><text x="64" y="77" fill="#ffa5c8" font-size="17" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1160"><tspan x="64" dy="0">06 · Агенты / Принцип / пояснение</tspan></text><text x="64" y="137" fill="#f4f4f8" font-size="40" font-weight="700" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Инструмент выполняет приложение, не текст ответа.</tspan></text><text x="64" y="200" fill="#ffa5c8" font-size="17" font-weight="500" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Механизм · Запрос инструмента → выполнение → результат: три разных события, которые важно различать.</tspan></text><text x="64" y="272" fill="#ffa5c8" font-size="14" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">ЧТО ЭТО ЗНАЧИТ И КАК СВЯЗАНО С ПРИМЕРОМ</tspan></text><text x="64" y="326" fill="#f4f4f8" font-size="26" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Внутри агентного цикла есть как минимум три отдельных события. Сначала модель</tspan><tspan x="64" dy="39">предлагает действие в формате приложения. Затем управляющий код вызывает</tspan><tspan x="64" dy="39">инструмент. Наконец, приложение возвращает наблюдение в контекст следующего</tspan><tspan x="64" dy="39">обращения к модели. Обычная строка run_tests() в чате сама ничего не запускает.</tspan><tspan x="64" dy="39">После реальной ошибки модель может изменить предложенный код, потому что её вход</tspan><tspan x="64" dy="39">теперь другой. Это использование обратной связи во время выполнения, а не новое</tspan><tspan x="64" dy="39">обучение параметров.</tspan></text><path d="M64,756 L1296,756" fill="none" stroke="#343a48" stroke-width="3" /><text x="64" y="795" fill="#a6adbd" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">СЛЕДУЮЩИЙ ВОПРОС</tspan></text><text x="64" y="829" fill="#a6adbd" font-size="21" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Та же структура возможна с поиском, документами и таблицами. Меняется инструмент и критерий успеха.</tspan></text></svg>
