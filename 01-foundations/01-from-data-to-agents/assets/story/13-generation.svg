<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="900" viewBox="0 0 1360 900" role="img" aria-labelledby="title desc"><title id="title">Код рождается продолжением контекста.</title><desc id="desc">Модель должна написать всю программу за один шаг? Она получает распределение, выбирает токен, добавляет его ко входу и продолжает. Поздний выбор зависит от ранних. Требования, имена и уже написанный код направляют следующие токены. Обычная генерация не обновляет веса модели. Обучение и генерация — разные процессы. Механизм следующего токена сам по себе не доказывает корректность программы.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 z" fill="#bbabff"/></marker></defs><rect x="1" y="1" width="1358" height="898" rx="28" fill="#11141c" stroke="#343a48"/><text x="64" y="42" fill="#a6adbd" font-size="14" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="750"><tspan x="64" dy="0">UNKNOWN TALKS / INIT-RU</tspan></text><text x="64" y="77" fill="#bbabff" font-size="17" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1100"><tspan x="64" dy="0">03 · Что происходит внутри</tspan></text><text x="1230" y="77" fill="#bbabff" font-size="24" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="70"><tspan x="1230" dy="0">13</tspan></text><text x="64" y="137" fill="#f4f4f8" font-size="43" font-weight="700" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Код рождается продолжением контекста.</tspan></text><text x="64" y="205" fill="#bbabff" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1100"><tspan x="64" dy="0">ПРОБЛЕМА</tspan></text><text x="64" y="238" fill="#f4f4f8" font-size="25" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Модель должна написать всю программу за один шаг?</tspan></text><rect x="64" y="307" width="760" height="155" rx="18" fill="#0b0e14" stroke="#343a48"/><text x="89" y="338" fill="#a6adbd" font-size="13" font-weight="600" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="710"><tspan x="89" dy="0">ПРИМЕР ПОСЛЕДОВАТЕЛЬНОСТИ</tspan></text><text x="89" y="379" fill="#c3b5ff" font-size="26" font-weight="400" font-family="'SFMono-Regular',Consolas,monospace" xml:space="preserve" data-max-width="710"><tspan x="89" dy="0">def unique(xs):</tspan></text><text x="89" y="415.4" fill="#c3b5ff" font-size="26" font-weight="400" font-family="'SFMono-Regular',Consolas,monospace" xml:space="preserve" data-max-width="710"><tspan x="89" dy="0">    return list(dict.fromkeys(xs))</tspan></text><text x="900" y="341" fill="#bbabff" font-size="29" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="350"><tspan x="900" dy="0">Контекст</tspan></text><path d="M955,362 L955,383" fill="none" stroke="#bbabff" stroke-width="3" marker-end="url(#arrow)"/><text x="900" y="425" fill="#f4f4f8" font-size="29" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="350"><tspan x="900" dy="0">Выбрать токен</tspan></text><path d="M955,448 L955,468" fill="none" stroke="#bbabff" stroke-width="3" marker-end="url(#arrow)"/><text x="900" y="510" fill="#bbabff" font-size="26" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="370"><tspan x="900" dy="0">Добавить и повторить</tspan></text><text x="65" y="552" fill="#a6adbd" font-size="21" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1230"><tspan x="65" dy="0">Точная программа здесь иллюстрирует механизм; это не запись ответа модели.</tspan></text><path d="M64,588 L1296,588" fill="none" stroke="#343a48" stroke-width="3" /><text x="64" y="618" fill="#bbabff" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="540"><tspan x="64" dy="0">ИДЕЯ</tspan></text><text x="64" y="652" fill="#f4f4f8" font-size="23" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="575"><tspan x="64" dy="0">Она получает распределение, выбирает токен,</tspan><tspan x="64" dy="29.900000000000002">добавляет его ко входу и продолжает. Поздний</tspan><tspan x="64" dy="29.900000000000002">выбор зависит от ранних.</tspan></text><text x="710" y="618" fill="#bbabff" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="580"><tspan x="710" dy="0">ЧТО ПОЛУЧИЛОСЬ</tspan></text><text x="710" y="652" fill="#f4f4f8" font-size="23" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="580"><tspan x="710" dy="0">Требования, имена и уже написанный код</tspan><tspan x="710" dy="29.900000000000002">направляют следующие токены. Обычная</tspan><tspan x="710" dy="29.900000000000002">генерация не обновляет веса модели.</tspan></text><text x="64" y="795" fill="#a6adbd" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">ЧТО МЕШАЛО РАНЬШЕ / ЧТО БЫЛО ДО ЭТОГО</tspan></text><text x="64" y="829" fill="#a6adbd" font-size="21" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Обучение и генерация — разные процессы. Механизм следующего токена сам по себе не доказывает</tspan><tspan x="64" dy="27.3">корректность программы.</tspan></text></svg>
