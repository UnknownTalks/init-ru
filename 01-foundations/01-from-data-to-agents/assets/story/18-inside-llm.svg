<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="900" viewBox="0 0 1360 900" role="img" aria-labelledby="title desc"><title id="title">Внутри: от ID к оценкам продолжения.</title><desc id="desc">Что делают основные блоки decoder-only Transformer? Embedding превращает ID в вектор. Attention смешивает информацию позиций. MLP преобразует признаки. Выход даёт оценки токенов словаря. В GPT-2 словарь содержит 50 257 элементов, окно — 1024 токена. Размер словаря и размер контекста измеряют разные вещи. Attention — самый непривычный блок. Посмотрим на один учебный расчёт его весов.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 z" fill="#a0e39b"/></marker></defs><rect x="1" y="1" width="1358" height="898" rx="28" fill="#11141c" stroke="#343a48"/><text x="64" y="42" fill="#a6adbd" font-size="14" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="750"><tspan x="64" dy="0">UNKNOWN TALKS / INIT-RU</tspan></text><text x="64" y="77" fill="#a0e39b" font-size="17" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1160"><tspan x="64" dy="0">04 · Модель  /  Детали реализации</tspan></text><text x="1230" y="77" fill="#a0e39b" font-size="22" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="70"><tspan x="1230" dy="0">L3</tspan></text><text x="64" y="137" fill="#f4f4f8" font-size="40" font-weight="700" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Внутри: от ID к оценкам продолжения.</tspan></text><text x="64" y="200" fill="#a0e39b" font-size="17" font-weight="500" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Источник · GPT-2 · 50 257 элементов словаря · 1024 токена контекста · источник 2019 года.</tspan></text><text x="64" y="245" fill="#f4f4f8" font-size="24" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Что делают основные блоки decoder-only Transformer?</tspan></text><rect x="64" y="350" width="279.5" height="150" rx="18" fill="#1c202a" stroke="#343a48"/><text x="88" y="395" fill="#a0e39b" font-size="26" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="231.5"><tspan x="88" dy="0">Embeddings</tspan></text><text x="88" y="441" fill="#a6adbd" font-size="20" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="231.5"><tspan x="88" dy="0">ID → векторы</tspan></text><path d="M348.5,425 L374.5,425" fill="none" stroke="#a0e39b" stroke-width="3" marker-end="url(#arrow)"/><rect x="381.5" y="350" width="279.5" height="150" rx="18" fill="#1c202a" stroke="#343a48"/><text x="405.5" y="395" fill="#a0e39b" font-size="26" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="231.5"><tspan x="405.5" dy="0">Attention</tspan></text><text x="405.5" y="441" fill="#a6adbd" font-size="20" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="231.5"><tspan x="405.5" dy="0">связи в контексте</tspan></text><path d="M666,425 L692,425" fill="none" stroke="#a0e39b" stroke-width="3" marker-end="url(#arrow)"/><rect x="699" y="350" width="279.5" height="150" rx="18" fill="#1c202a" stroke="#343a48"/><text x="723" y="395" fill="#a0e39b" font-size="26" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="231.5"><tspan x="723" dy="0">MLP</tspan></text><text x="723" y="441" fill="#a6adbd" font-size="20" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="231.5"><tspan x="723" dy="0">преобразования</tspan></text><path d="M983.5,425 L1009.5,425" fill="none" stroke="#a0e39b" stroke-width="3" marker-end="url(#arrow)"/><rect x="1016.5" y="350" width="279.5" height="150" rx="18" fill="#1c202a" stroke="#343a48"/><text x="1040.5" y="395" fill="#a0e39b" font-size="26" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="231.5"><tspan x="1040.5" dy="0">Logits</tspan></text><text x="1040.5" y="441" fill="#a6adbd" font-size="20" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="231.5"><tspan x="1040.5" dy="0">оценки токенов</tspan></text><text x="65" y="555" fill="#a6adbd" font-size="21" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1230"><tspan x="65" dy="0">Позиции + причинная маска · повторяющиеся блоки · residual + normalization</tspan></text><path d="M64,588 L1296,588" fill="none" stroke="#343a48" stroke-width="3" /><text x="64" y="618" fill="#a0e39b" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="570"><tspan x="64" dy="0">КАК ЭТО РАБОТАЕТ</tspan></text><text x="64" y="652" fill="#f4f4f8" font-size="23" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="575"><tspan x="64" dy="0">Embedding превращает ID в вектор. Attention</tspan><tspan x="64" dy="29.900000000000002">смешивает информацию позиций. MLP</tspan><tspan x="64" dy="29.900000000000002">преобразует признаки. Выход даёт оценки</tspan><tspan x="64" dy="29.900000000000002">токенов словаря.</tspan></text><text x="710" y="618" fill="#a0e39b" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="580"><tspan x="710" dy="0">РАЗБОР ПРИМЕРА / РЕЗУЛЬТАТ</tspan></text><text x="710" y="652" fill="#f4f4f8" font-size="23" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="580"><tspan x="710" dy="0">В GPT-2 словарь содержит 50 257 элементов,</tspan><tspan x="710" dy="29.900000000000002">окно — 1024 токена. Размер словаря и размер</tspan><tspan x="710" dy="29.900000000000002">контекста измеряют разные вещи.</tspan></text><text x="64" y="795" fill="#a6adbd" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">СЛЕДУЮЩИЙ ВОПРОС</tspan></text><text x="64" y="829" fill="#a6adbd" font-size="21" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Attention — самый непривычный блок. Посмотрим на один учебный расчёт его весов.</tspan></text></svg>
