<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="900" viewBox="0 0 1360 900" role="img" aria-labelledby="title"><title id="title">Почему вероятное продолжение бывает рабочим кодом? — объяснение</title><rect x="1" y="1" width="1358" height="898" rx="28" fill="#11141c" stroke="#343a48"/><text x="64" y="42" fill="#a6adbd" font-size="14" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="750"><tspan x="64" dy="0">UNKNOWN TALKS / INIT-RU</tspan></text><text x="64" y="77" fill="#ffb27c" font-size="17" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1160"><tspan x="64" dy="0">05 · Проверка / Принцип / пояснение</tspan></text><text x="64" y="137" fill="#f4f4f8" font-size="40" font-weight="700" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Почему вероятное продолжение бывает рабочим кодом?</tspan></text><text x="64" y="200" fill="#ffb27c" font-size="17" font-weight="500" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Источник · Начиная с Python 3.7 порядок вставки dict гарантирован спецификацией языка.</tspan></text><text x="64" y="272" fill="#ffb27c" font-size="14" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">ЧТО ЭТО ЗНАЧИТ И КАК СВЯЗАНО С ПРИМЕРОМ</tspan></text><text x="64" y="326" fill="#f4f4f8" font-size="26" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Рассмотрим конкретный код вместо общего обещания «модель понимает</tspan><tspan x="64" dy="39">программирование». dict.fromkeys последовательно создаёт ключи. Повторный ключ не</tspan><tspan x="64" dy="39">создаётся заново, а первые позиции сохраняются. list собирает эти ключи в</tspan><tspan x="64" dy="39">последовательность. Поэтому при правильном контракте входа функция решает задачу.</tspan><tspan x="64" dy="39">Модель могла предложить эту конструкцию благодаря выученным связям между словами</tspan><tspan x="64" dy="39">запроса и кодом. Но решение работает из-за семантики языка. Если контракт другой, та</tspan><tspan x="64" dy="39">же правдоподобная конструкция может не подойти.</tspan></text><path d="M64,756 L1296,756" fill="none" stroke="#343a48" stroke-width="3" /><text x="64" y="795" fill="#a6adbd" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">СЛЕДУЮЩИЙ ВОПРОС</tspan></text><text x="64" y="829" fill="#a6adbd" font-size="21" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Генерация предлагает реализацию. Следующий слой — проверить требования и границы этой реализации.</tspan></text></svg>
