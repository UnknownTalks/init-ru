<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="900" viewBox="0 0 1360 900" role="img" aria-labelledby="title"><title id="title">Выход может быть выбором, а не текстом. — объяснение</title><rect x="1" y="1" width="1358" height="898" rx="28" fill="#11141c" stroke="#343a48"/><text x="64" y="42" fill="#a6adbd" font-size="14" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="750"><tspan x="64" dy="0">UNKNOWN TALKS / INIT-RU</tspan></text><text x="64" y="77" fill="#a0e39b" font-size="17" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1160"><tspan x="64" dy="0">04 · Модель / Принцип / пояснение</tspan></text><text x="64" y="137" fill="#f4f4f8" font-size="40" font-weight="700" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Выход может быть выбором, а не текстом.</tspan></text><text x="64" y="200" fill="#a0e39b" font-size="17" font-weight="500" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Пример · Пример: 3 допустимых действия вместо произвольной строки ответа.</tspan></text><text x="64" y="272" fill="#a0e39b" font-size="14" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">ЧТО ЭТО ЗНАЧИТ И КАК СВЯЗАНО С ПРИМЕРОМ</tspan></text><text x="64" y="326" fill="#f4f4f8" font-size="26" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Генерация текста — не единственная форма ответа модели. Когда заранее известен</tspan><tspan x="64" dy="39">набор действий, можно поставить задачу выбора среди них. Это родственно</tspan><tspan x="64" dy="39">классификации: вход превращается в представление, затем вычисляются оценки</tspan><tspan x="64" dy="39">вариантов. Иллюстрация не описывает внутренние слои конкретного коммерческого</tspan><tspan x="64" dy="39">сервиса. Важно разделять допустимость ответа и его правильность. Система может</tspan><tspan x="64" dy="39">вернуть разрешённую метку «продолжить», хотя по ситуации следовало спросить</tspan><tspan x="64" dy="39">человека.</tspan></text><path d="M64,756 L1296,756" fill="none" stroke="#343a48" stroke-width="3" /><text x="64" y="795" fill="#a6adbd" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">СЛЕДУЮЩИЙ ВОПРОС</tspan></text><text x="64" y="829" fill="#a6adbd" font-size="21" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Отдельно разберём историю классификации, смысл вероятностей и современные реализации этой идеи.</tspan></text></svg>
