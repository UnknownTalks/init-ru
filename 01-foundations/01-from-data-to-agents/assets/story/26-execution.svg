<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="900" viewBox="0 0 1360 900" role="img" aria-labelledby="title desc"><title id="title">Тест проверяет условие, а не убедительность ответа.</title><desc id="desc">Какой пример отличает сохранение порядка от сортировки? Вход [&quot;b&quot;, &quot;a&quot;, &quot;b&quot;] требует [&quot;b&quot;, &quot;a&quot;]. sorted(set(xs)) вернёт [&quot;a&quot;, &quot;b&quot;] и нарушит условие. Проверяем пустой список, повторения и порядок. Добавляем ограничения входа: пример с dict требует хешируемых элементов. Как измерять генерацию кода на множестве новых задач, а не на трёх демонстрациях?</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 z" fill="#ffb27c"/></marker></defs><rect x="1" y="1" width="1358" height="898" rx="28" fill="#11141c" stroke="#343a48"/><text x="64" y="42" fill="#a6adbd" font-size="14" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="750"><tspan x="64" dy="0">UNKNOWN TALKS / INIT-RU</tspan></text><text x="64" y="77" fill="#ffb27c" font-size="17" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1160"><tspan x="64" dy="0">05 · Проверка  /  Детали реализации</tspan></text><text x="1230" y="77" fill="#ffb27c" font-size="22" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="70"><tspan x="1230" dy="0">L3</tspan></text><text x="64" y="137" fill="#f4f4f8" font-size="40" font-weight="700" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Тест проверяет условие, а не убедительность ответа.</tspan></text><text x="64" y="200" fill="#ffb27c" font-size="17" font-weight="500" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Проверенный пример · sorted(set([&quot;b&quot;,&quot;a&quot;,&quot;b&quot;])) → [&quot;a&quot;,&quot;b&quot;]; unique → [&quot;b&quot;,&quot;a&quot;].</tspan></text><text x="64" y="245" fill="#f4f4f8" font-size="24" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Какой пример отличает сохранение порядка от сортировки?</tspan></text><rect x="65" y="302" width="1230" height="72" rx="18" fill="#1c202a" stroke="#343a48"/><text x="90" y="349" fill="#f4f4f8" font-size="27" font-weight="400" font-family="'SFMono-Regular',Consolas,monospace" xml:space="preserve" data-max-width="500"><tspan x="90" dy="0">[&quot;b&quot;, &quot;a&quot;, &quot;b&quot;]</tspan></text><path d="M650,337 L750,337" fill="none" stroke="#ffb27c" stroke-width="3" marker-end="url(#arrow)"/><text x="810" y="349" fill="#ffb27c" font-size="27" font-weight="400" font-family="'SFMono-Regular',Consolas,monospace" xml:space="preserve" data-max-width="440"><tspan x="810" dy="0">[&quot;b&quot;, &quot;a&quot;]</tspan></text><rect x="65" y="389" width="1230" height="72" rx="18" fill="#1c202a" stroke="#343a48"/><text x="90" y="436" fill="#f4f4f8" font-size="27" font-weight="400" font-family="'SFMono-Regular',Consolas,monospace" xml:space="preserve" data-max-width="500"><tspan x="90" dy="0">[]</tspan></text><path d="M650,424 L750,424" fill="none" stroke="#ffb27c" stroke-width="3" marker-end="url(#arrow)"/><text x="810" y="436" fill="#ffb27c" font-size="27" font-weight="400" font-family="'SFMono-Regular',Consolas,monospace" xml:space="preserve" data-max-width="440"><tspan x="810" dy="0">[]</tspan></text><rect x="65" y="476" width="1230" height="72" rx="18" fill="#1c202a" stroke="#343a48"/><text x="90" y="523" fill="#f4f4f8" font-size="27" font-weight="400" font-family="'SFMono-Regular',Consolas,monospace" xml:space="preserve" data-max-width="500"><tspan x="90" dy="0">[&quot;x&quot;, &quot;x&quot;]</tspan></text><path d="M650,511 L750,511" fill="none" stroke="#ffb27c" stroke-width="3" marker-end="url(#arrow)"/><text x="810" y="523" fill="#ffb27c" font-size="27" font-weight="400" font-family="'SFMono-Regular',Consolas,monospace" xml:space="preserve" data-max-width="440"><tspan x="810" dy="0">[&quot;x&quot;]</tspan></text><path d="M64,588 L1296,588" fill="none" stroke="#343a48" stroke-width="3" /><text x="64" y="618" fill="#ffb27c" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="570"><tspan x="64" dy="0">КАК ЭТО РАБОТАЕТ</tspan></text><text x="64" y="652" fill="#f4f4f8" font-size="23" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="575"><tspan x="64" dy="0">Вход [&quot;b&quot;, &quot;a&quot;, &quot;b&quot;] требует [&quot;b&quot;, &quot;a&quot;].</tspan><tspan x="64" dy="29.900000000000002">sorted(set(xs)) вернёт [&quot;a&quot;, &quot;b&quot;] и нарушит</tspan><tspan x="64" dy="29.900000000000002">условие.</tspan></text><text x="710" y="618" fill="#ffb27c" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="580"><tspan x="710" dy="0">РАЗБОР ПРИМЕРА / РЕЗУЛЬТАТ</tspan></text><text x="710" y="652" fill="#f4f4f8" font-size="23" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="580"><tspan x="710" dy="0">Проверяем пустой список, повторения и</tspan><tspan x="710" dy="29.900000000000002">порядок. Добавляем ограничения входа: пример</tspan><tspan x="710" dy="29.900000000000002">с dict требует хешируемых элементов.</tspan></text><text x="64" y="795" fill="#a6adbd" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">СЛЕДУЮЩИЙ ВОПРОС</tspan></text><text x="64" y="829" fill="#a6adbd" font-size="21" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Как измерять генерацию кода на множестве новых задач, а не на трёх демонстрациях?</tspan></text></svg>
