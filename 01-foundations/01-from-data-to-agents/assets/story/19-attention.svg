<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="900" viewBox="0 0 1360 900" role="img" aria-labelledby="title desc"><title id="title">Attention — взвешенная смесь представлений.</title><desc id="desc">Как определить, сколько информации взять от каждой позиции? Вычисляются оценки совместимости. Softmax превращает их в веса с суммой 1; по этим весам смешиваются векторы содержимого. Для учебных уже масштабированных оценок [2, 0, 0] веса ≈[0,787; 0,107; 0,107]. Это расчёт, не измерение реальной модели. На этом уровне видно вычисление. Несколько голов и повторяющиеся блоки строят более богатую обработку.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 z" fill="#a0e39b"/></marker></defs><rect x="1" y="1" width="1358" height="898" rx="28" fill="#11141c" stroke="#343a48"/><text x="64" y="42" fill="#a6adbd" font-size="14" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="750"><tspan x="64" dy="0">UNKNOWN TALKS / INIT-RU</tspan></text><text x="64" y="77" fill="#a0e39b" font-size="17" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1160"><tspan x="64" dy="0">04 · Модель  /  Разбор вычисления</tspan></text><text x="1230" y="77" fill="#a0e39b" font-size="22" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="70"><tspan x="1230" dy="0">L4</tspan></text><text x="64" y="137" fill="#f4f4f8" font-size="40" font-weight="700" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Attention — взвешенная смесь представлений.</tspan></text><text x="64" y="200" fill="#a0e39b" font-size="17" font-weight="500" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Расчёт · softmax([2, 0, 0]) ≈ [0,787; 0,107; 0,107]; округление, сумма ≈ 1.</tspan></text><text x="64" y="245" fill="#f4f4f8" font-size="24" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Как определить, сколько информации взять от каждой позиции?</tspan></text><rect x="64" y="302" width="1232" height="260" rx="18" fill="#1c202a" stroke="#343a48"/><text x="82" y="335" fill="#a0e39b" font-size="19" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="294"><tspan x="82" dy="0">Позиция</tspan></text><text x="412" y="335" fill="#a0e39b" font-size="19" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="484"><tspan x="412" dy="0">Масштабированная оценка</tspan></text><text x="932" y="335" fill="#a0e39b" font-size="19" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="346"><tspan x="932" dy="0">Вес после softmax</tspan></text><path d="M80,359 L1280,359" fill="none" stroke="#343a48" stroke-width="3" /><text x="82" y="391" fill="#f4f4f8" font-size="20" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="294"><tspan x="82" dy="0">A</tspan></text><text x="412" y="391" fill="#f4f4f8" font-size="20" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="484"><tspan x="412" dy="0">2</tspan></text><text x="932" y="391" fill="#f4f4f8" font-size="20" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="346"><tspan x="932" dy="0">≈78,7%</tspan></text><path d="M80,426 L1280,426" fill="none" stroke="#343a48" stroke-width="3" /><text x="82" y="458" fill="#f4f4f8" font-size="20" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="294"><tspan x="82" dy="0">B</tspan></text><text x="412" y="458" fill="#f4f4f8" font-size="20" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="484"><tspan x="412" dy="0">0</tspan></text><text x="932" y="458" fill="#f4f4f8" font-size="20" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="346"><tspan x="932" dy="0">≈10,7%</tspan></text><path d="M80,493 L1280,493" fill="none" stroke="#343a48" stroke-width="3" /><text x="82" y="525" fill="#f4f4f8" font-size="20" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="294"><tspan x="82" dy="0">C</tspan></text><text x="412" y="525" fill="#f4f4f8" font-size="20" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="484"><tspan x="412" dy="0">0</tspan></text><text x="932" y="525" fill="#f4f4f8" font-size="20" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="346"><tspan x="932" dy="0">≈10,7%</tspan></text><path d="M64,588 L1296,588" fill="none" stroke="#343a48" stroke-width="3" /><text x="64" y="618" fill="#a0e39b" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="570"><tspan x="64" dy="0">КАК ЭТО РАБОТАЕТ</tspan></text><text x="64" y="652" fill="#f4f4f8" font-size="23" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="575"><tspan x="64" dy="0">Вычисляются оценки совместимости. Softmax</tspan><tspan x="64" dy="29.900000000000002">превращает их в веса с суммой 1; по этим весам</tspan><tspan x="64" dy="29.900000000000002">смешиваются векторы содержимого.</tspan></text><text x="710" y="618" fill="#a0e39b" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="580"><tspan x="710" dy="0">РАЗБОР ПРИМЕРА / РЕЗУЛЬТАТ</tspan></text><text x="710" y="652" fill="#f4f4f8" font-size="23" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="580"><tspan x="710" dy="0">Для учебных уже масштабированных оценок [2,</tspan><tspan x="710" dy="29.900000000000002">0, 0] веса ≈[0,787; 0,107; 0,107]. Это расчёт, не</tspan><tspan x="710" dy="29.900000000000002">измерение реальной модели.</tspan></text><text x="64" y="795" fill="#a6adbd" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">СЛЕДУЮЩИЙ ВОПРОС</tspan></text><text x="64" y="829" fill="#a6adbd" font-size="21" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">На этом уровне видно вычисление. Несколько голов и повторяющиеся блоки строят более богатую обработку.</tspan></text></svg>
