<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="900" viewBox="0 0 1360 900" role="img" aria-labelledby="title desc"><title id="title">Подготовка — выбрать, что учить.</title><desc id="desc">Что оставить от страницы: меню, рекламу, вопрос, ответ, код? Извлекаем содержимое, сохраняем важную структуру и отделяем повторяющиеся копии. Готовим отдельные данные для проверки. В обучающий набор попадают последовательности содержимого. Будущая проверка должна показывать перенос на новые примеры. Материал подготовлен. Что именно должна делать модель, чтобы научиться на этих примерах?</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 z" fill="#f6ce77"/></marker></defs><rect x="1" y="1" width="1358" height="898" rx="28" fill="#11141c" stroke="#343a48"/><text x="64" y="42" fill="#a6adbd" font-size="14" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="750"><tspan x="64" dy="0">UNKNOWN TALKS / INIT-RU</tspan></text><text x="64" y="77" fill="#f6ce77" font-size="17" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1160"><tspan x="64" dy="0">02 · Подготовка  /  Пример / основы</tspan></text><text x="1230" y="77" fill="#f6ce77" font-size="22" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="70"><tspan x="1230" dy="0">L1</tspan></text><text x="64" y="137" fill="#f4f4f8" font-size="40" font-weight="700" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Подготовка — выбрать, что учить.</tspan></text><text x="64" y="200" fill="#f6ce77" font-size="17" font-weight="500" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Источник · В C4 обнаружили одну 61-словную фразу более 60 000 раз; это наблюдение авторов работы.</tspan></text><text x="64" y="245" fill="#f4f4f8" font-size="24" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Что оставить от страницы: меню, рекламу, вопрос, ответ, код?</tspan></text><rect x="64" y="350" width="385.3333333333333" height="150" rx="18" fill="#1c202a" stroke="#343a48"/><text x="88" y="395" fill="#f6ce77" font-size="26" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="337.3333333333333"><tspan x="88" dy="0">Страница</tspan></text><text x="88" y="441" fill="#a6adbd" font-size="20" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="337.3333333333333"><tspan x="88" dy="0">меню + текст + код</tspan></text><path d="M454.3333333333333,425 L480.3333333333333,425" fill="none" stroke="#f6ce77" stroke-width="3" marker-end="url(#arrow)"/><rect x="487.3333333333333" y="350" width="385.3333333333333" height="150" rx="18" fill="#1c202a" stroke="#343a48"/><text x="511.3333333333333" y="395" fill="#f6ce77" font-size="26" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="337.3333333333333"><tspan x="511.3333333333333" dy="0">Содержимое</tspan></text><text x="511.3333333333333" y="441" fill="#a6adbd" font-size="20" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="337.3333333333333"><tspan x="511.3333333333333" dy="0">выбрать и сохранить структуру</tspan></text><path d="M877.6666666666666,425 L903.6666666666666,425" fill="none" stroke="#f6ce77" stroke-width="3" marker-end="url(#arrow)"/><rect x="910.6666666666666" y="350" width="385.3333333333333" height="150" rx="18" fill="#1c202a" stroke="#343a48"/><text x="934.6666666666666" y="395" fill="#f6ce77" font-size="26" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="337.3333333333333"><tspan x="934.6666666666666" dy="0">Учебные примеры</tspan></text><text x="934.6666666666666" y="441" fill="#a6adbd" font-size="20" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="337.3333333333333"><tspan x="934.6666666666666" dy="0">отложить отдельную проверку</tspan></text><path d="M64,588 L1296,588" fill="none" stroke="#343a48" stroke-width="3" /><text x="64" y="618" fill="#f6ce77" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="570"><tspan x="64" dy="0">КАК ЭТО РАБОТАЕТ</tspan></text><text x="64" y="652" fill="#f4f4f8" font-size="23" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="575"><tspan x="64" dy="0">Извлекаем содержимое, сохраняем важную</tspan><tspan x="64" dy="29.900000000000002">структуру и отделяем повторяющиеся копии.</tspan><tspan x="64" dy="29.900000000000002">Готовим отдельные данные для проверки.</tspan></text><text x="710" y="618" fill="#f6ce77" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="580"><tspan x="710" dy="0">РАЗБОР ПРИМЕРА / РЕЗУЛЬТАТ</tspan></text><text x="710" y="652" fill="#f4f4f8" font-size="23" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="580"><tspan x="710" dy="0">В обучающий набор попадают</tspan><tspan x="710" dy="29.900000000000002">последовательности содержимого. Будущая</tspan><tspan x="710" dy="29.900000000000002">проверка должна показывать перенос на новые</tspan><tspan x="710" dy="29.900000000000002">примеры.</tspan></text><text x="64" y="795" fill="#a6adbd" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">СЛЕДУЮЩИЙ ВОПРОС</tspan></text><text x="64" y="829" fill="#a6adbd" font-size="21" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Материал подготовлен. Что именно должна делать модель, чтобы научиться на этих примерах?</tspan></text></svg>
