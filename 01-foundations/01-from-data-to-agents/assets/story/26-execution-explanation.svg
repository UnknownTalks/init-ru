<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="900" viewBox="0 0 1360 900" role="img" aria-labelledby="title"><title id="title">Тест проверяет условие, а не убедительность ответа. — объяснение</title><rect x="1" y="1" width="1358" height="898" rx="28" fill="#11141c" stroke="#343a48"/><text x="64" y="42" fill="#a6adbd" font-size="14" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="750"><tspan x="64" dy="0">UNKNOWN TALKS / INIT-RU</tspan></text><text x="64" y="77" fill="#ffb27c" font-size="17" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1160"><tspan x="64" dy="0">05 · Проверка / Детали реализации / пояснение</tspan></text><text x="64" y="137" fill="#f4f4f8" font-size="40" font-weight="700" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Тест проверяет условие, а не убедительность ответа.</tspan></text><text x="64" y="200" fill="#ffb27c" font-size="17" font-weight="500" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Проверенный пример · sorted(set([&quot;b&quot;,&quot;a&quot;,&quot;b&quot;])) → [&quot;a&quot;,&quot;b&quot;]; unique → [&quot;b&quot;,&quot;a&quot;].</tspan></text><text x="64" y="272" fill="#ffb27c" font-size="14" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">ЧТО ЭТО ЗНАЧИТ И КАК СВЯЗАНО С ПРИМЕРОМ</tspan></text><text x="64" y="326" fill="#f4f4f8" font-size="26" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Хорошая проверка различает подходящие и ошибочные реализации. Если использовать</tspan><tspan x="64" dy="39">только вход [&quot;a&quot;, &quot;a&quot;], сортировка и сохранение порядка дадут одинаковый результат.</tspan><tspan x="64" dy="39">Поэтому нужен пример, где ожидаемое поведение расходится. Наш вход с b перед a</tspan><tspan x="64" dy="39">делает это различие видимым. Дальше нужно определить допустимые типы и другие</tspan><tspan x="64" dy="39">требования. Тесты дают основания доверять конкретным свойствам; полнота этих</tspan><tspan x="64" dy="39">оснований зависит от того, что именно проверялось.</tspan></text><path d="M64,756 L1296,756" fill="none" stroke="#343a48" stroke-width="3" /><text x="64" y="795" fill="#a6adbd" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">СЛЕДУЮЩИЙ ВОПРОС</tspan></text><text x="64" y="829" fill="#a6adbd" font-size="21" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Как измерять генерацию кода на множестве новых задач, а не на трёх демонстрациях?</tspan></text></svg>
