<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="900" viewBox="0 0 1360 900" role="img" aria-labelledby="title"><title id="title">Правильность подтверждает исполнение. — объяснение</title><rect x="1" y="1" width="1358" height="898" rx="28" fill="#11141c" stroke="#343a48"/><text x="64" y="42" fill="#a6adbd" font-size="14" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="750"><tspan x="64" dy="0">UNKNOWN TALKS / INIT-RU</tspan></text><text x="64" y="77" fill="#ffb27c" font-size="17" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1160"><tspan x="64" dy="0">05 · Проверка / Пример / основы / пояснение</tspan></text><text x="64" y="137" fill="#f4f4f8" font-size="40" font-weight="700" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Правильность подтверждает исполнение.</tspan></text><text x="64" y="200" fill="#ffb27c" font-size="17" font-weight="500" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Проверенный пример · 3 показанных входа и результата проверены исполнением Python; это примеры, не бенчмарк.</tspan></text><text x="64" y="272" fill="#ffb27c" font-size="14" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">ЧТО ЭТО ЗНАЧИТ И КАК СВЯЗАНО С ПРИМЕРОМ</tspan></text><text x="64" y="326" fill="#f4f4f8" font-size="26" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Код — текст с формально заданным поведением. Python исполняет программу по правилам</tspan><tspan x="64" dy="39">языка, а не по уверенности автора ответа. dict.fromkeys создаёт ключи в порядке</tspan><tspan x="64" dy="39">первого появления, а list собирает их в список. Для строк это даёт нужное поведение.</tspan><tspan x="64" dy="39">Проверка пустого списка и повторов подтверждает отдельные случаи. Она не</tspan><tspan x="64" dy="39">доказывает корректность для любого входа: например, вложенный список не подходит</tspan><tspan x="64" dy="39">для ключа dict. Теперь виден полезный цикл — предложить код, выполнить проверку,</tspan><tspan x="64" dy="39">учесть ошибку и попробовать исправление.</tspan></text><path d="M64,756 L1296,756" fill="none" stroke="#343a48" stroke-width="3" /><text x="64" y="795" fill="#a6adbd" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">СЛЕДУЮЩИЙ ВОПРОС</tspan></text><text x="64" y="829" fill="#a6adbd" font-size="21" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Если проверка дала ошибку, её можно вернуть модели. Кто будет повторять этот процесс вместо человека?</tspan></text></svg>
