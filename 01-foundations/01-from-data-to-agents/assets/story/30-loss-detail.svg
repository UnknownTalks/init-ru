<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="900" viewBox="0 0 1360 900" role="img" aria-labelledby="title desc"><title id="title">Как ошибка превращается в обновление весов?</title><desc id="desc">Если вероятность правильного токена выросла, как это отражается в потере? Для одной цели L=−ln p. Производные показывают чувствительность потери к параметрам. Оптимизатор делает небольшой шаг. p=0,1 → L≈2,303; p=0,8 → L≈0,223. Это арифметика учебного примера, а не лог реального обучения. Тот же принцип повторяется по многим позициям и примерам. Размеры модели и данных определяют масштаб вычислений.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 z" fill="#bbabff"/></marker></defs><rect x="1" y="1" width="1358" height="898" rx="28" fill="#11141c" stroke="#343a48"/><text x="64" y="42" fill="#a6adbd" font-size="14" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="750"><tspan x="64" dy="0">UNKNOWN TALKS / INIT-RU</tspan></text><text x="64" y="77" fill="#bbabff" font-size="17" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1160"><tspan x="64" dy="0">03 · Обучение  /  Детали реализации</tspan></text><text x="1230" y="77" fill="#bbabff" font-size="22" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="70"><tspan x="1230" dy="0">L3</tspan></text><text x="64" y="137" fill="#f4f4f8" font-size="40" font-weight="700" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Как ошибка превращается в обновление весов?</tspan></text><text x="64" y="200" fill="#bbabff" font-size="17" font-weight="500" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Расчёт · −ln(0,1)≈2,303; −ln(0,8)≈0,223.</tspan></text><text x="64" y="245" fill="#f4f4f8" font-size="24" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Если вероятность правильного токена выросла, как это отражается в потере?</tspan></text><rect x="64" y="302" width="1232" height="260" rx="18" fill="#1c202a" stroke="#343a48"/><text x="82" y="335" fill="#bbabff" font-size="19" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="294"><tspan x="82" dy="0">p правильного токена</tspan></text><text x="412" y="335" fill="#bbabff" font-size="19" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="484"><tspan x="412" dy="0">−ln(p)</tspan></text><text x="932" y="335" fill="#bbabff" font-size="19" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="346"><tspan x="932" dy="0">Интерпретация</tspan></text><path d="M80,359 L1280,359" fill="none" stroke="#343a48" stroke-width="3" /><text x="82" y="391" fill="#f4f4f8" font-size="20" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="294"><tspan x="82" dy="0">0,1</tspan></text><text x="412" y="391" fill="#f4f4f8" font-size="20" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="484"><tspan x="412" dy="0">2,303</tspan></text><text x="932" y="391" fill="#f4f4f8" font-size="20" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="346"><tspan x="932" dy="0">большая потеря</tspan></text><path d="M80,426 L1280,426" fill="none" stroke="#343a48" stroke-width="3" /><text x="82" y="458" fill="#f4f4f8" font-size="20" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="294"><tspan x="82" dy="0">0,8</tspan></text><text x="412" y="458" fill="#f4f4f8" font-size="20" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="484"><tspan x="412" dy="0">0,223</tspan></text><text x="932" y="458" fill="#f4f4f8" font-size="20" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="346"><tspan x="932" dy="0">меньшая потеря</tspan></text><path d="M64,588 L1296,588" fill="none" stroke="#343a48" stroke-width="3" /><text x="64" y="618" fill="#bbabff" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="570"><tspan x="64" dy="0">КАК ЭТО РАБОТАЕТ</tspan></text><text x="64" y="652" fill="#f4f4f8" font-size="23" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="575"><tspan x="64" dy="0">Для одной цели L=−ln p. Производные</tspan><tspan x="64" dy="29.900000000000002">показывают чувствительность потери к</tspan><tspan x="64" dy="29.900000000000002">параметрам. Оптимизатор делает небольшой</tspan><tspan x="64" dy="29.900000000000002">шаг.</tspan></text><text x="710" y="618" fill="#bbabff" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="580"><tspan x="710" dy="0">РАЗБОР ПРИМЕРА / РЕЗУЛЬТАТ</tspan></text><text x="710" y="652" fill="#f4f4f8" font-size="23" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="580"><tspan x="710" dy="0">p=0,1 → L≈2,303; p=0,8 → L≈0,223. Это</tspan><tspan x="710" dy="29.900000000000002">арифметика учебного примера, а не лог</tspan><tspan x="710" dy="29.900000000000002">реального обучения.</tspan></text><text x="64" y="795" fill="#a6adbd" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">СЛЕДУЮЩИЙ ВОПРОС</tspan></text><text x="64" y="829" fill="#a6adbd" font-size="21" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Тот же принцип повторяется по многим позициям и примерам. Размеры модели и данных определяют масштаб</tspan><tspan x="64" dy="27.3">вычислений.</tspan></text></svg>
