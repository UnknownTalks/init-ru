<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="900" viewBox="0 0 1360 900" role="img" aria-labelledby="title desc"><title id="title">Выбирать класс машины умели давно.</title><desc id="desc">Если ответ — один из вариантов, зачем генерировать целый текст? Классификатор вычисляет оценки вариантов. Для выбора действия можно ограничить пространство ответов заранее. Метка, оценка или вероятность становятся входом обычной логики. Корректная форма ещё не означает верное решение. Это не изобретение 2026 года. Раньше часто нужны были признаки, разметка и отдельная модель под конкретную область.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 z" fill="#ffa5c8"/></marker></defs><rect x="1" y="1" width="1358" height="898" rx="28" fill="#11141c" stroke="#343a48"/><text x="64" y="42" fill="#a6adbd" font-size="14" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="750"><tspan x="64" dy="0">UNKNOWN TALKS / INIT-RU</tspan></text><text x="64" y="77" fill="#ffa5c8" font-size="17" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1100"><tspan x="64" dy="0">06 · А если нужен только выбор?</tspan></text><text x="1230" y="77" fill="#ffa5c8" font-size="24" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="70"><tspan x="1230" dy="0">20</tspan></text><text x="64" y="137" fill="#f4f4f8" font-size="43" font-weight="700" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Выбирать класс машины умели давно.</tspan></text><text x="64" y="205" fill="#ffa5c8" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1100"><tspan x="64" dy="0">ПРОБЛЕМА</tspan></text><text x="64" y="238" fill="#f4f4f8" font-size="25" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Если ответ — один из вариантов, зачем генерировать целый текст?</tspan></text><rect x="65" y="330" width="420" height="210" rx="18" fill="#1c202a" stroke="#343a48"/><text x="89" y="375" fill="#ffa5c8" font-size="26" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="372"><tspan x="89" dy="0">Вход</tspan></text><text x="89" y="421" fill="#a6adbd" font-size="20" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="372"><tspan x="89" dy="0">текст, изображение или признаки</tspan></text><path d="M505,435 L620,435" fill="none" stroke="#ffa5c8" stroke-width="3" marker-end="url(#arrow)"/><rect x="640" y="330" width="640" height="210" rx="18" fill="#1c202a" stroke="#343a48"/><text x="664" y="375" fill="#f4f4f8" font-size="26" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="592"><tspan x="664" dy="0">Допустимые классы</tspan></text><text x="664" y="421" fill="#a6adbd" font-size="20" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="592"><tspan x="664" dy="0">спам / не спам · выбрать категорию · оценить признак</tspan></text><path d="M64,588 L1296,588" fill="none" stroke="#343a48" stroke-width="3" /><text x="64" y="618" fill="#ffa5c8" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="540"><tspan x="64" dy="0">ИДЕЯ</tspan></text><text x="64" y="652" fill="#f4f4f8" font-size="23" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="575"><tspan x="64" dy="0">Классификатор вычисляет оценки вариантов.</tspan><tspan x="64" dy="29.900000000000002">Для выбора действия можно ограничить</tspan><tspan x="64" dy="29.900000000000002">пространство ответов заранее.</tspan></text><text x="710" y="618" fill="#ffa5c8" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="580"><tspan x="710" dy="0">ЧТО ПОЛУЧИЛОСЬ</tspan></text><text x="710" y="652" fill="#f4f4f8" font-size="23" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="580"><tspan x="710" dy="0">Метка, оценка или вероятность становятся</tspan><tspan x="710" dy="29.900000000000002">входом обычной логики. Корректная форма ещё</tspan><tspan x="710" dy="29.900000000000002">не означает верное решение.</tspan></text><text x="64" y="795" fill="#a6adbd" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">ЧТО МЕШАЛО РАНЬШЕ / ЧТО БЫЛО ДО ЭТОГО</tspan></text><text x="64" y="829" fill="#a6adbd" font-size="21" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Это не изобретение 2026 года. Раньше часто нужны были признаки, разметка и отдельная модель под</tspan><tspan x="64" dy="27.3">конкретную область.</tspan></text></svg>
