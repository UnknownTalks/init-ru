<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="900" viewBox="0 0 1360 900" role="img" aria-labelledby="title desc"><title id="title">Очистка меняет то, чему модель учится.</title><desc id="desc">Как отделить полезные закономерности от повторов, шума и ошибочной оценки? Извлечь содержание, сохранить структуру, убрать дубликаты и отделить обучение от проверки. Получается обучающий сигнал. Утечка ответа в проверочную выборку даёт красивый балл вместо честной оценки. После подготовки остаётся главный вопрос: какой сигнал сообщает модели, что она ошиблась?</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 z" fill="#f6ce77"/></marker></defs><rect x="1" y="1" width="1358" height="898" rx="28" fill="#11141c" stroke="#343a48"/><text x="64" y="42" fill="#a6adbd" font-size="14" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="750"><tspan x="64" dy="0">UNKNOWN TALKS / INIT-RU</tspan></text><text x="64" y="77" fill="#f6ce77" font-size="17" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1160"><tspan x="64" dy="0">02 · Подготовка  /  Принцип</tspan></text><text x="1230" y="77" fill="#f6ce77" font-size="22" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="70"><tspan x="1230" dy="0">L2</tspan></text><text x="64" y="137" fill="#f4f4f8" font-size="40" font-weight="700" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Очистка меняет то, чему модель учится.</tspan></text><text x="64" y="200" fill="#f6ce77" font-size="17" font-weight="500" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Источник · Одна фраза длиной 61 слово встречалась в C4 более 60 000 раз (Lee et al.).</tspan></text><text x="64" y="245" fill="#f4f4f8" font-size="24" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Как отделить полезные закономерности от повторов, шума и ошибочной оценки?</tspan></text><rect x="64" y="310" width="386" height="250" rx="18" fill="#1c202a" stroke="#343a48"/><text x="89" y="390" fill="#f6ce77" font-size="62" font-weight="700" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="336"><tspan x="89" dy="0">61 слово</tspan></text><text x="89" y="488" fill="#f4f4f8" font-size="22" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="336"><tspan x="89" dy="0">одна повторяемая фраза</tspan></text><rect x="488" y="310" width="386" height="250" rx="18" fill="#1c202a" stroke="#343a48"/><text x="513" y="390" fill="#f6ce77" font-size="62" font-weight="700" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="336"><tspan x="513" dy="0">&gt;60 000</tspan></text><text x="513" y="488" fill="#f4f4f8" font-size="22" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="336"><tspan x="513" dy="0">её копий в C4</tspan></text><rect x="912" y="310" width="386" height="250" rx="18" fill="#1c202a" stroke="#343a48"/><text x="937" y="390" fill="#f6ce77" font-size="62" font-weight="700" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="336"><tspan x="937" dy="0">×10 реже</tspan></text><text x="937" y="488" fill="#f4f4f8" font-size="22" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="336"><tspan x="937" dy="0">запомненный текст в опытах</tspan><tspan x="937" dy="29.700000000000003">авторов</tspan></text><path d="M64,588 L1296,588" fill="none" stroke="#343a48" stroke-width="3" /><text x="64" y="618" fill="#f6ce77" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="570"><tspan x="64" dy="0">КАК ЭТО РАБОТАЕТ</tspan></text><text x="64" y="652" fill="#f4f4f8" font-size="23" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="575"><tspan x="64" dy="0">Извлечь содержание, сохранить структуру,</tspan><tspan x="64" dy="29.900000000000002">убрать дубликаты и отделить обучение от</tspan><tspan x="64" dy="29.900000000000002">проверки.</tspan></text><text x="710" y="618" fill="#f6ce77" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="580"><tspan x="710" dy="0">РАЗБОР ПРИМЕРА / РЕЗУЛЬТАТ</tspan></text><text x="710" y="652" fill="#f4f4f8" font-size="23" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="580"><tspan x="710" dy="0">Получается обучающий сигнал. Утечка ответа в</tspan><tspan x="710" dy="29.900000000000002">проверочную выборку даёт красивый балл</tspan><tspan x="710" dy="29.900000000000002">вместо честной оценки.</tspan></text><text x="64" y="795" fill="#a6adbd" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">СЛЕДУЮЩИЙ ВОПРОС</tspan></text><text x="64" y="829" fill="#a6adbd" font-size="21" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">После подготовки остаётся главный вопрос: какой сигнал сообщает модели, что она ошиблась?</tspan></text></svg>
