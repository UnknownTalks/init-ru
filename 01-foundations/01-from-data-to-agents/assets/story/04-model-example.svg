<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="900" viewBox="0 0 1360 900" role="img" aria-labelledby="title desc"><title id="title">Запрос использует готовую модель.</title><desc id="desc">«Напиши Python-функцию: убери повторы и сохрани порядок строк». Приложение передаёт запрос и нужный контекст. Готовая модель последовательно формирует фрагменты ответа. Возможный ответ: def unique(xs): return list(dict.fromkeys(xs)). Это предложенная программа; её ещё нужно проверить. Получили программу. Почему она может работать и как проверить, что она решает нашу задачу?</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 z" fill="#a0e39b"/></marker></defs><rect x="1" y="1" width="1358" height="898" rx="28" fill="#11141c" stroke="#343a48"/><text x="64" y="42" fill="#a6adbd" font-size="14" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="750"><tspan x="64" dy="0">UNKNOWN TALKS / INIT-RU</tspan></text><text x="64" y="77" fill="#a0e39b" font-size="17" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1160"><tspan x="64" dy="0">04 · Модель  /  Пример / основы</tspan></text><text x="1230" y="77" fill="#a0e39b" font-size="22" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="70"><tspan x="1230" dy="0">L1</tspan></text><text x="64" y="137" fill="#f4f4f8" font-size="40" font-weight="700" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Запрос использует готовую модель.</tspan></text><text x="64" y="200" fill="#a0e39b" font-size="17" font-weight="500" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Пример · Учебный пример: запрос → возможный код. В этом шаге модель ещё ничего не исполняет.</tspan></text><text x="64" y="245" fill="#f4f4f8" font-size="24" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">«Напиши Python-функцию: убери повторы и сохрани порядок строк».</tspan></text><rect x="64" y="307" width="760" height="155" rx="18" fill="#0b0e14" stroke="#343a48"/><text x="89" y="338" fill="#a6adbd" font-size="13" font-weight="600" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="710"><tspan x="89" dy="0">ВОЗМОЖНЫЙ ОТВЕТ НА ЗАПРОС</tspan></text><text x="89" y="379" fill="#c3b5ff" font-size="25" font-weight="400" font-family="'SFMono-Regular',Consolas,monospace" xml:space="preserve" data-max-width="710"><tspan x="89" dy="0">def unique(xs):</tspan></text><text x="89" y="414" fill="#c3b5ff" font-size="25" font-weight="400" font-family="'SFMono-Regular',Consolas,monospace" xml:space="preserve" data-max-width="710"><tspan x="89" dy="0">    return list(dict.fromkeys(xs))</tspan></text><text x="900" y="350" fill="#a0e39b" font-size="30" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="350"><tspan x="900" dy="0">Запрос</tspan></text><path d="M950,371 L950,393" fill="none" stroke="#a0e39b" stroke-width="3" marker-end="url(#arrow)"/><text x="900" y="434" fill="#f4f4f8" font-size="30" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="350"><tspan x="900" dy="0">Модель</tspan></text><path d="M950,454 L950,474" fill="none" stroke="#a0e39b" stroke-width="3" marker-end="url(#arrow)"/><text x="900" y="515" fill="#a0e39b" font-size="30" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="350"><tspan x="900" dy="0">Ответ</tspan></text><path d="M64,588 L1296,588" fill="none" stroke="#343a48" stroke-width="3" /><text x="64" y="618" fill="#a0e39b" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="570"><tspan x="64" dy="0">КАК ЭТО РАБОТАЕТ</tspan></text><text x="64" y="652" fill="#f4f4f8" font-size="23" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="575"><tspan x="64" dy="0">Приложение передаёт запрос и нужный</tspan><tspan x="64" dy="29.900000000000002">контекст. Готовая модель последовательно</tspan><tspan x="64" dy="29.900000000000002">формирует фрагменты ответа.</tspan></text><text x="710" y="618" fill="#a0e39b" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="580"><tspan x="710" dy="0">РАЗБОР ПРИМЕРА / РЕЗУЛЬТАТ</tspan></text><text x="710" y="652" fill="#f4f4f8" font-size="23" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="580"><tspan x="710" dy="0">Возможный ответ: def unique(xs): return</tspan><tspan x="710" dy="29.900000000000002">list(dict.fromkeys(xs)). Это предложенная</tspan><tspan x="710" dy="29.900000000000002">программа; её ещё нужно проверить.</tspan></text><text x="64" y="795" fill="#a6adbd" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">СЛЕДУЮЩИЙ ВОПРОС</tspan></text><text x="64" y="829" fill="#a6adbd" font-size="21" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Получили программу. Почему она может работать и как проверить, что она решает нашу задачу?</tspan></text></svg>
