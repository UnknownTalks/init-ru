<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="900" viewBox="0 0 1360 900" role="img" aria-labelledby="title desc"><title id="title">Почему это часто работает именно с кодом?</title><desc id="desc">Если выбирается вероятное продолжение, откуда берётся рабочая программа? Код повторно использует синтаксис, алгоритмы и API. Текстовые требования связаны с этими структурами в обучении. Модель может собрать новое сочетание знакомых операций. Новая программа не обязана быть найденной готовой цитатой. Запоминание тоже возможно. Сильные результаты на знакомом стиле задач не гарантируют успех на новом API или сложной логике.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 z" fill="#a0e39b"/></marker></defs><rect x="1" y="1" width="1358" height="898" rx="28" fill="#11141c" stroke="#343a48"/><text x="64" y="42" fill="#a6adbd" font-size="14" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="750"><tspan x="64" dy="0">UNKNOWN TALKS / INIT-RU</tspan></text><text x="64" y="77" fill="#a0e39b" font-size="17" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1100"><tspan x="64" dy="0">04 · Почему получается код</tspan></text><text x="1230" y="77" fill="#a0e39b" font-size="24" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="70"><tspan x="1230" dy="0">15</tspan></text><text x="64" y="137" fill="#f4f4f8" font-size="43" font-weight="700" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Почему это часто работает именно с кодом?</tspan></text><text x="64" y="205" fill="#a0e39b" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1100"><tspan x="64" dy="0">ПРОБЛЕМА</tspan></text><text x="64" y="238" fill="#f4f4f8" font-size="25" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Если выбирается вероятное продолжение, откуда берётся рабочая программа?</tspan></text><rect x="64" y="307" width="710" height="155" rx="18" fill="#0b0e14" stroke="#343a48"/><text x="89" y="338" fill="#a6adbd" font-size="13" font-weight="600" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="660"><tspan x="89" dy="0">ПРИМЕР ДЛЯ СПИСКА СТРОК</tspan></text><text x="89" y="379" fill="#c3b5ff" font-size="25" font-weight="400" font-family="'SFMono-Regular',Consolas,monospace" xml:space="preserve" data-max-width="660"><tspan x="89" dy="0">def unique(xs):</tspan></text><text x="89" y="414" fill="#c3b5ff" font-size="25" font-weight="400" font-family="'SFMono-Regular',Consolas,monospace" xml:space="preserve" data-max-width="660"><tspan x="89" dy="0">    return list(dict.fromkeys(xs))</tspan></text><text x="850" y="343" fill="#a0e39b" font-size="29" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="400"><tspan x="850" dy="0">Синтаксис</tspan></text><text x="850" y="405" fill="#f4f4f8" font-size="26" font-weight="600" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="430"><tspan x="850" dy="0">Повторяемые операции</tspan></text><text x="850" y="467" fill="#f4f4f8" font-size="26" font-weight="600" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="430"><tspan x="850" dy="0">Условия из контекста</tspan></text><text x="65" y="554" fill="#a6adbd" font-size="23" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1230"><tspan x="65" dy="0">Новое сочетание знакомых механизмов может быть корректной программой.</tspan></text><path d="M64,588 L1296,588" fill="none" stroke="#343a48" stroke-width="3" /><text x="64" y="618" fill="#a0e39b" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="540"><tspan x="64" dy="0">ИДЕЯ</tspan></text><text x="64" y="652" fill="#f4f4f8" font-size="23" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="575"><tspan x="64" dy="0">Код повторно использует синтаксис,</tspan><tspan x="64" dy="29.900000000000002">алгоритмы и API. Текстовые требования</tspan><tspan x="64" dy="29.900000000000002">связаны с этими структурами в обучении.</tspan></text><text x="710" y="618" fill="#a0e39b" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="580"><tspan x="710" dy="0">ЧТО ПОЛУЧИЛОСЬ</tspan></text><text x="710" y="652" fill="#f4f4f8" font-size="23" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="580"><tspan x="710" dy="0">Модель может собрать новое сочетание</tspan><tspan x="710" dy="29.900000000000002">знакомых операций. Новая программа не</tspan><tspan x="710" dy="29.900000000000002">обязана быть найденной готовой цитатой.</tspan></text><text x="64" y="795" fill="#a6adbd" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">ЧТО МЕШАЛО РАНЬШЕ / ЧТО БЫЛО ДО ЭТОГО</tspan></text><text x="64" y="829" fill="#a6adbd" font-size="21" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Запоминание тоже возможно. Сильные результаты на знакомом стиле задач не гарантируют успех на новом</tspan><tspan x="64" dy="27.3">API или сложной логике.</tspan></text></svg>
