<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="900" viewBox="0 0 1360 900" role="img" aria-labelledby="title desc"><title id="title">Ответ строится последовательностью токенов.</title><desc id="desc">Как из запроса получается целый ответ? Модель вычисляет оценки продолжений, выбирается один токен, он добавляется к контексту. Затем вычисляется следующий. Ниже — пример программы; у выбранного токенизатора она кодируется 12 токенами. Кодирование и генерация — разные операции. Можно углубиться в токенизацию, устройство модели или обучение поведению помощника.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L7,3 z" fill="#a0e39b"/></marker></defs><rect x="1" y="1" width="1358" height="898" rx="28" fill="#11141c" stroke="#343a48"/><text x="64" y="42" fill="#a6adbd" font-size="14" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="750"><tspan x="64" dy="0">UNKNOWN TALKS / INIT-RU</tspan></text><text x="64" y="77" fill="#a0e39b" font-size="17" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1160"><tspan x="64" dy="0">04 · Модель  /  Принцип</tspan></text><text x="1230" y="77" fill="#a0e39b" font-size="22" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="70"><tspan x="1230" dy="0">L2</tspan></text><text x="64" y="137" fill="#f4f4f8" font-size="40" font-weight="700" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Ответ строится последовательностью токенов.</tspan></text><text x="64" y="200" fill="#a0e39b" font-size="17" font-weight="500" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Проверенный пример · Показанная двухстрочная программа → 12 токенов Qwen2.5-0.5B без специальных токенов.</tspan></text><text x="64" y="245" fill="#f4f4f8" font-size="24" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Как из запроса получается целый ответ?</tspan></text><rect x="64" y="307" width="760" height="155" rx="18" fill="#0b0e14" stroke="#343a48"/><text x="89" y="338" fill="#a6adbd" font-size="13" font-weight="600" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="710"><tspan x="89" dy="0">ПРИМЕР ПОСЛЕДОВАТЕЛЬНОСТИ</tspan></text><text x="89" y="379" fill="#c3b5ff" font-size="26" font-weight="400" font-family="'SFMono-Regular',Consolas,monospace" xml:space="preserve" data-max-width="710"><tspan x="89" dy="0">def unique(xs):</tspan></text><text x="89" y="415.4" fill="#c3b5ff" font-size="26" font-weight="400" font-family="'SFMono-Regular',Consolas,monospace" xml:space="preserve" data-max-width="710"><tspan x="89" dy="0">    return list(dict.fromkeys(xs))</tspan></text><text x="900" y="341" fill="#a0e39b" font-size="29" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="350"><tspan x="900" dy="0">Контекст</tspan></text><path d="M955,362 L955,383" fill="none" stroke="#a0e39b" stroke-width="3" marker-end="url(#arrow)"/><text x="900" y="425" fill="#f4f4f8" font-size="29" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="350"><tspan x="900" dy="0">Выбрать токен</tspan></text><path d="M955,448 L955,468" fill="none" stroke="#a0e39b" stroke-width="3" marker-end="url(#arrow)"/><text x="900" y="510" fill="#a0e39b" font-size="26" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="370"><tspan x="900" dy="0">Добавить и повторить</tspan></text><text x="65" y="552" fill="#a6adbd" font-size="21" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1230"><tspan x="65" dy="0">Точная программа здесь иллюстрирует механизм; это не запись ответа модели.</tspan></text><path d="M64,588 L1296,588" fill="none" stroke="#343a48" stroke-width="3" /><text x="64" y="618" fill="#a0e39b" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="570"><tspan x="64" dy="0">КАК ЭТО РАБОТАЕТ</tspan></text><text x="64" y="652" fill="#f4f4f8" font-size="23" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="575"><tspan x="64" dy="0">Модель вычисляет оценки продолжений,</tspan><tspan x="64" dy="29.900000000000002">выбирается один токен, он добавляется к</tspan><tspan x="64" dy="29.900000000000002">контексту. Затем вычисляется следующий.</tspan></text><text x="710" y="618" fill="#a0e39b" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="580"><tspan x="710" dy="0">РАЗБОР ПРИМЕРА / РЕЗУЛЬТАТ</tspan></text><text x="710" y="652" fill="#f4f4f8" font-size="23" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="580"><tspan x="710" dy="0">Ниже — пример программы; у выбранного</tspan><tspan x="710" dy="29.900000000000002">токенизатора она кодируется 12 токенами.</tspan><tspan x="710" dy="29.900000000000002">Кодирование и генерация — разные операции.</tspan></text><text x="64" y="795" fill="#a6adbd" font-size="13" font-weight="650" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">СЛЕДУЮЩИЙ ВОПРОС</tspan></text><text x="64" y="829" fill="#a6adbd" font-size="21" font-weight="400" font-family="Inter,'Segoe UI',Arial,sans-serif" xml:space="preserve" data-max-width="1225"><tspan x="64" dy="0">Можно углубиться в токенизацию, устройство модели или обучение поведению помощника.</tspan></text></svg>
